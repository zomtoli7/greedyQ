:false},"message":"Select one response. The requested answer is Somewhat agree."}]},{"id":"outcomes","title":"Your opinion","body":"","questions":[{"id":"support_post","type":"slider","label":"After reading the description, how much do you support the proposed program?","options":[{"label":"Strongly oppose","value":1},{"label":"Oppose","value":2},{"label":"Somewhat oppose","value":3},{"label":"Neither support nor oppose","value":4},{"label":"Somewhat support","value":5},{"label":"Support","value":6},{"label":"Strongly support","value":7}],"required":true},{"id":"usefulness","type":"matrix","label":"Please indicate your agreement with each statement.","options":[{"label":"Strongly disagree","value":1},{"label":"Disagree","value":2},{"label":"Neither","value":3},{"label":"Agree","value":4},{"label":"Strongly agree","value":5}],"rows":[{"label":"The program would be useful to residents.","value":"residents"},{"label":"The program would make online services easier to access.","value":"access"}],"required":true},{"id":"opposition_reason","type":"textarea","label":"What is the main reason you do not support the proposed program?","placeholder":"Optional additional detail","required":false,"show_if":{"field":"support_post","lte":3}},{"id":"comments","type":"textarea","label":"Is there anything else you would like the research team to know?","placeholder":"Optional","required":false}],"show_previous":true,"previous_mode":"show","next_mode":"show","next_delay_seconds":0,"next":"demographics"},{"id":"demographics","title":"About you","body":"","questions":[{"id":"education","type":"select","label":"What is the highest level of education you have completed?","options":[{"label":"Less than secondary school","value":"less_secondary"},{"label":"Secondary school","value":"secondary"},{"label":"Some college or vocational education","value":"some_college"},{"label":"Bachelor's degree","value":"bachelors"},{"label":"Graduate or professional degree","value":"graduate"},{"label":"Prefer not to answer","value":"prefer_not"}],"placeholder":"Choose one or prefer not to answer","required":false},{"id":"gender","type":"mc","label":"How do you describe your gender?","options":[{"label":"Woman","value":"woman"},{"label":"Man","value":"man"},{"label":"Non-binary","value":"nonbinary"},{"label":"Self-describe","value":"self_describe"},{"label":"Prefer not to answer","value":"prefer_not"}],"required":false},{"id":"gender_self_description","type":"text","label":"How would you like to describe your gender?","placeholder":"Self-description","required":false,"show_if":{"field":"gender","equals":"self_describe"}}],"show_previous":true,"previous_mode":"show","next_mode":"show","next_delay_seconds":0,"next":"participant_control"},{"id":"participant_control","title":"Before submitting","body":"You may submit the study or withdraw. Saving a withdrawal deletes this session's answers. Minimal administrative identifiers remain for panel return and duplicate prevention.","questions":[{"id":"withdraw_now","type":"mc","label":"What would you like to do?","options":[{"label":"Submit my responses","value":"submit"},{"label":"Withdraw from the study","value":"withdraw"}],"required":true},{"id":"deletion_request","type":"mc","label":"Withdrawing deletes the answers collected in this session. Please confirm before continuing.","options":[{"label":"I understand that my answers will be deleted","value":"yes"}],"required":true,"show_if":{"field":"withdraw_now","equals":"withdraw"}}],"show_previous":true,"previous_mode":"show","next_mode":"show","next_delay_seconds":0,"next":"complete","routes":[{"when":{"field":"withdraw_now","equals":"withdraw"},"to":"withdrawn"},{"when":{"field":"withdraw_now","equals":"submit"},"to":"complete"}],"checks":[{"question":"deletion_request","when":{"all":[{"field":"withdraw_now","equals":"withdraw"},{"field":"deletion_request","answered":false}]},"message":"Confirm that withdrawing deletes this session's answers before continuing."}]},{"id":"complete","title":"Thank you","body":"Your responses have been submitted. In a production panel run, greedyQ now uses the verified completion route.","questions":[],"show_previous":true,"previous_mode":"show","next_mode":"show","next_delay_seconds":0,"terminal":"completed","redirect":{"url":"https://app.prolific.com/submissions/complete?cc=EXAMPLE_COMPLETE","params":{},"delay":null,"newtab":false,"label":"Continue to the next website"}},{"id":"screened_out","title":"You are not eligible","body":"This fixture is limited to adults. No research questions beyond consent and eligibility were collected.","questions":[],"show_previous":true,"previous_mode":"show","next_mode":"show","next_delay_seconds":0,"terminal":"screened_out","redirect":{"url":"https://app.prolific.com/submissions/complete?cc=EXAMPLE_SCREENOUT","params":{},"delay":null,"newtab":false,"label":"Continue to the next website"}},{"id":"consent_refused","title":"Participation declined","body":"No research responses were collected. You may close this page or follow the configured panel return route.","questions":[],"show_previous":true,"previous_mode":"show","next_mode":"show","next_delay_seconds":0,"terminal":"consent_refused","redirect":{"url":"https://app.prolific.com/submissions/complete?cc=EXAMPLE_REFUSAL","params":{},"delay":null,"newtab":false,"label":"Continue to the next website"}},{"id":"withdrawn","title":"Participation ended","body":"Saving this withdrawal deletes the session's answers. If a saving error appears, retry before leaving. Minimal administrative identifiers remain for panel return and duplicate prevention.","questions":[],"show_previous":true,"previous_mode":"show","next_mode":"show","next_delay_seconds":0,"terminal":"withdrawn","redirect":{"url":"https://app.prolific.com/submissions/complete?cc=EXAMPLE_WITHDRAWN","params":{},"delay":null,"newtab":false,"label":"Continue to the next website"}},{"id":"technical_error","title":"We could not continue","body":"The study encountered a technical problem. In a production panel run, greedyQ uses the separately configured technical-error route.","questions":[],"show_previous":true,"previous_mode":"show","next_mode":"show","next_delay_seconds":0,"terminal":"technical_error","redirect":{"url":"https://app.prolific.com/submissions/complete?cc=EXAMPLE_ERROR","params":{},"delay":null,"newtab":false,"label":"Continue to the next website"}}],"runtime_policy":{"prolific":{"study_id":null,"identity_verification":"url_parameters_only","screening_mode":"none","completion_paths_reviewed":false,"paths":{"complete":{"page":"complete","status":"completed","url":"https://app.prolific.com/submissions/complete?cc=EXAMPLE_COMPLETE","code":"EXAMPLE_COMPLETE"},"screened_out":{"page":"screened_out","status":"screened_out","url":"https://app.prolific.com/submissions/complete?cc=EXAMPLE_SCREENOUT","code":"EXAMPLE_SCREENOUT"},"consent_refused":{"page":"consent_refused","status":"consent_refused","url":"https://app.prolific.com/submissions/complete?cc=EXAMPLE_REFUSAL","code":"EXAMPLE_REFUSAL"},"withdrawn":{"page":"withdrawn","status":"withdrawn","url":"https://app.prolific.com/submissions/complete?cc=EXAMPLE_WITHDRAWN","code":"EXAMPLE_WITHDRAWN"},"technical_error":{"page":"technical_error","status":"technical_error","url":"https://app.prolific.com/submissions/complete?cc=EXAMPLE_ERROR","code":"EXAMPLE_ERROR"}}},"mode":"test","consent":{"question":"consent_choice","accept_value":"yes","refusal_outcome":"consent_refused"},"respondent_source":"prolific","duplicate_policy":"resume"},"assignment_page":"baseline","randomization":{"id":"information_frame","unit":"respondent","method":"fixed_block","block_size":4,"conditions":{"control":1,"treatment":1},"assignment_point":{"after_page":"baseline","before_condition_pages":["stimulus_control","stimulus_treatment"]},"persistence_key":"session_id","source_file":"design/stimuli.csv","store":{"condition_as":"assignment_condition","block_as":"assignment_block","draw_as":"assignment_draw","timestamp_as":"assignment_at","spec_version_as":"assignment_spec_version"}}}</script>
    <script>
      const surveyLanguage=JSON.parse(document.getElementById('greedyq-model').textContent).language || 'en';
      document.documentElement.lang=surveyLanguage;
      document.title=JSON.parse(document.getElementById('greedyq-model').textContent).title || 'greedyQ';
      const ui=(message)=>greedyQ.translate(surveyLanguage,message);
      (async () => {
        const model = JSON.parse(
            document.getElementById("greedyq-model").textContent,
          ),
          deployment = JSON.parse(
            document.getElementById("greedyq-deployment").textContent,
          ),
          root = document.getElementById("survey"),
          params = new URLSearchParams(location.search);
        let externalIdentifiers = null;
        document.documentElement.style.setProperty(
          "--gq-brand",
          model.brand_color || "#315c8a",
        );
        if (model.runtime_policy?.respondent_source?.startsWith("prolific")) {
          const launch = greedyQ.resolveProlificLaunch(
            location.search,
            model.runtime_policy.mode,
            model.runtime_policy.prolific?.study_id,
          );
          if (launch.status !== "passed") {
            root.innerHTML =
              `<main class="gq-card"><h1>${ui('Survey link incomplete')}</h1><p>${ui('Please return to Prolific and open the study from your task page.')}</p></main>`;
            return;
          }
          externalIdentifiers = launch.identifiers;
        }
        const previewToken=params.get('gq_preview');
        if(params.has('gq_preview')){
          if(model.runtime_policy?.mode!=='test' || !externalIdentifiers || !/^[a-f0-9]{64}$/.test(previewToken || ''))throw new Error('Invalid preview launch.');
          document.getElementById('preview-tools').hidden=false;
          document.getElementById('preview-label').textContent=surveyLanguage==='ko'?'반복 시험 중 · 실제 응답으로 수집되지 않습니다.':'Repeat preview · Test responses only.';
          const restart=document.getElementById('preview-restart');restart.textContent=surveyLanguage==='ko'?'새 시험 시작':'Start a new test';
          restart.onclick=()=>{
            const key=`greedyq-capability:${JSON.stringify([model.study_id,'test',externalIdentifiers,previewToken])}`;
            localStorage.removeItem(key);location.reload();
          };
        }
        const scope=JSON.stringify([model.study_id,model.runtime_policy?.mode || 'test',externalIdentifiers || 'direct']);
        const sessionId=greedyQ.stableSessionId(scope,externalIdentifiers?null:params.get('session'));
        if (deployment.mode === "supabase")
          await greedyQ.mountSupabaseRespondent(root, model, {
            url: deployment.supabase_url,
            anonKey: deployment.supabase_anon_key,
            sessionId,
            externalIdentifiers,
            previewToken,
            onError: (error) => {
              if (!root.querySelector("[data-save-error]"))
                root.insertAdjacentHTML(
                  "afterbegin",
                  `<p class="gq-error" data-save-error>${ui('Your response could not be saved. Please check your connection before continuing.')}</p>`,
                );
              console.error(error);
            },
          });
        else {
          const backend=greedyQ.createLocalMockBackend(`greedyq:${model.study_id}`);
          await backend.ready;
          greedyQ.mountRespondent(root, model, {
            mode: greedyQ.detectDevice(),
            backend,
            sessionId,
          });
        }
      })().catch((error) => {
        document.getElementById("survey").innerHTML =
          `<main class="gq-card"><h1>${ui('Survey unavailable')}</h1><p>${ui(error.kind==='prolific_duplicate'?'A response already exists. Reopen this study in the browser where you started, or contact the researcher.':'The secure data connection could not be started.')}</p></main>`;
        console.error(error);
      });
    </script>
