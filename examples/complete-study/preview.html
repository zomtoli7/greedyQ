<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'none'; img-src data:; base-uri 'none'"><title>greedyQ dual preview</title><link rel="stylesheet" href="greedyq-runtime.css"><style>body{margin:0;background:#101828;color:#fff;font-family:Inter,system-ui,sans-serif}.preview-head{padding:18px 24px;display:flex;align-items:center;gap:12px}.preview-head span{background:#fdb022;color:#111;padding:4px 9px;border-radius:99px;font-size:12px;font-weight:800}.preview-grid{display:grid;grid-template-columns:minmax(620px,1fr) 390px;gap:20px;padding:0 20px 24px;align-items:start}.viewport{background:white;color:#172033;border-radius:16px;overflow:hidden;height:780px}.viewport>header{padding:8px 12px;background:#e9edf3;font-size:12px;font-weight:800}.screen{height:calc(100% - 34px);overflow:auto}.mobile{max-width:390px}.tools{padding:0 24px 18px;color:#d0d5dd;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tools button,.tools select{padding:8px 12px}.state{margin:0 20px 20px;background:#1d2939;padding:12px;border-radius:10px;white-space:pre-wrap;font:12px/1.4 monospace}@media(max-width:1050px){.preview-grid{grid-template-columns:1fr}.mobile{max-width:none}.viewport{height:700px}}</style></head><body><div class="preview-head"><b>greedyQ responsive preview</b><span>NO EXTERNAL WRITES</span></div><div class="tools"><button id="reset">Reset both virtual participants</button><label>Desktop condition <select id="condition"></select></label><label>Desktop page <select id="page"></select></label><span>Both panes use independent mock sessions.</span></div><main class="preview-grid"><section class="viewport"><header>Desktop · wide-screen mode</header><div class="screen"><div id="desktop"></div></div></section><section class="viewport mobile"><header>Mobile · 390px mode</header><div class="screen"><div id="mobile"></div></div></section></main><pre id="state" class="state"></pre><script src="greedyq-core.js"></script><script id="greedyq-model" type="application/json">{"study_id":"digital_service_info_001","title":"Digital Service Information Study","start_page":"welcome","brand_color":"#315c8a","messages":{"previous":"Previous","next":"Next","required":"Please answer the required questions before continuing."},"conditions":["control","treatment"],"progress_paths":{"control":["welcome","consent","eligibility","baseline","stimulus_control","post_measure","outcomes","demographics","participant_control","complete"],"treatment":["welcome","consent","eligibility","baseline","stimulus_treatment","post_measure","outcomes","demographics","participant_control","complete"]},"pages":[{"id":"welcome","title":"Digital Service Information Study","body":"This fictional research fixture asks about a hypothetical municipal program. It takes approximately five minutes.\n\nIf you arrived through a respondent panel, your panel identifiers are validated before this page but are not displayed here.","questions":[],"show_previous":false,"next":"consent","next_label":"Read participant information"},{"id":"consent","title":"Participant information and consent","body":"Please read the versioned participant information and consent. The study is voluntary, and you may stop at any time.","questions":[{"id":"consent_choice","type":"mc","label":"Do you consent to participate in this study?","options":[{"label":"Yes, I consent","value":"yes"},{"label":"No, I do not consent","value":"no"}],"required":true}],"show_previous":false,"next":"eligibility","next_label":"Continue","routes":[{"when":{"field":"consent_choice","equals":"no"},"to":"consent_refused"}]},{"id":"eligibility","title":"Eligibility","body":"","questions":[{"id":"age","type":"numeric","label":"What is your age in years?","placeholder":"Age","required":true,"max":120,"min":0}],"show_previous":true,"next":"baseline","routes":[{"when":{"field":"age","lt":18},"to":"screened_out"}]},{"id":"baseline","title":"Your current views","body":"The program described later in the study is fictional.","questions":[{"id":"support_pre","type":"slider","label":"Before seeing details, how much would you support a city program that helps residents use online public services?","options":[{"label":"Strongly oppose","value":1},{"label":"Oppose","value":2},{"label":"Somewhat oppose","value":3},{"label":"Neither support nor oppose","value":4},{"label":"Somewhat support","value":5},{"label":"Support","value":6},{"label":"Strongly support","value":7}],"required":true},{"id":"familiarity","type":"select","label":"Before today, how familiar were you with municipal digital-assistance programs?","options":[{"label":"Not at all familiar","value":"none"},{"label":"Slightly familiar","value":"slight"},{"label":"Moderately familiar","value":"moderate"},{"label":"Very familiar","value":"very"}],"placeholder":"Choose one","required":true}],"show_previous":true,"next":"stimulus_control","routes":[{"when":{"field":"condition","equals":"control"},"to":"stimulus_control"},{"when":{"field":"condition","equals":"treatment"},"to":"stimulus_treatment"}]},{"id":"stimulus_control","title":"Municipal Digital Help Desk","body":"The city is considering a program with telephone and in-person help for residents using online public services. The proposal would operate at three libraries, five days per week, with an estimated annual budget of $600,000.","questions":[],"show_previous":true,"next":"post_measure","next_label":"Continue"},{"id":"stimulus_treatment","title":"Making Online Public Services Easier","body":"The city is considering a program with telephone and in-person help so residents can complete online public services more easily and avoid unnecessary trips. The proposal would operate at three libraries, five days per week, with an estimated annual budget of $600,000.","questions":[],"show_previous":true,"next":"post_measure","next_label":"Continue"},{"id":"post_measure","title":"Questions about the description","body":"","questions":[{"id":"comprehension","type":"mc","label":"At how many libraries would the proposed program operate?","options":[{"label":"One library","value":"one_library"},{"label":"Three libraries","value":"three_libraries"},{"label":"Five libraries","value":"five_libraries"},{"label":"The description did not say","value":"not_stated"}],"required":true},{"id":"frame_perception","type":"slider","label":"How strongly did the description emphasize practical benefits to residents?","options":[{"label":"Not at all","value":1},{"label":"2","value":2},{"label":"3","value":3},{"label":"4","value":4},{"label":"5","value":5},{"label":"6","value":6},{"label":"Very strongly","value":7}],"required":true},{"id":"attention_check","type":"mc","label":"For data-quality purposes, please select ‘Somewhat agree.’","options":[{"label":"Strongly disagree","value":1},{"label":"Disagree","value":2},{"label":"Somewhat disagree","value":3},{"label":"Neither agree nor disagree","value":4},{"label":"Somewhat agree","value":5},{"label":"Agree","value":6},{"label":"Strongly agree","value":7}],"required":true}],"show_previous":true,"next":"outcomes"},{"id":"outcomes","title":"Your opinion","body":"","questions":[{"id":"support_post","type":"slider","label":"After reading the description, how much do you support the proposed program?","options":[{"label":"Strongly oppose","value":1},{"label":"Oppose","value":2},{"label":"Somewhat oppose","value":3},{"label":"Neither support nor oppose","value":4},{"label":"Somewhat support","value":5},{"label":"Support","value":6},{"label":"Strongly support","value":7}],"required":true},{"id":"usefulness","type":"matrix","label":"Please indicate your agreement with each statement.","options":[{"label":"Strongly disagree","value":1},{"label":"Disagree","value":2},{"label":"Neither","value":3},{"label":"Agree","value":4},{"label":"Strongly agree","value":5}],"rows":[{"label":"The program would be useful to residents.","value":"residents"},{"label":"The program would make online services easier to access.","value":"access"}],"required":true},{"id":"opposition_reason","type":"textarea","label":"What is the main reason you do not support the proposed program?","placeholder":"Optional additional detail","required":false,"show_if":{"field":"support_post","lte":3}},{"id":"comments","type":"textarea","label":"Is there anything else you would like the research team to know?","placeholder":"Optional","required":false}],"show_previous":true,"next":"demographics"},{"id":"demographics","title":"About you","body":"","questions":[{"id":"education","type":"select","label":"What is the highest level of education you have completed?","options":[{"label":"Less than secondary school","value":"less_secondary"},{"label":"Secondary school","value":"secondary"},{"label":"Some college or vocational education","value":"some_college"},{"label":"Bachelor's degree","value":"bachelors"},{"label":"Graduate or professional degree","value":"graduate"},{"label":"Prefer not to answer","value":"prefer_not"}],"placeholder":"Choose one or prefer not to answer","required":false},{"id":"gender","type":"mc","label":"How do you describe your gender?","options":[{"label":"Woman","value":"woman"},{"label":"Man","value":"man"},{"label":"Non-binary","value":"nonbinary"},{"label":"Self-describe","value":"self_describe"},{"label":"Prefer not to answer","value":"prefer_not"}],"required":false},{"id":"gender_self_description","type":"text","label":"How would you like to describe your gender?","placeholder":"Self-description","required":false,"show_if":{"field":"gender","equals":"self_describe"}}],"show_previous":true,"next":"participant_control"},{"id":"participant_control","title":"Before submitting","body":"You may submit the study, withdraw, or record a request for the fictional research team to delete the responses associated with this session.","questions":[{"id":"withdraw_now","type":"mc","label":"What would you like to do?","options":[{"label":"Submit my responses","value":"submit"},{"label":"Withdraw from the study","value":"withdraw"}],"required":true},{"id":"deletion_request","type":"mc","label":"Should the research team receive a request to delete responses already collected in this session?","options":[{"label":"Yes, record a deletion request","value":"yes"},{"label":"No","value":"no"}],"required":true,"show_if":{"field":"withdraw_now","equals":"withdraw"}}],"show_previous":true,"next":"complete","routes":[{"when":{"field":"withdraw_now","equals":"withdraw"},"to":"withdrawn"},{"when":{"field":"withdraw_now","equals":"submit"},"to":"complete"}]},{"id":"complete","title":"Thank you","body":"Your responses have been submitted. In a production panel run, greedyQ now uses the verified completion route.","questions":[],"show_previous":true,"terminal":"completed"},{"id":"screened_out","title":"You are not eligible","body":"This fixture is limited to adults. No research questions beyond consent and eligibility were collected.","questions":[],"show_previous":true,"terminal":"screened_out"},{"id":"consent_refused","title":"Participation declined","body":"No research responses were collected. You may close this page or follow the configured panel return route.","questions":[],"show_previous":true,"terminal":"consent_refused"},{"id":"withdrawn","title":"Participation ended","body":"The session is marked as withdrawn. If you requested deletion, the request has been recorded for the research team; this message does not claim deletion is complete.","questions":[],"show_previous":true,"terminal":"withdrawn"},{"id":"technical_error","title":"We could not continue","body":"The study encountered a technical problem. In a production panel run, greedyQ uses the separately configured technical-error route.","questions":[],"show_previous":true,"terminal":"technical_error"}],"runtime_policy":{"mode":"test","consent":{"question":"consent_choice","accept_value":"yes","refusal_outcome":"consent_refused"},"respondent_source":"prolific","duplicate_policy":"resume"},"assignment_page":"baseline"}</script><script>const model=JSON.parse(document.getElementById("greedyq-model").textContent),backend=greedyQ.createLocalMockBackend(`greedyq-preview:${model.study_id}`),show=()=>document.getElementById("state").textContent=JSON.stringify(backend.inspect(),null,2);let desktop=greedyQ.mountRespondent(document.getElementById("desktop"),model,{mode:"desktop",backend,sessionId:"preview-desktop",onState:show}),mobile=greedyQ.mountRespondent(document.getElementById("mobile"),model,{mode:"mobile",backend,sessionId:"preview-mobile",onState:show});for(const value of model.conditions)document.getElementById("condition").add(new Option(value,value));for(const p of model.pages)document.getElementById("page").add(new Option(`${p.title} [${p.id}]`,p.id));document.getElementById("reset").onclick=()=>{desktop.reset();mobile.reset();show()};document.getElementById("condition").onchange=e=>{desktop.state.condition=e.target.value;desktop.state.page=model.assignment_page||model.start_page;desktop.state.history=[];desktop.render();show()};document.getElementById("page").onchange=e=>{desktop.state.page=e.target.value;desktop.render();show()};show();</script></body></html>
