<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'none'; img-src 'self' data: https:; base-uri 'none'"
    />
    <title>greedyQ dual preview</title>
    <link rel="stylesheet" href="greedyq-runtime.css" />
    <style>
      body {
        margin: 0;
        background: #101828;
        color: #fff;
        font-family: Inter, system-ui, sans-serif;
      }
      .preview-head {
        padding: 18px 24px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .preview-head span {
        background: #fdb022;
        color: #111;
        padding: 4px 9px;
        border-radius: 99px;
        font-size: 12px;
        font-weight: 800;
      }
      .preview-grid {
        display: grid;
        grid-template-columns: minmax(620px, 1fr) 390px;
        gap: 20px;
        padding: 0 20px 24px;
        align-items: start;
      }
      .viewport {
        background: white;
        color: #172033;
        border-radius: 16px;
        overflow: hidden;
        height: 780px;
      }
      .viewport > header {
        padding: 8px 12px;
        background: #e9edf3;
        font-size: 12px;
        font-weight: 800;
      }
      .screen {
        height: calc(100% - 34px);
        overflow: auto;
      }
      .mobile {
        max-width: 390px;
        width: min(390px, 100%);
        justify-self: center;
      }
      .tools {
        padding: 0 24px 18px;
        color: #d0d5dd;
        font-size: 13px;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .tools button,
      .tools select {
        padding: 8px 12px;
      }
      .state {
        margin: 0 20px 20px;
        background: #1d2939;
        padding: 12px;
        border-radius: 10px;
        white-space: pre-wrap;
        font: 12px/1.4 monospace;
      }
      @media (max-width: 1050px) {
        .preview-grid {
          grid-template-columns: 1fr;
        }
        .viewport {
          height: 700px;
        }
      }
    </style>
  </head>
  <body>
    <div class="preview-head">
      <b>greedyQ responsive preview</b><span>NO EXTERNAL WRITES</span>
    </div>
    <div class="tools">
      <button id="reset">Reset both virtual participants</button
      ><label
        >Desktop condition
        <select id="condition"></select></label
      ><label
        >Desktop page
        <select id="page"></select></label
      ><span>Both panes use independent mock sessions.</span>
    </div>
    <main class="preview-grid">
      <section class="viewport">
        <header>Desktop · wide-screen mode</header>
        <div class="screen"><div id="desktop"></div></div>
      </section>
      <section class="viewport mobile">
        <header>Mobile · 390px mode</header>
        <div class="screen"><div id="mobile"></div></div>
      </section>
    </main>
    <pre id="state" class="state"></pre>
    <script src="greedyq-core.js"></script>
    <script id="greedyq-model" type="application/json">{"study_id":"control_gallery","title":"greedyQ Control Gallery","organization":"greedyQ","start_page":"controls","brand_color":"#315c8a","messages":{"previous":"Previous","next":"Continue","required":"Please answer the required questions before continuing."},"conditions":["default"],"progress_paths":{"default":["controls","complete"]},"pages":[{"id":"controls","title":"All surveydown-compatible controls","body":"Use this page to test every control in desktop and mobile preview modes.","questions":[{"id":"short_text","type":"text","label":"Text","placeholder":"Type here","required":false},{"id":"long_text","type":"textarea","label":"Textarea","placeholder":"Write more","height":"120px","resize":"vertical","cols":50,"required":false},{"id":"number","type":"numeric","label":"Numeric","min":0,"max":100,"required":false},{"id":"single","type":"mc","label":"Single choice","options":[{"label":"Alpha","value":"a"},{"label":"Beta","value":"b"}],"required":false},{"id":"multiple","type":"mc_multiple","label":"Multiple choice","options":[{"label":"Alpha","value":"a"},{"label":"Beta","value":"b"}],"required":false},{"id":"buttons","type":"mc_buttons","label":"Single-choice buttons","options":[{"label":"Alpha","value":"a"},{"label":"Beta","value":"b"}],"justified":true,"required":false},{"id":"multi_buttons","type":"mc_multiple_buttons","label":"Multiple-choice buttons","options":[{"label":"Alpha","value":"a"},{"label":"Beta","value":"b"}],"direction":"vertical","required":false},{"id":"image","type":"mc_image","label":"Single image choice","options":[{"label":"Blue square","value":"blue","caption":true},{"label":"Gold circle","value":"gold","caption":true}],"images":["images/blue.svg","images/gold.svg"],"required":false},{"id":"multi_image","type":"mc_multiple_image","label":"Multiple image choice","options":[{"label":"Blue square","value":"blue","caption":true},{"label":"Gold circle","value":"gold","caption":true}],"images":["images/blue.svg","images/gold.svg"],"required":false},{"id":"menu","type":"select","label":"Select","options":[{"label":"Alpha","value":"a"},{"label":"Beta","value":"b"}],"placeholder":"Choose one","required":false},{"id":"labeled_slider","type":"slider","label":"Labeled slider","options":[{"label":"Low","value":"low"},{"label":"Middle","value":"middle"},{"label":"High","value":"high"}],"selected":"middle","required":false},{"id":"numeric_slider","type":"slider_numeric","label":"Numeric slider","options":[{"label":"0","value":0},{"label":"1","value":1},{"label":"2","value":2},{"label":"3","value":3},{"label":"4","value":4},{"label":"5","value":5},{"label":"6","value":6},{"label":"7","value":7},{"label":"8","value":8},{"label":"9","value":9},{"label":"10","value":10}],"default":5,"pre":"Score: ","required":false},{"id":"range_slider","type":"slider_numeric","label":"Range slider","options":[{"label":"0","value":0},{"label":"1","value":1},{"label":"2","value":2},{"label":"3","value":3},{"label":"4","value":4},{"label":"5","value":5},{"label":"6","value":6},{"label":"7","value":7},{"label":"8","value":8},{"label":"9","value":9},{"label":"10","value":10}],"default":[3,7],"sep":" to ","required":false},{"id":"one_date","type":"date","label":"Date","required":false},{"id":"date_range","type":"daterange","label":"Date range","required":false},{"id":"one_matrix","type":"matrix","label":"Single-choice matrix","options":[{"label":"No","value":"no"},{"label":"Yes","value":"yes"}],"rows":[{"label":"First row","value":"first"},{"label":"Second row","value":"second"}],"required":false},{"id":"multi_matrix","type":"matrix_multiple","label":"Multiple-choice matrix","options":[{"label":"Web","value":"web"},{"label":"App","value":"app"}],"rows":[{"label":"First row","value":"first"},{"label":"Second row","value":"second"}],"required":false}],"show_previous":true,"next":"complete"},{"id":"complete","title":"Control test complete","body":"All controls were displayed.","questions":[],"show_previous":true,"terminal":"completed"}],"runtime_policy":{"mode":"test","consent":null,"respondent_source":"direct_link","duplicate_policy":"resume"}}</script>
    <script>
      const model = JSON.parse(
          document.getElementById("greedyq-model").textContent,
        ),
        backend = greedyQ.createLocalMockBackend(
          `greedyq-preview:${model.study_id}`,
        ),
        show = () =>
          (document.getElementById("state").textContent = JSON.stringify(
            backend.inspect(),
            null,
            2,
          ));
      let desktop = greedyQ.mountRespondent(
          document.getElementById("desktop"),
          model,
          {
            mode: "desktop",
            backend,
            sessionId: "preview-desktop",
            onState: show,
          },
        ),
        mobile = greedyQ.mountRespondent(
          document.getElementById("mobile"),
          model,
          {
            mode: "mobile",
            backend,
            sessionId: "preview-mobile",
            onState: show,
          },
        );
      for (const value of model.conditions)
        document.getElementById("condition").add(new Option(value, value));
      for (const p of model.pages)
        document
          .getElementById("page")
          .add(new Option(`${p.title} [${p.id}]`, p.id));
      document.getElementById("reset").onclick = () => {
        desktop.reset();
        mobile.reset();
        show();
      };
      document.getElementById("condition").onchange = (e) => {
        desktop.state.condition = e.target.value;
        desktop.state.page = model.assignment_page || model.start_page;
        desktop.state.history = [];
        desktop.render();
        show();
      };
      document.getElementById("page").onchange = (e) => {
        desktop.state.page = e.target.value;
        desktop.render();
        show();
      };
      show();
    </script>
  </body>
</html>
