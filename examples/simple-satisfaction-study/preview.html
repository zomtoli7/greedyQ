<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'none'; img-src 'self' data: https:; base-uri 'none'"
    />
    <title>greedyQ dual preview</title>
    <link rel="stylesheet" href="greedyq-runtime.css" />
    <style>
      body {
        margin: 0;
        background: #101828;
        color: #fff;
        font-family: Inter, system-ui, sans-serif;
      }
      .preview-head {
        padding: 18px 24px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .preview-head span {
        background: #fdb022;
        color: #111;
        padding: 4px 9px;
        border-radius: 99px;
        font-size: 12px;
        font-weight: 800;
      }
      .preview-grid {
        display: grid;
        grid-template-columns: minmax(620px, 1fr) 390px;
        gap: 20px;
        padding: 0 20px 24px;
        align-items: start;
      }
      .viewport {
        background: white;
        color: #172033;
        border-radius: 16px;
        overflow: hidden;
        height: 780px;
      }
      .viewport > header {
        padding: 8px 12px;
        background: #e9edf3;
        font-size: 12px;
        font-weight: 800;
      }
      .screen {
        height: calc(100% - 34px);
        overflow: auto;
      }
      .mobile {
        max-width: 390px;
        width: min(390px, 100%);
        justify-self: center;
      }
      .tools {
        padding: 0 24px 18px;
        color: #d0d5dd;
        font-size: 13px;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .tools button,
      .tools select {
        padding: 8px 12px;
      }
      .tools button {
        border: 1px solid #98a2b3;
        border-radius: 7px;
        background: #fff;
        color: #101828;
        font-weight: 700;
        cursor: pointer;
      }
      dialog {
        width: min(760px, calc(100vw - 32px));
        max-height: min(82vh, 850px);
        padding: 0;
        border: 0;
        border-radius: 16px;
        box-shadow: 0 24px 80px #0008;
        color: #172033;
      }
      dialog::backdrop {
        background: #101828b8;
      }
      .structure-head {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 18px 20px;
        border-bottom: 1px solid #d0d5dd;
        background: #fff;
      }
      .structure-head h2 {
        margin: 0 0 4px;
        font-size: 20px;
      }
      .structure-head p {
        margin: 0;
        color: #667085;
        font-size: 13px;
      }
      .structure-head button {
        align-self: start;
      }
      .structure-tree {
        padding: 16px 20px 22px;
        overflow: auto;
      }
      .structure-tree details {
        border: 1px solid #d0d5dd;
        border-radius: 10px;
        margin: 0 0 10px;
      }
      .structure-tree summary {
        padding: 12px;
        cursor: pointer;
        font-weight: 750;
        background: #f8fafc;
      }
      .structure-items {
        margin: 0;
        padding: 6px 12px 10px 42px;
        list-style: none;
      }
      .structure-items li {
        display: grid;
        grid-template-columns: 28px 1fr;
        gap: 8px;
        padding: 8px 0;
        border-bottom: 1px solid #eaecf0;
      }
      .structure-items li:last-child {
        border: 0;
      }
      .structure-badge {
        display: inline-grid;
        place-items: center;
        width: 24px;
        height: 24px;
        border-radius: 6px;
        background: #e9d7fe;
        color: #6941c6;
        font-size: 12px;
        font-weight: 850;
      }
      .structure-meta {
        color: #667085;
        font-size: 12px;
        margin-top: 2px;
      }
      .state {
        margin: 0 20px 20px;
        background: #1d2939;
        padding: 12px;
        border-radius: 10px;
        white-space: pre-wrap;
        font: 12px/1.4 monospace;
      }
      @media (max-width: 1050px) {
        .preview-grid {
          grid-template-columns: 1fr;
        }
        .viewport {
          height: 700px;
        }
      }
    </style>
  </head>
  <body>
    <div class="preview-head">
      <b>greedyQ responsive preview</b><span>NO EXTERNAL WRITES</span>
    </div>
    <div class="tools">
      <button id="reset">Reset both virtual participants</button
      ><button id="structure-open">View structure</button
      ><label
        >Desktop condition
        <select id="condition"></select></label
      ><label
        >Desktop page
        <select id="page"></select></label
      ><span>Both panes use independent mock sessions.</span>
    </div>
    <main class="preview-grid">
      <section class="viewport">
        <header>Desktop · wide-screen mode</header>
        <div class="screen"><div id="desktop"></div></div>
      </section>
      <section class="viewport mobile">
        <header>Mobile · 390px mode</header>
        <div class="screen"><div id="mobile"></div></div>
      </section>
    </main>
    <dialog id="structure-dialog" aria-labelledby="structure-title">
      <div class="structure-head">
        <div>
          <h2 id="structure-title">Survey structure</h2>
          <p>Pages, text, and questions in respondent order</p>
        </div>
        <button id="structure-close" aria-label="Close survey structure">
          Close
        </button>
      </div>
      <div id="structure-tree" class="structure-tree"></div>
    </dialog>
    <pre id="state" class="state"></pre>
    <script src="greedyq-core.js"></script>
    <script id="greedyq-model" type="application/json">{"study_id":"greedyq_user_satisfaction_001","study_version":"1.0.0-fixture","greedyq_version":"0.2_2026-09-09_ee423e6","title":"greedyQ User Experience Survey","organization":"greedyQ Research Team","start_page":"welcome","brand_color":"#315c8a","messages":{"previous":"Previous","next":"Next","required":"Please answer the required questions before continuing."},"conditions":["default"],"progress_paths":{"default":["welcome","consent","eligibility","usage","evaluation","problems","future_use","participant_control","complete"]},"pages":[{"id":"welcome","title":"Tell us about your greedyQ experience","body":"This survey is for people who have used greedyQ to create or revise a questionnaire. It takes about four minutes.","questions":[],"show_previous":false,"next":"consent","next_label":"Read participant information"},{"id":"consent","title":"Participant information and consent","body":"Please read the versioned participant information and consent. Taking part is voluntary, and you may stop at any time.","questions":[{"id":"consent_choice","type":"mc","label":"Do you consent to participate in this survey?","options":[{"label":"Yes, I consent","value":"yes"},{"label":"No, I do not consent","value":"no"}],"required":true}],"show_previous":false,"next":"eligibility","next_label":"Continue","routes":[{"when":{"field":"consent_choice","equals":"no"},"to":"consent_refused"}]},{"id":"eligibility","title":"About your eligibility","body":"","questions":[{"id":"age","type":"numeric","label":"What is your age in years?","placeholder":"Age","required":true,"max":120,"min":0},{"id":"used_greedyq","type":"mc","label":"Have you used greedyQ to create or revise a questionnaire?","options":[{"label":"Yes","value":"yes"},{"label":"No","value":"no"}],"required":true}],"show_previous":true,"next":"usage","routes":[{"when":{"field":"age","lt":18},"to":"screened_out"},{"when":{"field":"used_greedyq","equals":"no"},"to":"screened_out"}]},{"id":"usage","title":"How you used greedyQ","body":"","questions":[{"id":"use_frequency","type":"select","label":"How many times have you used greedyQ?","options":[{"label":"Once","value":"once"},{"label":"Two or three times","value":"two_three"},{"label":"Four or five times","value":"four_five"},{"label":"More than five times","value":"more_than_five"}],"placeholder":"Choose one","required":true},{"id":"primary_use","type":"select","label":"What was your main reason for using greedyQ most recently?","options":[{"label":"Create a new survey","value":"new_survey"},{"label":"Revise an existing survey","value":"revise_survey"},{"label":"Create a survey experiment","value":"experiment"},{"label":"Prepare consent or preregistration materials","value":"research_documents"},{"label":"Explore or test greedyQ","value":"exploration"},{"label":"Something else","value":"other"}],"placeholder":"Choose one","required":true},{"id":"primary_use_other","type":"text","label":"What was your main reason for using greedyQ?","placeholder":"Brief description","required":false,"show_if":{"field":"primary_use","equals":"other"}},{"id":"ai_host","type":"select","label":"Which AI product did you mainly use with greedyQ?","options":[{"label":"ChatGPT","value":"chatgpt"},{"label":"Claude","value":"claude"},{"label":"Codex","value":"codex"},{"label":"Claude Code","value":"claude_code"},{"label":"Another AI product","value":"other"},{"label":"I am not sure","value":"not_sure"}],"placeholder":"Choose one","required":true},{"id":"completion_status","type":"mc","label":"How far did you get in your most recent use?","options":[{"label":"I created and tested a complete survey","value":"tested_complete"},{"label":"I created a survey draft","value":"draft_created"},{"label":"I started but did not get a usable draft","value":"no_usable_draft"},{"label":"I was only exploring the workflow","value":"exploration_only"}],"required":true},{"id":"guide_access","type":"mc","label":"How did you give the greedyQ instructions to your AI?","options":[{"label":"I shared the greedyQ repository or START-HERE link","value":"repository_link"},{"label":"I attached the self-contained guide file","value":"guide_attachment"},{"label":"The instructions were already available in my coding agent","value":"local_repository"},{"label":"I am not sure","value":"not_sure"}],"required":true}],"show_previous":true,"next":"evaluation"},{"id":"evaluation","title":"Your experience","body":"","questions":[{"id":"overall_satisfaction","type":"slider","label":"Overall, how satisfied were you with greedyQ?","options":[{"label":"Very dissatisfied","value":1},{"label":"Dissatisfied","value":2},{"label":"Somewhat dissatisfied","value":3},{"label":"Neither satisfied nor dissatisfied","value":4},{"label":"Somewhat satisfied","value":5},{"label":"Satisfied","value":6},{"label":"Very satisfied","value":7}],"required":true},{"id":"experience_ratings","type":"matrix","label":"How much do you agree with each statement about greedyQ?","options":[{"label":"Strongly disagree","value":1},{"label":"Disagree","value":2},{"label":"Neither agree nor disagree","value":3},{"label":"Agree","value":4},{"label":"Strongly agree","value":5}],"rows":[{"label":"It was easy to get started.","value":"easy_start"},{"label":"The AI asked questions I could understand.","value":"clear_questions"},{"label":"The preview helped me evaluate the survey.","value":"useful_preview"},{"label":"The resulting survey matched my decisions.","value":"decision_fidelity"}],"required":true},{"id":"confidence","type":"slider","label":"How confident were you that the resulting survey reflected what you wanted?","options":[{"label":"Not at all confident","value":1},{"label":"Slightly confident","value":2},{"label":"Somewhat confident","value":3},{"label":"Moderately confident","value":4},{"label":"Very confident","value":5}],"required":true},{"id":"time_saved","type":"select","label":"Compared with your usual way of making a survey, how did greedyQ affect the time required?","options":[{"label":"It took much more time","value":"much_more"},{"label":"It took somewhat more time","value":"somewhat_more"},{"label":"It took about the same time","value":"same"},{"label":"It saved some time","value":"some_saved"},{"label":"It saved a great deal of time","value":"great_deal_saved"},{"label":"I cannot compare yet","value":"cannot_compare"}],"placeholder":"Choose one","required":true},{"id":"low_satisfaction_reason","type":"textarea","label":"What most contributed to your dissatisfaction?","placeholder":"Optional detail","required":false,"show_if":{"field":"overall_satisfaction","lte":3}}],"show_previous":true,"next":"problems"},{"id":"problems","title":"Problems you encountered","body":"","questions":[{"id":"had_problem","type":"mc","label":"Did you encounter a problem that made it harder to complete your survey?","options":[{"label":"Yes","value":"yes"},{"label":"No","value":"no"},{"label":"I am not sure","value":"not_sure"}],"required":true},{"id":"problem_area","type":"select","label":"Where did the most important problem occur?","options":[{"label":"The AI conversation or questions","value":"conversation"},{"label":"The survey questions or answer choices","value":"questionnaire"},{"label":"The participant preview","value":"preview"},{"label":"The generated files","value":"generated_files"},{"label":"Deployment or database setup","value":"deployment"},{"label":"Something else","value":"other"}],"placeholder":"Choose one","required":true,"show_if":{"field":"had_problem","equals":"yes"}},{"id":"problem_detail","type":"textarea","label":"What happened, and what would you have expected instead?","placeholder":"Please avoid including names, credentials, or private research data","required":false,"show_if":{"field":"had_problem","equals":"yes"}}],"show_previous":true,"next":"future_use"},{"id":"future_use","title":"Looking ahead","body":"","questions":[{"id":"recommend_score","type":"numeric","label":"How likely are you to recommend greedyQ to another researcher, from 0 (not at all likely) to 10 (extremely likely)?","placeholder":"0 to 10","required":true,"min":0,"max":10},{"id":"use_again","type":"mc","label":"Would you use greedyQ for another survey?","options":[{"label":"Definitely not","value":1},{"label":"Probably not","value":2},{"label":"Not sure","value":3},{"label":"Probably yes","value":4},{"label":"Definitely yes","value":5}],"required":true},{"id":"most_valuable","type":"textarea","label":"What was the most valuable part of greedyQ for you?","placeholder":"Optional","required":false},{"id":"improvement","type":"textarea","label":"What is the single most important improvement we should make?","placeholder":"Optional","required":false}],"show_previous":true,"next":"participant_control"},{"id":"participant_control","title":"Before submitting","body":"You may submit your feedback or withdraw. If you withdraw, you may also ask us to delete the responses associated with this session.","questions":[{"id":"withdraw_now","type":"mc","label":"What would you like to do?","options":[{"label":"Submit my feedback","value":"submit"},{"label":"Withdraw from the survey","value":"withdraw"}],"required":true},{"id":"deletion_request","type":"mc","label":"Should the research team receive a request to delete responses already collected in this session?","options":[{"label":"Yes, record a deletion request","value":"yes"},{"label":"No","value":"no"}],"required":true,"show_if":{"field":"withdraw_now","equals":"withdraw"}}],"show_previous":true,"next":"complete","routes":[{"when":{"field":"withdraw_now","equals":"withdraw"},"to":"withdrawn"},{"when":{"field":"withdraw_now","equals":"submit"},"to":"complete"}]},{"id":"complete","title":"Thank you","body":"Your feedback has been submitted. It will be used to improve greedyQ.","questions":[],"show_previous":true,"terminal":"completed"},{"id":"screened_out","title":"This survey is not the right fit","body":"This feedback survey is for adults who have already used greedyQ. No product-feedback questions were collected.","questions":[],"show_previous":true,"terminal":"screened_out"},{"id":"consent_refused","title":"Participation declined","body":"No product-feedback responses were collected. You may close this page.","questions":[],"show_previous":true,"terminal":"consent_refused"},{"id":"withdrawn","title":"Participation ended","body":"Your session is marked as withdrawn. If you requested deletion, the request has been recorded; this message does not claim deletion is already complete.","questions":[],"show_previous":true,"terminal":"withdrawn"},{"id":"technical_error","title":"We could not continue","body":"The survey encountered a technical problem. Please close this page and try again later.","questions":[],"show_previous":true,"terminal":"technical_error"}],"runtime_policy":{"mode":"test","consent":{"question":"consent_choice","accept_value":"yes","refusal_outcome":"consent_refused"},"respondent_source":"direct_link","duplicate_policy":"resume"}}</script>
    <script>
      const model = JSON.parse(
          document.getElementById("greedyq-model").textContent,
        ),
        backend = greedyQ.createLocalMockBackend(
          `greedyq-preview:${model.study_id}`,
        ),
        show = () =>
          (document.getElementById("state").textContent = JSON.stringify(
            backend.inspect(),
            null,
            2,
          ));
      let desktop = greedyQ.mountRespondent(
          document.getElementById("desktop"),
          model,
          {
            mode: "desktop",
            backend,
            sessionId: "preview-desktop",
            onState: show,
          },
        ),
        mobile = greedyQ.mountRespondent(
          document.getElementById("mobile"),
          model,
          {
            mode: "mobile",
            backend,
            sessionId: "preview-mobile",
            onState: show,
          },
        );
      for (const value of model.conditions)
        document.getElementById("condition").add(new Option(value, value));
      for (const p of model.pages)
        document
          .getElementById("page")
          .add(new Option(`${p.title} [${p.id}]`, p.id));
      document.getElementById("reset").onclick = () => {
        desktop.reset();
        mobile.reset();
        show();
      };
      const escapeHtml = (value) =>
          String(value ?? "").replace(
            /[&<>"']/g,
            (character) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[character],
          ),
        excerpt = (value) => {
          const words = String(value ?? "")
            .trim()
            .split(/\s+/)
            .filter(Boolean);
          return words.slice(0, 5).join(" ") + (words.length > 5 ? "…" : "");
        },
        structureDialog = document.getElementById("structure-dialog"),
        structureTree = document.getElementById("structure-tree");
      structureTree.innerHTML = model.pages
        .map((page, pageIndex) => {
          const items = [];
          if (page.body)
            items.push(
              `<li><span class="structure-badge">T</span><div>${escapeHtml(excerpt(page.body))}<div class="structure-meta">Text block</div></div></li>`,
            );
          for (const question of page.questions || [])
            items.push(
              `<li><span class="structure-badge">Q</span><div>${escapeHtml(question.label)}<div class="structure-meta"><code>${escapeHtml(question.id)}</code> · ${escapeHtml(question.type)}${question.required ? " · required" : ""}</div></div></li>`,
            );
          if (!items.length)
            items.push(
              `<li><span class="structure-badge">—</span><div>No content items</div></li>`,
            );
          return `<details ${pageIndex === 0 ? "open" : ""}><summary>${pageIndex + 1}. ${escapeHtml(page.title)} <code>[${escapeHtml(page.id)}]</code>${page.terminal ? ` · ${escapeHtml(page.terminal)}` : ""}</summary><ul class="structure-items">${items.join("")}</ul></details>`;
        })
        .join("");
      document.getElementById("structure-open").onclick = () =>
        structureDialog.showModal
          ? structureDialog.showModal()
          : structureDialog.setAttribute("open", "");
      document.getElementById("structure-close").onclick = () =>
        structureDialog.close
          ? structureDialog.close()
          : structureDialog.removeAttribute("open");
      structureDialog.onclick = (event) => {
        if (event.target === structureDialog) structureDialog.close();
      };
      document.getElementById("condition").onchange = (e) => {
        desktop.state.condition = e.target.value;
        desktop.state.page = model.assignment_page || model.start_page;
        desktop.state.history = [];
        desktop.render();
        show();
      };
      document.getElementById("page").onchange = (e) => {
        desktop.state.page = e.target.value;
        desktop.render();
        show();
      };
      show();
    </script>
  </body>
</html>
