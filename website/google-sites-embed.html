음·보통·높음 척도로 평가하게 해줘. 휴대폰에서도 버전 이름을 분명히 보여줘.\n\n컴퓨터·휴대폰 미리보기와 저장값을 설명하고, 연구 결정을 바꾸기 전에는 내게 확인해줘.","nps_example":"아래 greedyQ 시작 안내를 읽고 따라줘. 읽을 수 없으면 멈추고 알려줘:\n\u003chttps://greedyq.netlify.app/>\n\n서비스 추천 의향을 0~10으로 물어봐. 모든 숫자와 양 끝 설명을 보여줘.\n\n컴퓨터·휴대폰 미리보기와 저장값을 설명하고, 연구 결정을 바꾸기 전에는 내게 확인해줘.","timing":"아래 greedyQ 시작 안내를 읽고 따라줘. 읽을 수 없으면 멈추고 알려줘:\n\u003chttps://greedyq.netlify.app/>\n\n자극 페이지 체류 시간을 숨겨진 기록으로 남겨줘. 측정 시작·종료와 내보내는 값을 설명해줘. 제외 기준은 임의로 정하지 마.\n\n컴퓨터·휴대폰 미리보기와 저장값을 설명하고, 연구 결정을 바꾸기 전에는 내게 확인해줘.","sum_example":"아래 greedyQ 시작 안내를 읽고 따라줘. 읽을 수 없으면 멈추고 알려줘:\n\u003chttps://greedyq.netlify.app/>\n\n디자인·테스트·문서화에 정확히 100점을 나누게 해줘. 현재 합계를 보여주고 총합이 맞지 않으면 설명해줘.\n\n컴퓨터·휴대폰 미리보기와 저장값을 설명하고, 연구 결정을 바꾸기 전에는 내게 확인해줘.","group_rank_example":"아래 greedyQ 시작 안내를 읽고 따라줘. 읽을 수 없으면 멈추고 알려줘:\n\u003chttps://greedyq.netlify.app/>\n\n속도·신뢰·편의성을 필수 또는 선택 그룹으로 분류하고 그룹 안에서 순위를 정하게 해줘.\n\n컴퓨터·휴대폰 미리보기와 저장값을 설명하고, 연구 결정을 바꾸기 전에는 내게 확인해줘.","drill_example":"아래 greedyQ 시작 안내를 읽고 따라줘. 읽을 수 없으면 멈추고 알려줘:\n\u003chttps://greedyq.netlify.app/>\n\n지역·국가·도시 순서로 장소를 고르게 해줘. 선택한 국가의 도시만 보여주고 앞선 답이 바뀌면 맞지 않는 뒤쪽 선택은 정리해줘.\n\n컴퓨터·휴대폰 미리보기와 저장값을 설명하고, 연구 결정을 바꾸기 전에는 내게 확인해줘.","custom_example":"아래 greedyQ 시작 안내를 읽고 따라줘. 읽을 수 없으면 멈추고 알려줘:\n\u003chttps://greedyq.netlify.app/>\n\n제품 사진이 있는 카드 중에서 고르는 질문이 필요해. 비슷한 기존 예시가 있는지 먼저 찾아줘. 어떤 모양인지, 한 개 또는 여러 개를 고르는지, 휴대전화에서 어떻게 보이고 나중에 어떤 답이 자료에 남는지 나와 먼저 정해줘. 추가 시간이나 AI 사용량이 필요하면 시작 전에 설명해줘. 내가 확인한 뒤에 만들어줘.","look-colors":"아래 greedyQ 시작 안내를 읽고 따라줘. 읽을 수 없으면 멈추고 알려줘:\n\u003chttps://greedyq.netlify.app/>\n\n배경은 흰색, 글자는 짙은 회색, 주요 버튼은 짙은 녹색으로 바꿔줘. 글자가 잘 보이고 휴대전화에서 누르기 편한지 확인해줘. 질문과 답의 의미는 그대로 두고 컴퓨터·휴대전화 미리보기를 보여줘.","look-words":"아래 greedyQ 시작 안내를 읽고 따라줘. 읽을 수 없으면 멈추고 알려줘:\n\u003chttps://greedyq.netlify.app/>\n\n설문 위에 [대학 또는 연구실 이름]을 표시해줘. 질문 화면의 버튼은 “다음”, 마지막 응답을 보내는 버튼은 “제출”이라고 써줘. 이름만 바꾸고 기존 동작과 응답 기록은 그대로 유지해줘. 바뀐 화면을 보여줘.","look-buttons":"아래 greedyQ 시작 안내를 읽고 따라줘. 읽을 수 없으면 멈추고 알려줘:\n\u003chttps://greedyq.netlify.app/>\n\n동의 화면에서는 이전 버튼을 숨기고, 문항 화면에서는 표시하고, 최종 검토에서는 보이되 비활성화해줘. 승인한 자극 페이지에서 다음 버튼은 12초 후 활성화하고 남은 시간을 표시해줘. 컴퓨터·휴대폰에서 모든 상태를 보여줘.","first-draft":"아래 greedyQ 시작 안내를 읽고 따라줘. 읽을 수 없으면 멈추고 알려줘:\n\u003chttps://greedyq.netlify.app/>\n\ngreedyQ 시작 안내를 따라, 우리 서비스를 한 번 이상 이용한 사람에게 3분 이내 만족도 설문을 만들어줘. 전반적 만족도·사용 편의성·유용성·결과 품질·재이용 의향·개선점 한 가지를 다뤄줘. 문항 작성 방식을 먼저 확인하고 배포 전에 실제 미리보기를 보여줘.","first-manual":"아래 greedyQ 시작 안내를 읽고 따라줘. 읽을 수 없으면 멈추고 알려줘:\n\u003chttps://greedyq.netlify.app/>\n\n문항은 내가 직접 작성할게. 시작과 종료 화면만 만든 뒤 첫 문항을 물어봐. 미정인 결정을 임의로 채우지 마.","first-research":"아래 greedyQ 시작 안내를 읽고 따라줘. 읽을 수 없으면 멈추고 알려줘:\n\u003chttps://greedyq.netlify.app/>\n\n우선순위 다섯 개를 순서대로 정하고 세 활동에 정확히 100점을 나누는 문항을 만들어줘. 저장될 응답의 의미를 설명하고 컴퓨터·모바일에서 보여준 뒤 승인을 받아줘."},"examplesArchived":"\u003cp>가상 문항을 직접 눌러보고 내 연구에 맞는 문항을 AI에게 요청하세요.\u003c/p>\u003cp>\u003ca href=\"https://zomtoli7.github.io/greedyQ/examples/control-gallery/preview.html\" target=\"_blank\">\u003cstrong>공개 문항 갤러리 새 탭에서 열기 ↗\u003c/strong>\u003c/a>\u003c/p>\u003cp>갤러리는 가상 참여자만 사용하며 외부 서비스에 응답을 쓰지 않습니다. 실제 참여자나 연구 데이터를 입력하지 마세요. 공개 갤러리 연결을 확인했지만 주소는 특정 릴리스에 고정되어 있지 않습니다. 첨부 작업본의 새 기능과 차이가 있을 수 있습니다.\u003c/p>\u003ch2>1. 문항을 직접 체험하기\u003c/h2>\u003cp>① 갤러리에서 선택형·입력형·슬라이더·표 문항을 눌러봅니다. ② Desktop과 Mobile 화면을 비교합니다. ③ View structure를 열어 문항 순서를 봅니다. ④ Try advanced controls에서 순위·점수 배분 등 확장 문항을 체험합니다.\u003c/p>\u003cblockquote>만족도 설문에 사용 편의성·속도·신뢰성·명확성을 평가하는 표 문항을 추가해줘. 매우 나쁨부터 매우 좋음까지 다섯 선택지를 사용해줘. 컴퓨터에서는 표, 휴대전화에서는 가로 스크롤 없는 행별 카드로 보여줘.\u003c/blockquote>\u003cp>\u003cstrong>기대 결과:\u003c/strong> 컴퓨터에서는 표의 행과 열, 휴대전화에서는 행별 카드로 문항을 검토할 수 있습니다. 각 화면은 독립된 가상 참여자입니다.\u003c/p>\u003ch2>2. 연구 목적에 맞게 요청하기\u003c/h2>\u003cp>\u003cstrong>짧은 답:\u003c/strong> 한 줄 입력 또는 긴 서술형.\u003cbr>\u003cstrong>범주 선택:\u003c/strong> 하나 선택, 여러 개 선택, 이미지 선택 또는 드롭다운.\u003cbr>\u003cstrong>평가:\u003c/strong> 숫자, 슬라이더, 표 문항.\u003cbr>\u003cstrong>확장 예제:\u003c/strong> 순위 정하기, 합계 100점 배분, 단계별 지역 선택, 오디오·비디오.\u003c/p>\u003cblockquote>우선순위 다섯 개를 순서대로 정하고 세 활동에 정확히 100점을 나누는 문항을 만들어줘. 저장될 응답의 의미를 설명하고 컴퓨터·모바일에서 보여준 뒤 승인을 받아줘.\u003c/blockquote>\u003cp>미디어에는 연구가 허용하는 범위에서 자막·대본을 요청하세요. greedyQ 확장 문항이 모두 Surveydown 기본 문항은 아닙니다.\u003c/p>\u003ch2>3. 짧은 설문부터 만들기\u003c/h2>\u003cblockquote>greedyQ 시작 안내를 따라, 우리 서비스를 한 번 이상 이용한 사람에게 3분 이내 만족도 설문을 만들어줘. 전반적 만족도·사용 편의성·유용성·결과 품질·재이용 의향·개선점 한 가지를 다뤄줘. 문항 작성 방식을 먼저 확인하고 배포 전에 실제 미리보기를 보여줘.\u003c/blockquote>\u003cp>① 대상과 목적을 바꿉니다. ② 제안된 문항을 검토합니다. ③ 실제로 끝까지 눌러봅니다.\u003c/p>\u003ch2>막혔을 때\u003c/h2>\u003cp>임베드가 작거나 열리지 않으면 위 새 탭 링크를 사용하세요. 갤러리는 영어 예제이며 한국어 문항은 AI에게 요청할 수 있습니다. 원하는 특수 문항이 없으면 가장 가까운 기존 문항을 먼저 찾고, 추가 작업 시간·AI 사용량·모바일·접근성·저장값을 합의한 후 제작하세요.\u003c/p>"},"zh":{"nav":["首页","开始使用","使用指南","示例","关于"],"copy":"复制","copied":"已复制","selectCopy":"选择文本后复制","promptLabel":"向 AI 提问","contents":"目录","next":"下一项","previous":"上一项","menu":"菜单","language":"语言","draft":"v0.2 · 0.2_2026-10-26_ed1dc2b · 2026-10-26","home":{"eyebrow":"通过对话开展在线研究","title":"把时间留给研究。","sub":"让 AI 帮你制作问卷。","text":"描述研究，试用问卷。研究决策始终由你掌握。","start":"开始制作问卷","example":"浏览示例","steps":[["描述","告诉 AI 你想了解什么，以及谁应参与。"],["审阅","在电脑和手机上亲自测试问卷。"],["批准","批准研究和服务连接，再开始收集回答。"]],"note":"请先在电脑上安装并打开 ChatGPT 桌面应用或 Claude Desktop。greedyQ 使用可直接处理文件并执行任务的代理功能，因此官方不支持 AI 网页应用。此外，目前也不支持 Gemini，包括其桌面应用。"},"start":{"title":"从一个研究问题开始。","lead":"请先在电脑上安装并打开 ChatGPT 桌面应用或 Claude Desktop，然后向 AI 提出以下请求。","prompt":"请读取并遵循 greedyQ 开始说明。无法读取就停止并告诉我：\n\u003chttps://greedyq.netlify.app/>\n\n创建一项新研究。请用中文、每次只问一个问题，引导我完成可在电脑和手机上操作的预览。\n\n我想了解：[研究问题]\n参与对象：[向谁提问]\n\n先问我想自己编写问题，还是审阅 AI 起草的问卷。暂时不要连接账户或部署。","after":"请在已安装的桌面应用中粘贴请求，不要使用 AI 网站或网站快捷方式。AI 必须先检查真实工具。无法读取指南时，应在桌面应用内尝试纯文本来源或完整下载的仓库／指南。不得在权限错误后猜测规则继续。添加指南附件不会赋予缺失的执行能力。应用和指南准备好后逐个讨论研究问题。“预览”不需要外部账户。选择正式部署时才批准 Vercel 登录及必要连接；优先复用已有官方授权，Onboard your agent 仍为可选。","returnTitle":"已有研究？","returnText":"提供研究文件夹。选择继续原版本、修改指定部分，或建立独立副本。先审阅差异，再批准升级。","action":"制作第一份问卷","supportNote":"提示：greedyQ 目前仅支持在具备所需代理工具的 ChatGPT 与 Claude 桌面应用中制作问卷。Gemini 的指南访问与完整执行流程尚未得到验证，因此目前不受支持。"},"guideGroups":[["制作",["first","controls","flow","appearance","preview"]],["实验",["random"]],["收集",["deploy","prolific","results","prereg"]],["再次使用",["archive","upgrade"]]],"guide":[{"id":"first","title":"制作第一份问卷","lead":"从想了解什么、听取谁的意见开始，AI 会逐个询问。","body":"\u003ch2>制作问卷所需的应用\u003c/h2>\u003cp>先安装并打开 ChatGPT 桌面应用或 Claude Desktop。Gemini（包括桌面版）不在官方支持范围内，请启用文件与任务代理功能。greedyQ 官方不支持 AI 网页应用。\u003c/p>\u003cp>使用 greedyQ 创建或修改研究必须使用已安装的 AI 桌面应用。AI 网页应用不在官方支持范围内。 请从官方提供方下载 ChatGPT 桌面应用或 Claude Desktop。Gemini（包括桌面版）不在官方支持范围内，并启用能读取和创建文件、执行任务的代理功能。安装应用或付费订阅并不保证这些能力。没有所需工具的普通聊天不能用于正式制作。参与者问卷、电脑与手机预览及研究者结果页面仍可在浏览器中使用。\u003c/p>\u003cp>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/SUPPORTED-ENVIRONMENTS(zh-CN).md\">制作问卷所需的应用\u003c/a>\u003c/p>\u003ch2>先说研究想法\u003c/h2>\u003cp>例如“我想了解用过我们服务的人是否满意”。不必先准备完整方案或题目。AI 会确认目的、对象，以及页面上显示哪所学校、公司或研究团队。\u003c/p>\u003ch2>选择由谁先写题目\u003c/h2>\u003cp>想自己写，可说“先只建欢迎和结束页，再问我的第一题”，一次给一题或按顺序给多题。想要协助，可说“根据目的先准备初稿”，再审阅建议。最终研究决定由您作出。\u003c/p>\u003cdiv data-control-prompt=\"first-draft\">\u003c/div>\u003cdiv data-control-prompt=\"first-manual\">\u003c/div>\u003ch2>还没决定也没关系\u003c/h2>\u003cp>可以回答“尚未决定”。AI 应保留待确认事项，不猜答案。详细伦理和同意可在完整初稿后处理，但正式接受参与者前必须解决。\u003c/p>\u003ch2>用语言描述，再看实际页面\u003c/h2>\u003cp>可以说“用五点评分”“允许多选”或“只有前面选否才显示这题”。流程完整后亲自试“预览”，不要只看说明报告。\u003c/p>\u003cdiv data-control-prompt=\"first-research\">\u003c/div>\u003ch2>AI 无法打开指南时\u003c/h2>\u003cp>请在已安装的桌面应用中粘贴请求，不要使用 AI 网站或网站快捷方式。AI 必须先检查真实工具。无法读取指南时，应在桌面应用内尝试纯文本来源或完整下载的仓库／指南。不得在权限错误后猜测规则继续。添加指南附件不会赋予缺失的执行能力。应用和指南准备好后逐个讨论研究问题。“预览”不需要外部账户。选择正式部署时才批准 Vercel 登录及必要连接；优先复用已有官方授权，Onboard your agent 仍为可选。\u003c/p>\u003cp>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/GUIDE-ACCESS(zh-CN).md\" target=\"_blank\" rel=\"noopener\">指南访问帮助\u003c/a>\u003c/p>","prompt":""},{"id":"controls","title":"选择提问形式","lead":"亲自操作示例，再请 AI 使用适合研究的题型。","body":"\u003cp>下面展示不同提问方式。找到熟悉的例子，自己点选，再把请求示例复制给 AI。不需要记代码名。特别设计先讨论外观、操作和所需额外工作，再开始实现。\u003c/p>\u003cnav class=\"control-index\" aria-label=\"查找控件\">\u003ca href=\"#control-short_text\" data-control-jump=\"control-short_text\">简短回答\u003c/a>\u003ca href=\"#control-long_text\" data-control-jump=\"control-long_text\">长回答\u003c/a>\u003ca href=\"#control-number\" data-control-jump=\"control-number\">数字\u003c/a>\u003ca href=\"#control-single\" data-control-jump=\"control-single\">单选\u003c/a>\u003ca href=\"#control-multiple\" data-control-jump=\"control-multiple\">多选\u003c/a>\u003ca href=\"#control-buttons\" data-control-jump=\"control-buttons\">单选按钮\u003c/a>\u003ca href=\"#control-multi_buttons\" data-control-jump=\"control-multi_buttons\">多选按钮\u003c/a>\u003ca href=\"#control-image\" data-control-jump=\"control-image\">图片单选\u003c/a>\u003ca href=\"#control-multi_image\" data-control-jump=\"control-multi_image\">图片多选\u003c/a>\u003ca href=\"#control-menu\" data-control-jump=\"control-menu\">下拉选择\u003c/a>\u003ca href=\"#control-labeled_slider\" data-control-jump=\"control-labeled_slider\">带标签滑块\u003c/a>\u003ca href=\"#control-numeric_slider\" data-control-jump=\"control-numeric_slider\">数值滑块\u003c/a>\u003ca href=\"#control-range_slider\" data-control-jump=\"control-range_slider\">区间滑块\u003c/a>\u003ca href=\"#control-one_date\" data-control-jump=\"control-one_date\">日期\u003c/a>\u003ca href=\"#control-date_range\" data-control-jump=\"control-date_range\">日期范围\u003c/a>\u003ca href=\"#control-one_matrix\" data-control-jump=\"control-one_matrix\">单选矩阵\u003c/a>\u003ca href=\"#control-multi_matrix\" data-control-jump=\"control-multi_matrix\">多选矩阵\u003c/a>\u003ca href=\"#control-audio_example\" data-control-jump=\"control-audio_example\">音频材料\u003c/a>\u003ca href=\"#control-video_example\" data-control-jump=\"control-video_example\">视频材料\u003c/a>\u003ca href=\"#control-rank_example\" data-control-jump=\"control-rank_example\">排序\u003c/a>\u003ca href=\"#control-sbs_example\" data-control-jump=\"control-sbs_example\">并列评价\u003c/a>\u003ca href=\"#control-nps_example\" data-control-jump=\"control-nps_example\">推荐意愿\u003c/a>\u003ca href=\"#control-timing\" data-control-jump=\"control-timing\">页面计时\u003c/a>\u003ca href=\"#control-sum_example\" data-control-jump=\"control-sum_example\">固定总额分配\u003c/a>\u003ca href=\"#control-group_rank_example\" data-control-jump=\"control-group_rank_example\">分组并排序\u003c/a>\u003ca href=\"#control-drill_example\" data-control-jump=\"control-drill_example\">逐级选择\u003c/a>\u003ca href=\"#control-custom_example\" data-control-jump=\"control-custom_example\">自定义控件\u003c/a>\u003c/nav>\u003cdiv class=\"control-list\">\u003csection class=\"control-item\" id=\"control-short_text\">\u003cp class=\"eyebrow\">基本题型\u003c/p>\u003ch2>01 · 简短回答\u003c/h2>\u003cp>用于单行回答、标签或代码。\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>供 AI 使用的题型名称\u003c/summary>\u003ccode>text\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"short_text\">\u003c/div>\u003cdiv data-control-prompt=\"short_text\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-long_text\">\u003cp class=\"eyebrow\">基本题型\u003c/p>\u003ch2>02 · 长回答\u003c/h2>\u003cp>用于需要多行的意见或说明。\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>供 AI 使用的题型名称\u003c/summary>\u003ccode>textarea\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"long_text\">\u003c/div>\u003cdiv data-control-prompt=\"long_text\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-number\">\u003cp class=\"eyebrow\">基本题型\u003c/p>\u003ch2>03 · 数字\u003c/h2>\u003cp>输入年龄、数量或金额，并指定单位和有效范围。\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>供 AI 使用的题型名称\u003c/summary>\u003ccode>numeric\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"number\">\u003c/div>\u003cdiv data-control-prompt=\"number\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-single\">\u003cp class=\"eyebrow\">基本题型\u003c/p>\u003ch2>04 · 单选\u003c/h2>\u003cp>选择一个类别或所有适用项；请明确选择规则。\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>供 AI 使用的题型名称\u003c/summary>\u003ccode>mc\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"single\">\u003c/div>\u003cdiv data-control-prompt=\"single\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-multiple\">\u003cp class=\"eyebrow\">基本题型\u003c/p>\u003ch2>05 · 多选\u003c/h2>\u003cp>选择一个类别或所有适用项；请明确选择规则。\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>供 AI 使用的题型名称\u003c/summary>\u003ccode>mc_multiple\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"multiple\">\u003c/div>\u003cdiv data-control-prompt=\"multiple\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-buttons\">\u003cp class=\"eyebrow\">基本题型\u003c/p>\u003ch2>06 · 单选按钮\u003c/h2>\u003cp>将单选或多选显示为醒目的按钮，适合较短的选项列表。\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>供 AI 使用的题型名称\u003c/summary>\u003ccode>mc_buttons\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"buttons\">\u003c/div>\u003cdiv data-control-prompt=\"buttons\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-multi_buttons\">\u003cp class=\"eyebrow\">基本题型\u003c/p>\u003ch2>07 · 多选按钮\u003c/h2>\u003cp>将单选或多选显示为醒目的按钮，适合较短的选项列表。\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>供 AI 使用的题型名称\u003c/summary>\u003ccode>mc_multiple_buttons\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"multi_buttons\">\u003c/div>\u003cdiv data-control-prompt=\"multi_buttons\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-image\">\u003cp class=\"eyebrow\">基本题型\u003c/p>\u003ch2>08 · 图片单选\u003c/h2>\u003cp>选择一张或多张图片卡片；同时提供有意义的文字标签。\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>供 AI 使用的题型名称\u003c/summary>\u003ccode>mc_image\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"image\">\u003c/div>\u003cdiv data-control-prompt=\"image\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-multi_image\">\u003cp class=\"eyebrow\">基本题型\u003c/p>\u003ch2>09 · 图片多选\u003c/h2>\u003cp>选择一张或多张图片卡片；同时提供有意义的文字标签。\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>供 AI 使用的题型名称\u003c/summary>\u003ccode>mc_multiple_image\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"multi_image\">\u003c/div>\u003cdiv data-control-prompt=\"multi_image\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-menu\">\u003cp class=\"eyebrow\">基本题型\u003c/p>\u003ch2>10 · 下拉选择\u003c/h2>\u003cp>从较长的类别列表选择；初始提示文字不算回答。\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>供 AI 使用的题型名称\u003c/summary>\u003ccode>select\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"menu\">\u003c/div>\u003cdiv data-control-prompt=\"menu\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-labeled_slider\">\u003cp class=\"eyebrow\">基本题型\u003c/p>\u003ch2>11 · 带标签滑块\u003c/h2>\u003cp>在低到高等有序标签间选择，保存所选类别的值。\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>供 AI 使用的题型名称\u003c/summary>\u003ccode>slider\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"labeled_slider\">\u003c/div>\u003cdiv data-control-prompt=\"labeled_slider\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-numeric_slider\">\u003cp class=\"eyebrow\">基本题型\u003c/p>\u003ch2>12 · 数值滑块\u003c/h2>\u003cp>选择一个数值，或用两个滑块选择上下限；指定端点和单位。\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>供 AI 使用的题型名称\u003c/summary>\u003ccode>slider_numeric\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"numeric_slider\">\u003c/div>\u003cdiv data-control-prompt=\"numeric_slider\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-range_slider\">\u003cp class=\"eyebrow\">基本题型\u003c/p>\u003ch2>13 · 区间滑块\u003c/h2>\u003cp>选择一个数值，或用两个滑块选择上下限；指定端点和单位。\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>供 AI 使用的题型名称\u003c/summary>\u003ccode>slider_numeric\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"range_slider\">\u003c/div>\u003cdiv data-control-prompt=\"range_slider\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-one_date\">\u003cp class=\"eyebrow\">基本题型\u003c/p>\u003ch2>14 · 日期\u003c/h2>\u003cp>询问一个日期，或开始和结束日期。\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>供 AI 使用的题型名称\u003c/summary>\u003ccode>date\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"one_date\">\u003c/div>\u003cdiv data-control-prompt=\"one_date\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-date_range\">\u003cp class=\"eyebrow\">基本题型\u003c/p>\u003ch2>15 · 日期范围\u003c/h2>\u003cp>询问一个日期，或开始和结束日期。\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>供 AI 使用的题型名称\u003c/summary>\u003ccode>daterange\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"date_range\">\u003c/div>\u003cdiv data-control-prompt=\"date_range\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-one_matrix\">\u003cp class=\"eyebrow\">基本题型\u003c/p>\u003ch2>16 · 单选矩阵\u003c/h2>\u003cp>对多条陈述使用同一量表；单选矩阵每行一个答案，多选矩阵允许多个。\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>供 AI 使用的题型名称\u003c/summary>\u003ccode>matrix\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"one_matrix\">\u003c/div>\u003cdiv data-control-prompt=\"one_matrix\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-multi_matrix\">\u003cp class=\"eyebrow\">基本题型\u003c/p>\u003ch2>17 · 多选矩阵\u003c/h2>\u003cp>对多条陈述使用同一量表；单选矩阵每行一个答案，多选矩阵允许多个。\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>供 AI 使用的题型名称\u003c/summary>\u003ccode>matrix_multiple\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"multi_matrix\">\u003c/div>\u003cdiv data-control-prompt=\"multi_matrix\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-audio_example\">\u003cp class=\"eyebrow\">greedyQ 扩展\u003c/p>\u003ch2>18 · 音频材料\u003c/h2>\u003cp>使用常规播放控件呈现材料；研究允许时提供字幕或文字稿。显示媒体本身不创建回答变量。\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>供 AI 使用的题型名称\u003c/summary>\u003ccode>audio\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"audio_example\">\u003c/div>\u003cdiv data-control-prompt=\"audio_example\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-video_example\">\u003cp class=\"eyebrow\">greedyQ 扩展\u003c/p>\u003ch2>19 · 视频材料\u003c/h2>\u003cp>使用常规播放控件呈现材料；研究允许时提供字幕或文字稿。显示媒体本身不创建回答变量。\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>供 AI 使用的题型名称\u003c/summary>\u003ccode>video\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"video_example\">\u003c/div>\u003cdiv data-control-prompt=\"video_example\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-rank_example\">\u003cp class=\"eyebrow\">greedyQ 扩展\u003c/p>\u003ch2>20 · 排序\u003c/h2>\u003cp>用明确的名次选择控件排列整个列表，无需精确拖动。\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>供 AI 使用的题型名称\u003c/summary>\u003ccode>rank_order\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"rank_example\">\u003c/div>\u003cdiv data-control-prompt=\"rank_example\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-sbs_example\">\u003cp class=\"eyebrow\">greedyQ 扩展\u003c/p>\u003ch2>21 · 并列评价\u003c/h2>\u003cp>并列呈现共享项目和量表的多组评价，手机上改为带标签的分区。\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>供 AI 使用的题型名称\u003c/summary>\u003ccode>side_by_side\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"sbs_example\">\u003c/div>\u003cdiv data-control-prompt=\"sbs_example\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-nps_example\">\u003cp class=\"eyebrow\">greedyQ 扩展\u003c/p>\u003ch2>22 · 推荐意愿\u003c/h2>\u003cp>采用标准的0–10推荐意愿量表，显示全部数字及两端说明。\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>供 AI 使用的题型名称\u003c/summary>\u003ccode>nps\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"nps_example\">\u003c/div>\u003cdiv data-control-prompt=\"nps_example\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-timing\">\u003cp class=\"eyebrow\">greedyQ 扩展\u003c/p>\u003ch2>23 · 页面计时\u003c/h2>\u003cp>在后台记录页面停留秒数，不是可见问题；请确认研究用途。\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>供 AI 使用的题型名称\u003c/summary>\u003ccode>timing\u003c/code>\u003c/details>\u003cp class=\"note\">计时在后台进行，没有供参与者直接回答的可见控件。请智能体展示记录的时间值并解释用途。\u003c/p>\u003cdiv data-control-prompt=\"timing\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-sum_example\">\u003cp class=\"eyebrow\">greedyQ 扩展\u003c/p>\u003ch2>24 · 固定总额分配\u003c/h2>\u003cp>在项目间分配预算、时间或100分；显示当前合计并校验约定总额。\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>供 AI 使用的题型名称\u003c/summary>\u003ccode>constant_sum\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"sum_example\">\u003c/div>\u003cdiv data-control-prompt=\"sum_example\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-group_rank_example\">\u003cp class=\"eyebrow\">greedyQ 扩展\u003c/p>\u003ch2>25 · 分组并排序\u003c/h2>\u003cp>将项目分组，再用明确的分组和名次字段进行组内排序。\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>供 AI 使用的题型名称\u003c/summary>\u003ccode>pick_group_rank\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"group_rank_example\">\u003c/div>\u003cdiv data-control-prompt=\"group_rank_example\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-drill_example\">\u003cp class=\"eyebrow\">greedyQ 扩展\u003c/p>\u003ch2>26 · 逐级选择\u003c/h2>\u003cp>沿地区→国家→城市等路径逐步缩小范围，只显示与上级选择匹配的选项。\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>供 AI 使用的题型名称\u003c/summary>\u003ccode>drill_down\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"drill_example\">\u003c/div>\u003cdiv data-control-prompt=\"drill_example\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-custom_example\">\u003cp class=\"eyebrow\">greedyQ 扩展\u003c/p>\u003ch2>27 · 自定义控件\u003c/h2>\u003cp>此例基于现有选择题。先与 AI 确定图片、选择方式和资料中应保存什么回答。定制可能需要更多时间和 AI 用量。\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>供 AI 使用的题型名称\u003c/summary>\u003ccode>custom\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"custom_example\">\u003c/div>\u003cdiv data-control-prompt=\"custom_example\">\u003c/div>\u003c/section>\u003c/div>","prompt":""},{"id":"flow","title":"安排题序与页面移动","lead":"一起决定谁看到哪些题目，以及怎样结束问卷。","body":"\u003ch2>描述参与者走的路线\u003c/h2>\u003cp>不是每个人都要答相同题目。例如“只有用过服务的人进入满意度问题，其他人看到感谢后结束”。AI 据此连接页面。\u003c/p>\u003ch2>用“查看结构”看全问卷\u003c/h2>\u003cp>点击预览顶部“查看结构”(View structure)，展开页面查看。T 是说明文字，Q 是题目。这个列表只供查看，不修改问卷或保存回答。\u003c/p>\u003ch2>向前与返回\u003c/h2>\u003cp>“上一页”可隐藏、显示但不能点击，或正常使用。材料需显示一段时间时，可请求“12 秒后才能继续”。先决定哪种方式符合研究。\u003c/p>\u003ch2>尝试不同答案\u003c/h2>\u003cp>试同意和拒绝、符合与不符合资格及所有适用结束。出错时告诉 AI：在哪一题选了什么，以及希望之后看到什么页面。\u003c/p>","prompt":"请读取并遵循 greedyQ 开始说明。无法读取就停止并告诉我：\n\u003chttps://greedyq.netlify.app/>\n\n在电脑和手机上展示资格筛选与拒绝同意的路径。只应用我批准的必答项和导航规则。修改研究决策前请先询问。"},{"id":"appearance","title":"修改页面与按钮","lead":"颜色、说明、按钮名称和动作都可按研究要求调整。","body":"\u003ch2>说出想要的外观\u003c/h2>\u003cp>例如“白底、深色文字，主要按钮用学校的蓝色”。请 AI 同时检查电脑与手机是否易读、容易点击。\u003c/p>\u003cdiv data-control-prompt=\"look-colors\">\u003c/div>\u003ch2>修改参与者读到的文字\u003c/h2>\u003cp>可以改团队名、标题、说明、题目、选项和按钮名称。说明改哪个页面，并请求保留其他研究决定。\u003c/p>\u003cdiv data-control-prompt=\"look-words\">\u003c/div>\u003ch2>看得见与能点击可以分开\u003c/h2>\u003cul>\u003cli>“显示”：看得见并可使用。\u003c/li>\u003cli>“隐藏”：该页面没有此按钮。\u003c/li>\u003cli>“禁用”：看得见但不能点击。\u003c/li>\u003c/ul>\u003cp>可以让参与者看刺激后不能返回，或等待后才继续。等待本身不证明已经阅读。\u003c/p>\u003cdiv data-control-prompt=\"look-buttons\">\u003c/div>\u003ch2>也试一试错误回答\u003c/h2>\u003cp>空着必答题或填错总数，再点继续，应转到第一道需要修改的题，每道有问题的题上方均有解释。100 点分配题在回答时也用总数颜色提示。修改后重新检查起始、问题、错误和结束画面。\u003c/p>","prompt":""},{"id":"preview","title":"亲自试填","lead":"“预览”是邀请真实参与者之前，研究者练习作答的页面。","body":"\u003ch2>从头到尾答一次\u003c/h2>\u003cp>请 AI 同时展示电脑和手机，两边可独立选择答案。这些是练习，不作为真实研究回答收集，与之后分享的链接分开。\u003c/p>\u003col>\u003cli>检查各页措辞和顺序。\u003c/li>\u003cli>空着必答题，查看继续后的解释。\u003c/li>\u003cli>返回或刷新，核对进度。\u003c/li>\u003cli>试“其他”、自述和条件题。\u003c/li>\u003cli>实验查看每组材料及适用的拒绝、退出等结束。\u003c/li>\u003c/ol>\u003ch2>手机上是否方便？\u003c/h2>\u003cp>看文字、图片及按钮是否合适。矩阵应按陈述分开，不用拖动整页。研究允许时检查字幕和文字稿。\u003c/p>\u003ch2>描述看到的问题\u003c/h2>\u003cp>例如“这题文字太小”“选否后直接结束”。请保留其他研究决定，修好后再给预览。自动检查不能代替您的亲自审阅。\u003c/p>\u003ch2>收到文件时怎样打开？\u003c/h2>\u003cp>ZIP 是装有多个文件的包，先解压，把文件保留在同一文件夹，再双击“preview.html”。不要在 ZIP 里面直接打开或删除旁边文件。若收到“studio.html”，请 AI 逐步说明选择哪些文件，再点“Preview questionnaire”开始新的练习。不需要服务账户。\u003c/p>\u003cp>滑块通常移动后才算作答；明确指定初始值时例外。检查是否有不想要的默认答案。\u003c/p>","prompt":"请读取并遵循 greedyQ 开始说明。无法读取就停止并告诉我：\n\u003chttps://greedyq.netlify.app/>\n\n在[题目名称或原文]中，只修改[具体内容]。保留其他题目、保存值、分支和随机分配。简要说明变化，并在电脑和手机预览中展示修改后的题目。"},{"id":"random","title":"分配组别与展示顺序","lead":"与 AI 决定参与者进哪组，以及题目和材料的顺序。","body":"\u003ch2>随机分配参与者\u003c/h2>\u003cp>等概率分到 A/B 可以像每人抛硬币一样独立抽取，这种“简单随机分配”不保证最终人数相同。“固定区组分配”则在小批次内按比例安排，例如每四人有两个 A、两个 B，顺序随机打乱。\u003c/p>\u003cp>方式由研究者选择。中途退出和最后一批未满可能造成分析人数不同；已知批次大小也可能让后续分配被预测，应先讨论是否适合。\u003c/p>\u003ch2>打乱题目或选项\u003c/h2>\u003cp>可要求只打乱三道满意度题，或打乱选项但把“其他”放最后。有些独立页面也可打乱；同意和带条件跳转页面有限制，AI 应先解释。\u003c/p>\u003ch2>协作设计更多程序\u003c/h2>\u003cp>例如“随机分四组，各组按参与顺序展示我准备的文字”。分组是随机，文字列表是顺序展示，属于不同步骤。\u003c/p>\u003cp>AI 先说明已有功能和所需扩展，确认列表用完或参与者中断如何处理。批准前测试刷新保留原材料、多人同时进入时仍按设计分配。不是所有方式都内置，可能需要额外实现与时间。\u003c/p>\u003ch2>保留供分析的记录\u003c/h2>\u003cp>请 AI 将组别和展示顺序写入结果，但出现过某材料不证明参与者读过或理解。\u003c/p>","prompt":"请读取并遵循 greedyQ 开始说明。无法读取就停止并告诉我：\n\u003chttps://greedyq.netlify.app/>\n\n解释 A/B 简单随机与固定区组分配的区别，请我批准比例和分配时点。另行打乱前四个选项，固定“其他”在末尾。展示两种条件并检查刷新与继续。\n\n将参与者等概率随机分为四组，各组按参与顺序展示我准备的文字列表。先区分现成功能与所需扩展，与我确认顺序起点、列表用完、中途退出和分析记录，再实现并测试同时参与、刷新和 Test/Real 分离。"},{"id":"deploy","title":"公开问卷并接收回答","lead":"您处理必要的登录和批准，AI 协助准备在线问卷和结果页面。","body":"\u003ch2>准备让别人参加了吗？\u003c/h2>\u003cp>先亲自试“预览”，确认题目、知情同意、隐私和研究计划。准备好后，请 AI“帮助我开始接收真实回答”。先确定账户、资料保存地区及可能费用。\u003c/p>\u003ch2>AI 协助处理连接\u003c/h2>\u003cp>通常您只需登录 Vercel 并批准画面要求的访问。Vercel 让问卷与结果页面能在网上打开，Supabase 保存回答；已连接的 AI 应帮助配置，研究者不用操作数据库编辑器。\u003c/p>\u003cp>已有官方 Vercel 连接时，AI 确认账户与研究团队后优先复用，否则采用既有受支持方式。登录后可能还需单独批准团队访问，请在链接中核对团队与权限。不要在对话发送密码或私密令牌。\u003c/p>\u003ch2>将收到两个不同用途的链接\u003c/h2>\u003cp>\u003cstrong>“问卷链接”\u003c/strong>是发给参与者的地址。参与者打开它，阅读说明并作答。邮件邀请或研究公告应使用这个地址。\u003c/p>\u003cp>\u003cstrong>“结果查看链接”\u003c/strong>是研究者查看和下载回答的地址。研究资料不应仅因别人知道地址就公开，因此应设置为自己或获准团队账户登录后才能查看。请在研究团队内保存，不发给参与者。AI 还应检查没有权限的人不能看到资料。\u003c/p>\u003cp>\u003cstrong>“预览”\u003c/strong>是之前练习问卷的页面。正式邀请时使用最终“问卷链接”，不要用预览地址。不确定时，请 AI 按用途给每个地址重新标注名称。\u003c/p>\u003ch2>发送前先核对一次\u003c/h2>\u003cp>请 AI 放入测试回答，再到“结果查看链接”核对。确认回答确实保存、您也能查看后，才批准招募。网页能打开与回答被正确收集是两回事。\u003c/p>\u003ch2>怎样邀请参与者？\u003c/h2>\u003cp>邮件或社群直接邀请时分享审阅过的“问卷链接”。使用 Prolific 则继续看 \u003cbutton data-page=\"guide\" data-topic=\"prolific\">连接 Prolific\u003c/button>。Prolific 会把启动信息传给问卷，所以单独打开基础地址可能无法开始。\u003c/p>\u003ch2>可选：“Onboard your agent”\u003c/h2>\u003cp>这是为 AI 与 Vercel 协作做准备的功能，可为重复使用选择，但不是 greedyQ 必需步骤。通常不用从安装工具或重启应用开始。准备完成后仍须另行检查问卷公开与回答保存。\u003c/p>\u003ch2>当前 AI 不能操作账户时\u003c/h2>\u003cp>有些环境只能聊天。下载保存完整研究文件夹，询问如何在支持连接的环境继续。AI 不能说完成了实际没有执行的连接或上线。\u003c/p>","prompt":"请读取并遵循 greedyQ 开始说明。无法读取就停止并告诉我：\n\u003chttps://greedyq.netlify.app/>\n\n按既有 greedyQ 部署流程进行。已有官方 Vercel 连接时，确认我的账户和团队后优先复用；否则使用原有受支持方式。不要要求必须使用 Onboard your agent。若缺少团队授权，给我该团队的授权链接，等我批准后重试。验证 Test 回答保存及受保护结果后，再请求正式收集批准。"},{"id":"prolific","title":"通过 Prolific 招募参与者","lead":"用 greedyQ 制作问卷，用 Prolific 招募并支付报酬。先在草稿中练习，再决定正式招募。","body":"\u003ch2>开始之前\u003c/h2>\u003cp>Prolific 是付费招募研究参与者的服务。先完成 \u003cbutton data-page=\"guide\" data-topic=\"deploy\">公开问卷并接收回答\u003c/button>，准备好“问卷链接”和自己的“结果查看链接”。直接邀请时不需要 Prolific。\u003c/p>\u003ch2>1. 建立研究草稿\u003c/h2>\u003cp>登录研究者账户，新建研究，与 AI 确认标题、说明、资格、时长与报酬。先保存草稿，不马上招募。把草稿页面地址交给 AI 以确认研究，不发送密码或私密令牌。\u003c/p>\u003ch2>2. 粘贴 AI 给的完整问卷地址\u003c/h2>\u003cp>把完整地址放到研究设置的问卷 URL 栏。地址后可能有识别 Prolific 来访的信息，不要自己编写或删减。不知道点哪个选项时，告诉 AI 屏幕上的名称。\u003c/p>\u003cdetails>\u003csummary>需要核对设置名称时\u003c/summary>\u003cp>“Data collection”的“URL parameters”应各传递一次 PROLIFIC_PID、STUDY_ID、SESSION_ID。AI 应连同地址检查。这些 ID 不是身份或完成的密码学证明。\u003c/p>\u003c/details>\u003ch2>3. 分别准备结束情况\u003c/h2>\u003cp>答完、不同意、途中退出是不同情况。在“Completion paths”设定相应处理，把画面上的真实返回地址或码交给 AI，不要编造。\u003c/p>\u003cp>拒绝同意使用“No consent”的“Request a return”；退出使用名称明确的单独路径和已审阅处理。可能不符资格而提前结束时，先确认“Screened out”和报酬。平台已有预筛条件与问卷内新筛选不同，处理和费用由研究者决定。打开返回地址不证明平台已完成返回。\u003c/p>\u003ch2>4. 用草稿的“Preview”练习\u003c/h2>\u003cp>这是 Prolific 自己的草稿试验，会检查从平台进入问卷再返回。它不同于只审阅文句的 greedyQ“预览”。请 AI 使用 Test 模式准备连接。\u003c/p>\u003col>\u003cli>在“结果查看链接”找到“Repeat Prolific preview”。\u003c/li>\u003cli>输入 AI 给的问卷地址，点“Create repeat-test link”。\u003c/li>\u003cli>将产生的私密地址放入 Prolific 草稿。\u003c/li>\u003cli>打开平台“Preview”，分别试完成、拒绝同意和退出。\u003c/li>\u003cli>另试一次用“Start a new test”；仅刷新会继续原尝试。\u003c/li>\u003c/ol>\u003cp>该地址有效 24 小时，不用于实际招募。先前尝试会保留，不必编造参与者编号或删除旧回答。\u003c/p>\u003cdetails>\u003csummary>供 AI 核对的连接信息\u003c/summary>\u003cp>gq_preview 是私密 Test 权限，不是模式开关。正式模式、过期和其他研究的权限应被拒绝。不要公开临时地址或发给真实参与者。\u003c/p>\u003c/details>\u003ch2>5. 在结果中核对保存\u003c/h2>\u003cp>到 \u003cbutton data-page=\"guide\" data-topic=\"results\">查看并下载回答\u003c/button>，选测试回答和 Prolific，比较答案、结束状态及 CSV。新处理的退出应使答案从后续结果和下载消失。返回与防重复所需的最少管理 ID 可按告知保留，旧下载另行处理。\u003c/p>\u003ch2>6. 决定小规模付费试验\u003c/h2>\u003cp>先确认时长、人数、报酬和显示总额。真实参与者需要正常研究说明、同意和任务，不应看到测试结束选择器，也不应被要求假装拒绝或退出。\u003c/p>\u003cp>用审阅后的正式问卷地址替换私密测试地址，核对参与说明和保留期限，再批准发布。一人试验可检查连接，不证明研究效度。收到资料后先匹配真实平台提交，再批准有效参与。保存答案本身不证明已付款。\u003c/p>\u003ch2>平台暂停审查时\u003c/h2>\u003cp>若通知说无需行动，保留设置和预算并等待。暂停本身不代表问卷故障；不要重复建立、反复发布或充值，应与 AI 一起看实际通知。\u003c/p>\u003ch2>已检查到哪里？\u003c/h2>\u003cp>2026-10-26，greedyQ 完成首次一人付费 Prolific 连接试验。已将保存回答与参与者提交、下载的 CSV 对照；随后研究者明确确认已批准提交并支付报酬。批准和付款依据研究者确认，AI 没有另行检查交易收据。\u003c/p>\u003cp>真实草稿 Preview 另行检查了正常完成、拒绝同意、退出和重新测试。这验证基本连接流程，不代表每个研究设计或账户都已验证。\u003c/p>\u003ch2>哪些项目仍需单独检查？\u003c/h2>\u003cul>\u003cli>结束时间记录修复已通过自动与连接模拟测试，修复后的首份真实付费回答仍待核对，可在下一研究的首份回答检查。历史空时间保留不变。\u003c/li>\u003cli>如果在问卷内筛除参与者，要核对该研究的实际 Prolific 返回路径及筛除报酬。\u003c/li>\u003cli>新账户、研究和较大样本仍需相应检查。标准连接不包括签名链接验证或招募/付款自动化。\u003c/li>\u003cli>负责人须在 2026-11-25 前清理本次试验保留资料和私密下载副本；没有声称已自动清理。\u003c/li>\u003c/ul>\u003cp>无需仅为重复验证基本连接而再招募付费参与者。\u003c/p>\u003cp>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/USER-GUIDE(zh-CN).md\" target=\"_blank\" rel=\"noopener\">更详细的使用指南\u003c/a>\u003c/p>\u003cp>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/docs/prolific-paid-test-completion-2026-10-26.md\" target=\"_blank\" rel=\"noopener\">验证记录和剩余范围\u003c/a>\u003c/p>","prompt":"请读取并遵循 greedyQ 开始说明。无法读取就停止并告诉我：\n\u003chttps://greedyq.netlify.app/>\n\n把已审阅的 greedyQ 研究连接到 Prolific。先准备未发布草稿，确认资格和报酬，用 Test 模式及私密重复预览链接测试提供的结束路径，验证 ID 保存、退出答案删除和受保护 CSV。用简单语言逐步解释账户操作。未经我明确选择，不要发布、招募、批准或付款。若平台暂停审查，保留设置并准确报告等待状态。"},{"id":"results","title":"查看并下载回答","lead":"通过“结果查看链接”区分练习和真实回答，下载分析资料。","body":"\u003ch2>打开“结果查看链接”\u003c/h2>\u003cp>打开 AI 给的结果地址，需要时用获授权的 Vercel 账户登录。先核对研究名称。这里可以看回答人数、答案及在哪题停止。\u003c/p>\u003ch2>练习与真实回答分开看\u003c/h2>\u003cp>\u003cstrong>“实际回答”\u003c/strong>(Real responses) 是为研究正式收集的答案；\u003cstrong>“测试回答”\u003c/strong>(Test responses) 是检查连接的练习。刚试填后实际回答为空是正常的，请选测试回答，再点“刷新”(Refresh)。\u003c/p>\u003cp>直接试填选择来源“Direct”，从 Prolific 试验选“Prolific”。这是选择进入问卷的方式，平台测试仍是测试。持续为空时请 AI 检查使用的测试链接及是否保存。\u003c/p>\u003ch2>先比较自己知道的一条回答\u003c/h2>\u003cp>记住试填时选的答案，到结果中核对。再看人数、题目摘要和停止位置。此页帮助了解收集情况，统计分析需下载后另外完成。\u003c/p>\u003ch2>交给表格或统计软件\u003c/h2>\u003cp>\u003cstrong>“下载 CSV”\u003c/strong>(Download CSV) 保存目前选中的回答。例如选了 Test 与 Prolific，就只下载这部分。“变量说明”(Variable guide) 可解释每列，也可请 AI 用日常语言说明。\u003c/p>\u003cp>没有人回答的题仍可能有列，值为空。矩阵可按陈述拆成多列。刷新期间可能暂时不能下载，等完成后再试。\u003c/p>\u003ch2>退出和隐私\u003c/h2>\u003cp>新收到并正常处理的退出会删除当前保存处的回答及后续导出值，不会远程删除以前已下载的文件，请按研究计划处理副本。为返回 Prolific 或防重复而已告知的最少管理标识可能保留。含识别信息的文件应在研究团队内安全保管。\u003c/p>\u003ch2>Prolific 的提交与付款另行核对\u003c/h2>\u003cp>问卷保存答案不等于平台收到正常提交。付费参与后先核对平台记录和保存回答，再批准有效工作。尚未设置平台时先看 \u003cbutton data-page=\"guide\" data-topic=\"prolific\">连接 Prolific\u003c/button>。\u003c/p>\u003cdetails>\u003csummary>旧 CSV 的完成时间为空怎么办？\u003c/summary>\u003cp>部分旧完成记录没有单独结束时间。修复后记录首次结束时间，不改旧回答或用估计时间回填历史空值。请让 AI 检查记录，不要猜测时间。\u003c/p>\u003c/details>","prompt":"请读取并遵循 greedyQ 开始说明。无法读取就停止并告诉我：\n\u003chttps://greedyq.netlify.app/>\n\n分别显示 Test/Direct 和 Test/Prolific，刷新结果并解释 CSV。确认退出测试无答案且其他回答未改变。对付费提交，先核对真实 Prolific ID 和完成结果，再请我批准付款。"},{"id":"prereg","title":"取得预注册草稿","lead":"收集前想登记研究计划时，可请 AI 先准备供审阅的草稿。","body":"\u003ch2>确认要事先决定什么\u003c/h2>\u003cp>一起整理假设、人数、停止时间、结果、排除及分析。尚未决定的标为“待确认”，AI 不应自行填补。\u003c/p>\u003ch2>收到可阅读修改的文件\u003c/h2>\u003cp>greedyQ 按 OSF 表单逐项起草并准备相关文件。默认草稿有英文/韩文；需要其他语言时可以请求并审阅翻译。仅试预览时不必先做预注册。\u003c/p>\u003ch2>实际登记由研究者另行处理\u003c/h2>\u003cp>收到文档不代表已经注册。确认后如有需要，使用自己的 OSF 账户登记。greedyQ 不代登录或提交。问卷或分析改变后，请同步更新草稿。\u003c/p>","prompt":"请读取并遵循 greedyQ 开始说明。无法读取就停止并告诉我：\n\u003chttps://greedyq.netlify.app/>\n\n仅根据已确认的决策准备 OSF 预注册草稿。每次询问一个缺失决策。不要登录 OSF 或提交任何内容。"},{"id":"archive","title":"结束研究并保存资料","lead":"先安全下载、核对资料，再处理不再使用的服务。","body":"\u003ch2>请求结束与归档\u003c/h2>\u003cp>说“帮我结束收集并保存研究资料”。AI 应先确认研究、是否仍有人作答，以及是否与其他研究共用服务，然后才请您批准结束。\u003c/p>\u003ch2>先取得这些文件\u003c/h2>\u003cul>\u003cli>“实际回答 CSV”：正式研究回答的表格。\u003c/li>\u003cli>“测试回答 CSV”：检查连接的练习回答。\u003c/li>\u003cli>“归档 ZIP”：打包保存的研究记录和回答。\u003c/li>\u003c/ul>\u003cp>CSV 可用常见表格或统计软件打开。结果页下载可能只有当前选择，完整归档应另行请求，也可包含未完成回答。表格样式有差异时，问 AI 应用哪个文件分析。\u003c/p>\u003ch2>自己确认下载\u003c/h2>\u003cp>检查能否打开、数量是否符合预期，并另存安全备份。原研究文件夹和媒体也保留。资料可能含 Prolific 标识，不要放公开网页或仓库。\u003c/p>\u003ch2>确认保存后才暂停\u003c/h2>\u003cp>告诉 AI 已安全保存后，再批准暂停专用服务。其他研究共用的服务应继续运行。暂停不是永久保管资料的保证，应确认保留责任与提供商政策。\u003c/p>\u003ch2>之后也保留联系方式\u003c/h2>\u003cp>关闭研究后不再接收回答，暂停网站可能显示提供商的不可用页面。留下研究团队联系方式，以便处理后续退出请求，并按计划处理已经下载的副本。\u003c/p>","prompt":"请读取并遵循 greedyQ 开始说明。无法读取就停止并告诉我：\n\u003chttps://greedyq.netlify.app/>\n\n帮助我结束收集并存档。先检查正在回答的参与者和共享服务。下载资料后，等我确认已安全保存。不要删除项目。"},{"id":"upgrade","title":"继续、修改或另建研究","lead":"可以继续保存的问卷、只改部分，或保留原本另做独立研究。","body":"\u003ch2>先说明哪种工作\u003c/h2>\u003cul>\u003cli>“继续”：接着做原研究。\u003c/li>\u003cli>“修改”：改同一研究中商定的部分。\u003c/li>\u003cli>“复制为新研究”：保留原本，建立独立副本，也称“fork”。\u003c/li>\u003c/ul>\u003cp>提供已保存文件夹。旧参与者的回答不应自动成为新研究资料。\u003c/p>\u003ch2>greedyQ 已更新时\u003c/h2>\u003cp>请 AI 说明差异。愿意升级时，在单独副本操作，再审阅电脑和手机。不要覆盖原本或悄悄改研究决定；正在正式收集的研究应另做变更计划。\u003c/p>\u003ch2>重新开放暂停的问卷\u003c/h2>\u003cp>重新启动服务与再次接受参与者是两回事。请求恢复同一研究后，AI 应检查保存和结果，再请您批准收集。归档 ZIP 用于保管分析，不自动恢复在线服务。\u003c/p>","prompt":"请读取并遵循 greedyQ 开始说明。无法读取就停止并告诉我：\n\u003chttps://greedyq.netlify.app/>\n\n继续这项已保存研究。解释与当前 greedyQ 版本的差异。经我批准后升级独立副本，并展示两份预览。保留研究决策和原文件。"}],"aboutGroups":[["项目",["identity","principles","contact"]],["兼容性",["agents","support","export"]],["参考",["citation","license","updates"]]],"about":[{"id":"identity","title":"什么是 greedyQ？","lead":"让通用 AI 遵循一致的研究流程。","body":"\u003cp>greedyQ 帮助您通过 AI 对话制作在线问卷和实验。说明研究，审阅题目和页面，AI 依据指南准备材料和可运行问卷。\u003c/p>\u003ch2>可以一起做什么？\u003c/h2>\u003cp>包括题目、参与说明与同意、组别分配、分析计划、预注册草稿、收集及归档。研究决定与数据责任由研究者保留。\u003c/p>\u003ch2>不同 AI 能做的工作不同\u003c/h2>\u003cp>只能聊天的 AI 准备文档和文件；有文件、账户工具的 AI 也能帮助连接和试验获准服务。不能执行的步骤必须如实说明。\u003c/p>\u003cdetails>\u003csummary>了解设计方式\u003c/summary>\u003cp>greedyQ 是“specification-driven, AI-native application”，用“agent-executable application specification”告诉通用 AI 如何构建和操作研究流程。greedyQ 本身不是独立代理，AI 与规范结合发挥研究助手作用。\u003c/p>\u003c/details>"},{"id":"principles","title":"研究者的控制权","lead":"明确决策，保留研究的可复现性。","body":"\u003cul>\u003cli>修改重要研究决策前先询问。\u003c/li>\u003cli>记录待定事项，不编造答案。\u003c/li>\u003cli>审阅真实参与者界面，而非仅看技术报告。\u003c/li>\u003cli>保留研究文件和确切软件版本。\u003c/li>\u003cli>区分预览、账户连接和招募批准。\u003c/li>\u003cli>回答数据由研究者管理。\u003c/li>\u003c/ul>\u003cp>主要路径是使用 Vercel 和 Supabase 的浏览器问卷。高级用户也可直接编辑源文件或导出 native Surveydown 项目。\u003c/p>"},{"id":"contact","title":"联系我们","lead":"欢迎反馈错误、提问和提出建议。","body":"\u003cp>如果您发现错误、有疑问或建议，请随时发送邮件至 \u003ca href=\"mailto:greedyq.contact@gmail.com\">greedyq.contact@gmail.com\u003c/a>.\u003c/p>"},{"id":"agents","title":"可用的 AI 代理","lead":"请在支持的桌面应用中制作问卷。不仅要看模型名称，也要看实际应用及其工具。","body":"\u003ch2>目前支持\u003c/h2>\u003cp>greedyQ 目前支持使用具备所需代理工具的 \u003cstrong>ChatGPT 与 Claude 桌面应用\u003c/strong>制作研究。请在电脑上下载安装并打开应用。AI 网站、浏览器安装的网站快捷方式，以及没有文件工具的普通聊天都不属于支持的制作环境。\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>应用\u003c/th>\u003cth>使用方式\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>ChatGPT 桌面应用\u003c/td>\u003ctd>在提供时使用 Work 或 Codex，允许访问研究目录并具备创建文件及运行预览的工具。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Claude Desktop\u003c/td>\u003ctd>使用 Cowork、Code 等适当代理模式，允许访问研究目录并确认文件与任务工具真实可用。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>安装应用或订阅付费模型并不自动启用全部功能。开始研究访谈前，AI 应确认能完整读取指南及必需文件、创建实际文件并打开可操作预览。选择部署时另行检查账户权限。\u003c/p>\u003cp>\u003ca href=\"https://learn.chatgpt.com/docs/app\" target=\"_blank\" rel=\"noopener\">安装 ChatGPT 桌面应用\u003c/a> · \u003ca href=\"https://claude.com/download\" target=\"_blank\" rel=\"noopener\">下载 Claude Desktop\u003c/a>\u003c/p>\u003ch2>未来支持评估：Gemini\u003c/h2>\u003cp>\u003cstrong>Gemini（包括桌面版）目前不受支持。\u003c/strong>它是未来优先评估对象。须验证完整指南与固定文件读取、问卷生成与测试、获准部署、结果查看和归档，才能考虑加入支持。没有承诺上线日期。不得将报告的访问失败归因为未经证实的 Google 全面封锁 GitHub 政策。\u003c/p>\u003ch2>其他可能评估的对象\u003c/h2>\u003cp>未来也可评估 Meta AI、Grok、DeepSeek。这些只是评估候选，并非当前支持或承诺发布的产品。模型名称或来源国家并不证明具备 greedyQ 所需的文件、执行和账户工具。每个实际应用与代理环境必须通过相同的全流程测试后才能加入支持列表。\u003c/p>\u003ch2>参与者仍使用浏览器\u003c/h2>\u003cp>上述要求针对研究者制作研究时使用的 AI。参与者仍可在电脑或手机的普通浏览器回答。研究者也可用浏览器阅读网站、检查预览、查看结果并批准服务登录。\u003c/p>","prompt":""},{"id":"support","title":"支持范围","lead":"兼容性按功能判断，不代表完全等价。","body":"\u003ch2>从熟悉的题型例子开始\u003c/h2>\u003cp>支持简答、长文、单选多选、图片、数字、滑块和表格，也有媒体、排序和 100 点分配。先试 \u003cbutton data-page=\"guide\" data-topic=\"controls\">选择提问形式\u003c/button>。\u003c/p>\u003ch2>以实际看到的页面为准\u003c/h2>\u003cp>部分文字或外观设置可能无法完全实现，AI 应说明并展示。当前不自动收集参与者 IP 或浏览器信息；需要什么资料应按研究计划讨论。\u003c/p>\u003ch2>路径与分配也有范围\u003c/h2>\u003cp>可以按前题答案显示其他题并调整部分顺序。复杂设计先讨论已有功能与额外实现，不是在问卷里放任意程序直接运行。\u003c/p>\u003ch2>区分已确认和待确认\u003c/h2>\u003cp>示例可用也要在自己的研究和账户重新测试。首次 Prolific 付费试验等待审查，真实提交和付款最终验证未完成。“Onboard your agent”验证到团队读取，不是通过它完整发布新研究的验证。\u003c/p>"},{"id":"export","title":"导出 native Surveydown","lead":"选择另一运行环境前，先审阅差异。","body":"\u003ch2>熟悉 R 时可继续自由修改\u003c/h2>\u003cp>普通使用保持浏览器问卷。具备 R、Shiny、Quarto 经验且需更自由定制时，可请 AI 另提供原生 surveydown 文件。\u003c/p>\u003ch2>先了解转移后的差异\u003c/h2>\u003cp>不是每种行为都原样保留。题目/页面顺序随机化、固定区组及恢复后的组别保持存在差异。AI 应说明哪些保留、哪些需原生测试、哪些不支持。\u003c/p>\u003cp>生成文件不等于验证相同，实际使用前须在原生环境试填。这不是普通 greedyQ 使用的必经步骤。\u003c/p>"},{"id":"citation","title":"引用研究软件","lead":"即使仅运行 greedyQ，也请引用两个项目。","body":"\u003cp>论文或学位论文使用 greedyQ 时，请同时引用 greedyQ 和 surveydown。可请 AI 根据实际版本准备参考文献和方法文字，不要声称运行了未使用的软件。\u003c/p>\u003ch2>参考文献\u003c/h2>\u003cp>greedyQ project. (2026). \u003cem>greedyQ: A specification-driven, AI-native application for online academic research\u003c/em> (Version &lt;release identifier&gt;) [Computer software]. GitHub.\u003c/p>\u003cp>Hu, P., Bunea, B., &amp; Helveston, J. (2025). surveydown: An open-source, markdown-based platform for programmable and reproducible surveys. \u003cem>PLOS ONE, 20\u003c/em>(8), e0331002. DOI: 10.1371/journal.pone.0331002.\u003c/p>\u003ch2>方法部分示例\u003c/h2>\u003cdiv data-snippet=\"methods\">\u003c/div>\u003ch2>BibTeX\u003c/h2>\u003cdiv data-snippet=\"bib\">\u003c/div>"},{"id":"license","title":"许可与归属","lead":"采用 MIT 许可的独立开源项目。","body":"\u003cp>greedyQ 独立实现了部分已记录的 Surveydown 风格编写约定，不包含或再分发 Surveydown 源代码。\u003c/p>\u003cp>Surveydown 是采用 MIT 许可的先前开源成果。Copyright © 2025 John Paul Helveston, Pingfan Hu, Bogdan Bunea。\u003c/p>\u003cp>greedyQ 并非由 Surveydown 或其维护者合作、认可、赞助或维护。相关提及用于说明兼容性、来源或导出目标。\u003c/p>\u003ch2>注意区分\u003c/h2>\u003cp>学术使用时共同引用的要求与软件许可合规是不同事项。软件许可不会决定研究数据或预注册文档的许可。\u003c/p>"},{"id":"updates","title":"版本与更新","lead":"确认研究实际使用的版本。","body":"\u003cp>当前指南与示例版本为 \u003cstrong>0.2_2026-10-26_ed1dc2b\u003c/strong>，更新日 2026-10-26。版本用于区分研究由哪个时期的 greedyQ 制作，不需要记住，AI 应写入研究文件。想使用新功能时，提供保存的研究，先了解升级变化再批准。\u003c/p>\u003cul class=\"history\">\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-10-26_ed1dc2b.md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-10-26_ed1dc2b\u003c/code>\u003c/a>\u003cbr>将简短公开 START-HERE 与完整 INITIALIZE 流程分开，由同一 Markdown 生成静态 HTML 并准备 Netlify 部署。实际公开 URL 与 AI 读取仍需验证；已有研究保留锁定版本。\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-10-26_fa94594.md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-10-26_fa94594\u003c/code>\u003c/a>\u003cbr>Finalize v0.2 documentation with the desktop-host first-action gate and the available AI agents compatibility page. Current support is capable ChatGPT/Claude desktop apps; Gemini is for future review and Meta AI, Grok, DeepSeek are evaluation candidates only. Reconcile obsolete Chat-mode, paid-pilot, product-stage and migration descriptions across languages.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-10-26_ecadf63.md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-10-26_ecadf63\u003c/code>\u003c/a>\u003cbr>Add a clearly visible support note immediately below the Start introduction in English, Korean and Chinese: use capable ChatGPT or Claude desktop apps; Gemini is currently unsupported. Describe unverified guide/execution support without inventing a Google GitHub-blocking policy. Website navigation and copy checks passed (4 tests).\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-10-26_e10197b.md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-10-26_e10197b\u003c/code>\u003c/a>\u003cbr>Complete the basic one-person Prolific paid connection test; approval and reward payment are explicitly researcher-confirmed.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-10-26_df6d737.md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-10-26_df6d737\u003c/code>\u003c/a>\u003cbr>Move the complete initialization workflow to INITIALIZE.md. Keep START-HERE.md as the short public front door and render its English/Korean/Chinese HTML directly from the same Markdown source; preserve existing links and pinned-study resume behavior.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-10-26_beac897.md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-10-26_beac897\u003c/code>\u003c/a>\u003cbr>Add About &gt; Compatibility &gt; Available AI agents in English, Korean and Chinese. Support capable ChatGPT/Claude desktop apps; list Gemini for future support review and Meta AI, Grok and DeepSeek as evaluation candidates only.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-10-26_b3edd07.md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-10-26_b3edd07\u003c/code>\u003c/a>\u003cbr>Close the supported v0.2 scope, correct stale verification/randomization guidance, and recheck the existing closed-study screen in four languages.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-10-26_ac2c85a.md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-10-26_ac2c85a\u003c/code>\u003c/a>\u003cbr>Implemented dedicated CBC server consent, block/order persistence, exposure/choice storage, withdrawal, protected results, real/test CSV and archives through additive migration 009; verified with synthetic participants in real local PostgreSQL and desktop/mobile browsers.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-10-26_a4ad99e.md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-10-26_a4ad99e\u003c/code>\u003c/a>\u003cbr>Implemented CBC CSV/Excel import, Python/browser parity, descriptive design checks and a standalone computer/mobile preview for the v0.3 preview line; live CBC collection remains disabled.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-10-26_4e977e4.md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-10-26_4e977e4\u003c/code>\u003c/a>\u003cbr>Record the first server-side survey end time and preserve it across retries; leave historical timestamps and answers unchanged.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-10-26_2b581a3.md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-10-26_2b581a3\u003c/code>\u003c/a>\u003cbr>Require ChatGPT desktop 藏上一页，在题目页显示，在最终审阅页显示但禁用。在已批准的材料页，将继续按钮延迟12秒启用并显示倒计时。展示电脑与手机上的全部状态。","first-draft":"请读取并遵循 greedyQ 开始说明。无法读取就停止并告诉我：\n\u003chttps://greedyq.netlify.app/>\n\n遵循 greedyQ 开始指南，为使用过我们服务的人制作三分钟内的满意度问卷。包括总体满意度、易用性、有用性、结果质量、再次使用意愿和一项改进建议。先确认问题编写方式，部署前展示可操作预览。","first-manual":"请读取并遵循 greedyQ 开始说明。无法读取就停止并告诉我：\n\u003chttps://greedyq.netlify.app/>\n\n我会自己编写问题。请先建立开始与结束页面，再问我第一个问题。记录待确认事项，不要擅自补全研究决策。","first-research":"请读取并遵循 greedyQ 开始说明。无法读取就停止并告诉我：\n\u003chttps://greedyq.netlify.app/>\n\n让参与者给五个优先事项排序，并在三项活动间分配恰好 100 分。解释保存答案的含义，展示电脑和手机交互后再请我批准。"},"examplesArchived":"\u003cp>亲自试用虚拟问题，再向 AI 请求适合研究的题型。\u003c/p>\u003cp>\u003ca href=\"https://zomtoli7.github.io/greedyQ/examples/control-gallery/preview.html\" target=\"_blank\" rel=\"noopener\">在新标签页打开公开题型展示 ↗\u003c/a>\u003c/p>\u003cp>展示使用虚拟参与者，不向外部服务写入回答。请勿输入真实参与者或研究数据。公开地址未固定到某个版本，可能与交接材料中的新功能不同。展示本身保留原有英文内容。\u003c/p>\u003ch2>1. 试用问题\u003c/h2>\u003cp>① 尝试选择题、文字输入、滑块和矩阵。② 比较 Desktop 与 Mobile。③ 打开 View structure 查看顺序。④ 选择 Try advanced controls 体验排序、分配等扩展。\u003c/p>\u003cblockquote>增加一个矩阵题，评价易用性、速度、可靠性和清晰度，采用从非常差到非常好的五级选项。电脑显示表格，手机显示无需横向滚动的逐行卡片。\u003c/blockquote>\u003cp>\u003cstrong>预期结果：\u003c/strong>电脑表格和手机行卡片，每个视图使用独立的虚拟参与者。\u003c/p>\u003ch2>2. 用研究语言提出需求\u003c/h2>\u003cp>文字回答可用单行或长文本；分类可用单选、多选、图片或下拉框；评价可用数值、滑块或矩阵。扩展示例包括排序、100 分定额分配、分层选择和音视频。\u003c/p>\u003cblockquote>让参与者给五个优先事项排序，并在三项活动间分配恰好 100 分。解释保存答案的含义，展示电脑和手机交互后再请我批准。\u003c/blockquote>\u003cp>研究允许时要求字幕和文字稿。greedyQ 扩展不全是 Surveydown 内置题型。\u003c/p>\u003ch2>3. 从简短问卷开始\u003c/h2>\u003cblockquote>遵循 greedyQ 开始指南，为使用过我们服务的人制作三分钟内的满意度问卷。包括总体满意度、易用性、有用性、结果质量、再次使用意愿和一项改进建议。先确认问题编写方式，部署前展示可操作预览。\u003c/blockquote>\u003cp>① 调整目的和对象。② 审阅问题。③ 亲自完整测试。\u003c/p>\u003ch2>遇到问题？\u003c/h2>\u003cp>嵌入太小或无法打开时，使用上方新标签页链接。特殊题型应先寻找最接近的已有题型，并确认额外工作量、手机体验、无障碍和保存值。\u003c/p>"}},"@software{greedyq,\n  author = {{greedyQ project}},\n  title = {greedyQ: A Specification-Driven, AI-Native Application for Online Academic Research},\n  year = {2026},\n  version = {\u003crelease identifier>},\n  url = {https://github.com/zomtoli7/greedyQ}\n}\n\n@article{hu2025surveydown,\n  title = {surveydown: An open-source, markdown-based platform for programmable and reproducible surveys},\n  author = {Hu, Pingfan and Bunea, Bogdan and Helveston, John Paul},\n  journal = {PLOS ONE},\n  year = {2025}, volume = {20}, number = {8}, pages = {e0331002},\n  doi = {10.1371/journal.pone.0331002}\n}","https://zomtoli7.github.io/greedyQ/examples/control-gallery/preview.html",{"single":[{"src":"data:image/webp;base64,UklGRh4MAABXRUJQVlA4WAoAAAAgAAAAlQIApwAASUNDUMgBAAAAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADZWUDggMAoAAJBSAJ0BKpYCqAA+bTKVSSQioaEhk9p4gA2JaW7hdVD66kDIzvHP9u7XP7N4Y+B7xR7H8reI78n+u/4P8wPkB+0/2/wZ+BX8N9mfyBfjP8g/um/5gA/E/5v/rf7N+4Hv5fEf5n0M+qH+M9wD+Nf0L/VcYN4n7AH8w/r//D/wH5M/Hd/q/bz7U/n//sf4v4BP5X/X/95/dv8V75Pr3/cb2MP2M//4HPzyrGVYc2VpkTabV2duM9wJY+f7TFDaPJkKoFNrgC2yhVrZ0Rm046VrON5k3WdyFPsdBy4UNrjBJ7A230/5CS1IpGcDNm9VpwhXKGRvyjacVa8ELpPdgL/f5VrLFG+U9uyWSewNt9P+Qp9joOXChtcYKyEYQxU0zn9ehbpkxn5cMbIxU0zn9ehidRrASKf+TGflwxsjFTTOf16GJ1GsBIp/5MZ+XDGyMVNM+f3oUAyFMYxjGMYxjGMYxjGMYxjGMYxjGMYxiqooRr2hggX2RIsgRCtBcR6rnLngUqVNTR7agpEPSh+pkzF+2fQuP+Qp9joOXChtcYJPYG2+n/Jjzh7BfuMSfyHg1Yin2Og5cKG1xgk9gbb6f8hT4xhmfqaoazHE/BM7cWAglAh25lRBKBDtzKiCUCHbmVEEoEO3MqIJQIduZUQSgQ7cx30PUgInirWf7i2WPH2TXh4prDrA4GiY6WY3w8U1h1gcDRMdLMb4eKZMh3aqZuw+mjpktE/yzFhLFqxUPcwsmJJuwduYAt/wk9gbb6f8hT7HQcuFDa4wSed67HtuRfnqCmfaj+3/WsR/b/rWI/t/1rEf2/61iP7f9axH9vnevBaCGhwcCYArA
