 start page. If you cannot read it, stop and tell me:\n\u003chttps://greedyq.netlify.app/>\n\nPresent my approved audio file with ordinary playback controls, a caption, and a transcript. Do not autoplay or treat playback as an answer.\n\nShow the desktop and phone preview, explain the saved values, and ask me before changing research decisions.","video_example":"Read and follow the greedyQ start page. If you cannot read it, stop and tell me:\n\u003chttps://greedyq.netlify.app/>\n\nPresent my approved video with a poster image, playback controls, and available captions or transcript. Do not autoplay.\n\nShow the desktop and phone preview, explain the saved values, and ask me before changing research decisions.","rank_example":"Read and follow the greedyQ start page. If you cannot read it, stop and tell me:\n\u003chttps://greedyq.netlify.app/>\n\nAsk participants to rank ease of use, speed, and flexibility. Use rank selectors so dragging is not required.\n\nShow the desktop and phone preview, explain the saved values, and ask me before changing research decisions.","sbs_example":"Read and follow the greedyQ start page. If you cannot read it, stop and tell me:\n\u003chttps://greedyq.netlify.app/>\n\nRate the current and proposed versions on clarity and usefulness with the same Low–Medium–High scale. Label both versions clearly on phones.\n\nShow the desktop and phone preview, explain the saved values, and ask me before changing research decisions.","nps_example":"Read and follow the greedyQ start page. If you cannot read it, stop and tell me:\n\u003chttps://greedyq.netlify.app/>\n\nAsk likelihood of recommending the service on the 0–10 scale. Show every number and both endpoint descriptions.\n\nShow the desktop and phone preview, explain the saved values, and ask me before changing research decisions.","timing":"Read and follow the greedyQ start page. If you cannot read it, stop and tell me:\n\u003chttps://greedyq.netlify.app/>\n\nRecord time spent on the stimulus page as hidden metadata. Explain when timing starts and stops and how it is exported. Do not invent an exclusion threshold.\n\nShow the desktop and phone preview, explain the saved values, and ask me before changing research decisions.","sum_example":"Read and follow the greedyQ start page. If you cannot read it, stop and tell me:\n\u003chttps://greedyq.netlify.app/>\n\nAllocate exactly 100 points across design, testing, and documentation. Show the live total and explain any mismatch.\n\nShow the desktop and phone preview, explain the saved values, and ask me before changing research decisions.","group_rank_example":"Read and follow the greedyQ start page. If you cannot read it, stop and tell me:\n\u003chttps://greedyq.netlify.app/>\n\nGroup speed, trust, and ease into Essential or Optional, then rank the items within each group.\n\nShow the desktop and phone preview, explain the saved values, and ask me before changing research decisions.","drill_example":"Read and follow the greedyQ start page. If you cannot read it, stop and tell me:\n\u003chttps://greedyq.netlify.app/>\n\nChoose a location through region, country, and city. Show only cities belonging to the selected country and reset incompatible later selections.\n\nShow the desktop and phone preview, explain the saved values, and ask me before changing research decisions.","custom_example":"Read and follow the greedyQ start page. If you cannot read it, stop and tell me:\n\u003chttps://greedyq.netlify.app/>\n\nI need a product-choice card. Identify the closest supported base control and agree appearance, interaction, mobile behavior, accessibility, saved values, and extra work before coding.\n\nShow the desktop and phone preview, explain the saved values, and ask me before changing research decisions.","look-colors":"Read and follow the greedyQ start page. If you cannot read it, stop and tell me:\n\u003chttps://greedyq.netlify.app/>\n\nUse a white background, dark charcoal text, and a deep-green primary button. Keep contrast and keyboard focus clear. Show desktop and phone previews. Do not change questions, answer values, or study routes.","look-words":"Read and follow the greedyQ start page. If you cannot read it, stop and tell me:\n\u003chttps://greedyq.netlify.app/>\n\nShow [university or laboratory name] at the top. Change Continue to Next on questionnaire pages and use Submit on the final page. Preserve the actions and all stored values. Show me the revised screens.","look-buttons":"Read and follow the greedyQ start page. If you cannot read it, stop and tell me:\n\u003chttps://greedyq.netlify.app/>\n\nHide Previous on consent, show it on questionnaire pages, and display it disabled on final review. On the approved stimulus page, delay Continue for 12 seconds with a countdown. Show every state on desktop and phone.","first-draft":"Read and follow the greedyQ start page. If you cannot read it, stop and tell me:\n\u003chttps://greedyq.netlify.app/>\n\nFollow the greedyQ start guide. Create a satisfaction survey under three minutes for people who have used our service at least once. Cover overall satisfaction, ease of use, usefulness, result quality, reuse intention and one improvement. First confirm how I want to write the questions, and show a working preview before deployment.","first-manual":"Read and follow the greedyQ start page. If you cannot read it, stop and tell me:\n\u003chttps://greedyq.netlify.app/>\n\nI will write the questions myself. Create only the opening and ending pages, then ask for my first question. Record unresolved decisions instead of inventing them.","first-research":"Read and follow the greedyQ start page. If you cannot read it, stop and tell me:\n\u003chttps://greedyq.netlify.app/>\n\nAsk participants to rank five priorities and allocate exactly 100 points across three activities. Explain what the saved answers mean, demonstrate desktop and mobile behavior, then ask for my approval."},"examplesArchived":"\u003cp>Try imaginary questions, then ask your AI for controls that suit your research.\u003c/p>\u003cp>\u003ca href=\"https://zomtoli7.github.io/greedyQ/examples/control-gallery/preview.html\" target=\"_blank\">\u003cstrong>Open the public question gallery in a new tab ↗\u003c/strong>\u003c/a>\u003c/p>\u003cp>The gallery uses virtual participants and makes no external response writes. Do not enter real participant or research data. The public link works, but it is not pinned to a specific release. It may differ from new features in the handoff working copy.\u003c/p>\u003ch2>1. Try the questions\u003c/h2>\u003cp>① Try choices, written answers, sliders and matrices. ② Compare Desktop and Mobile. ③ Open View structure to inspect the sequence. ④ Select Try advanced controls for ranking, allocations and other extensions.\u003c/p>\u003cblockquote>Add a matrix rating ease of use, speed, reliability and clarity. Use five choices from Very poor to Excellent. Show a table on desktop and individual row cards without horizontal scrolling on a phone.\u003c/blockquote>\u003cp>\u003cstrong>Expected result:\u003c/strong> A desktop table and phone-friendly row cards. Each view has its own virtual participant.\u003c/p>\u003ch2>2. Ask in research language\u003c/h2>\u003cp>\u003cstrong>Written answers:\u003c/strong> A single line or a longer response.\u003cbr>\u003cstrong>Categories:\u003c/strong> One choice, multiple choices, images or a dropdown.\u003cbr>\u003cstrong>Ratings:\u003c/strong> Numbers, sliders and matrices.\u003cbr>\u003cstrong>Extensions:\u003c/strong> Ranking, a fixed total of 100 points, hierarchical choices, audio and video.\u003c/p>\u003cblockquote>Ask participants to rank five priorities and allocate exactly 100 points across three activities. Explain what the saved answers mean, demonstrate desktop and mobile behavior, then ask for my approval.\u003c/blockquote>\u003cp>Request captions and transcripts when the research permits. greedyQ extensions are not all built-in Surveydown question types.\u003c/p>\u003ch2>3. Start with a short survey\u003c/h2>\u003cblockquote>Follow the greedyQ start guide. Create a satisfaction survey under three minutes for people who have used our service at least once. Cover overall satisfaction, ease of use, usefulness, result quality, reuse intention and one improvement. First confirm how I want to write the questions, and show a working preview before deployment.\u003c/blockquote>\u003cp>① Adapt the purpose and participants. ② Review proposed questions. ③ Personally complete the preview.\u003c/p>\u003ch2>Something went wrong?\u003c/h2>\u003cp>If the embed is too small or fails, use the new-tab link above. The gallery has English examples; ask your AI for Korean questions when needed. Before creating a special control, identify the nearest supported control and agree on extra time, AI usage, mobile behavior, accessibility and saved values.\u003c/p>"},"ko":{"nav":["홈","시작하기","사용법","예제","소개"],"copy":"복사","copied":"복사됨","selectCopy":"텍스트 선택 후 복사","promptLabel":"AI에게 요청하기","contents":"목차","next":"다음","previous":"이전","menu":"메뉴","language":"언어","draft":"v0.2 · 0.2_2026-10-26_ed1dc2b · 2026-10-26","home":{"eyebrow":"대화로 시작하는 온라인 연구","title":"연구에 쓸 시간을 아끼세요.","sub":"설문 제작은 AI에게 요청하세요.","text":"알고 싶은 연구를 AI에게 이야기하세요. 문항과 화면을 함께 만들고, 컴퓨터와 휴대전화에서 직접 응답해 본 뒤 실제 참여자를 받을 수 있습니다. 중요한 결정은 연구자가 확인합니다.","start":"설문 시작하기","example":"예제 둘러보기","steps":[["설명","알고 싶은 것과 참여 대상을 AI에게 알려주세요."],["검토","컴퓨터와 휴대전화에서 설문을 직접 시험하세요."],["확인하고 시작","설문을 확인한 뒤 로그인·연결을 승인하고 실제 응답을 받으세요."]],"note":"먼저 ChatGPT 데스크톱 또는 Claude Desktop을 컴퓨터에 설치해 여세요. greedyQ는 파일을 직접 다루고 작업을 실행하는 에이전트 기능을 사용합니다. 따라서 greedyQ는 AI 웹 앱을 공식 지원하지 않습니다. 또한, 현재 Gemini는 데스크톱 앱을 포함해 공식 지원하지 않습니다."},"start":{"title":"연구 질문 하나로 시작하세요.","lead":"먼저 ChatGPT 데스크톱 또는 Claude Desktop을 컴퓨터에 설치해 열고, 다음과 같이 AI에게 요청하세요.","prompt":"아래 greedyQ 시작 안내를 읽고 따라줘. 읽을 수 없으면 멈추고 알려줘:\n\u003chttps://greedyq.netlify.app/>\n\n새 연구를 만들자. 한 번에 한 가지씩 질문하고 컴퓨터·모바일에서 작동하는 미리보기까지 안내해줘.\n\n알고 싶은 것: [연구 질문]\n참여 대상: [누구에게 물을지]\n\n문항을 직접 쓸지 AI 초안을 검토할지 먼저 물어봐. 아직 계정 연결이나 배포는 하지 마.","after":"위 요청은 AI 웹사이트나 웹사이트 바로가기가 아니라 설치한 데스크톱 앱에 붙여 넣으세요. AI는 먼저 실제 작업 도구를 확인해야 합니다. 안내서를 읽지 못하면 같은 데스크톱 앱 안에서 원문 주소나 다운로드한 전체 저장소·가이드로 다시 읽습니다. 권한 오류가 났는데도 빠진 내용을 추측해 진행하면 안 됩니다. 가이드 파일을 첨부해도 없던 실행 기능이 생기지는 않습니다. 앱과 가이드가 준비되면 연구 내용을 한 가지씩 이야기하세요. “미리보기”까지는 외부 서비스 계정이 필요 없습니다. 실제 공개를 선택한 때 Vercel 로그인과 필요한 연결을 승인합니다. 이미 승인된 공식 연결은 우선 활용하며 Onboard your agent는 선택 사항입니다.","returnTitle":"진행 중인 연구가 있나요?","returnText":"연구 폴더를 제공하고 재개, 특정 부분 수정, 독립된 사본 만들기 중 하나를 요청하세요. 업그레이드는 차이를 검토한 뒤 승인합니다.","action":"설문 만들기 안내 보기","supportNote":"참고: 현재 greedyQ는 필요한 에이전트 기능이 있는 ChatGPT·Claude 데스크톱 앱에서만 설문 제작을 지원합니다. Gemini는 가이드 접근과 전체 실행 과정이 검증되지 않아 현재 지원하지 않습니다."},"guideGroups":[["만들기",["first","controls","flow","appearance","preview"]],["실험",["random"]],["수집",["deploy","prolific","results","prereg"]],["다시 사용",["archive","upgrade"]]],"guide":[{"id":"first","title":"첫 설문 만들기","lead":"알고 싶은 것과 의견을 듣고 싶은 사람만 알려주세요. AI가 한 가지씩 물으며 설문을 함께 만듭니다.","body":"\u003ch2>설문 제작에 사용할 앱\u003c/h2>\u003cp>먼저 ChatGPT 데스크톱 또는 Claude Desktop을 컴퓨터에 설치해 여세요. Gemini는 데스크톱 앱을 포함해 공식 지원하지 않습니다. 파일을 다루고 작업을 실행하는 에이전트 기능을 사용합니다. greedyQ는 AI 웹 앱을 공식 지원하지 않습니다.\u003c/p>\u003cp>greedyQ로 설문을 만들거나 수정할 때는 컴퓨터에 설치한 AI 데스크톱 앱이 반드시 필요합니다. AI 웹 앱은 공식 지원하지 않습니다. ChatGPT 데스크톱 또는 Claude Desktop을 공식 제공처에서 다운로드하세요. Gemini는 데스크톱 앱을 포함해 공식 지원하지 않습니다. 앱에서 파일을 읽고 만들고 작업을 실행하는 에이전트 기능을 사용해야 합니다. 앱 설치나 유료 구독만으로 이 기능이 보장되지는 않습니다. 필요한 도구가 없는 일반 채팅으로는 설문 제작을 진행하지 않습니다. 참여자가 설문에 응답하거나 연구자가 컴퓨터·모바일 미리보기와 결과 화면을 보는 데에는 계속 웹브라우저를 사용합니다.\u003c/p>\u003cp>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/SUPPORTED-ENVIRONMENTS(kor).md\">설문 제작에 사용할 앱\u003c/a>\u003c/p>\u003ch2>연구 생각부터 이야기하세요\u003c/h2>\u003cp>“우리 서비스를 써 본 사람들이 얼마나 만족하는지 알고 싶어”처럼 시작하면 됩니다. 완성된 연구계획서나 문항 목록을 미리 준비할 필요는 없습니다. AI가 목적과 참여 대상을 확인하고, 설문 위에 표시할 학교·회사·연구팀 이름도 물어봅니다.\u003c/p>\u003ch2>문항을 누가 먼저 쓸지 선택하세요\u003c/h2>\u003cp>문항을 직접 쓰고 싶다면 “시작 화면과 끝 화면만 먼저 만들고, 첫 질문부터 나에게 물어봐”라고 하세요. 여러 문항을 한 번에 주어도 순서대로 반영합니다. AI의 도움을 받고 싶다면 “내 연구 목적에 맞게 초안을 먼저 만들어줘”라고 요청한 뒤 제안된 문항을 검토하세요. AI가 제안해도 최종 결정은 연구자에게 있습니다.\u003c/p>\u003cdiv data-control-prompt=\"first-draft\">\u003c/div>\u003cdiv data-control-prompt=\"first-manual\">\u003c/div>\u003ch2>아직 정하지 않은 내용이 있어도 괜찮습니다\u003c/h2>\u003cp>모르는 것은 “아직 정하지 않았어”라고 답하세요. AI는 추측해서 채우지 않고 나중에 확인할 사항으로 남겨야 합니다. 연구윤리와 참여 동의의 자세한 내용도 초안을 본 뒤 정할 수 있습니다. 다만 실제 참여자를 받기 전에는 반드시 확인합니다.\u003c/p>\u003ch2>말로 설명하고 화면으로 확인하세요\u003c/h2>\u003cp>“만족도를 5점으로 물어봐”, “여러 개를 고를 수 있게 해줘”, “이 질문은 앞에서 ‘아니요’를 고른 사람에게만 보여줘”처럼 요청하면 됩니다. 어느 정도 완성되면 설명 문서만 읽지 말고 “미리보기”에서 직접 응답해 보세요.\u003c/p>\u003cdiv data-control-prompt=\"first-research\">\u003c/div>\u003ch2>AI가 안내서를 열지 못할 때\u003c/h2>\u003cp>위 요청은 AI 웹사이트나 웹사이트 바로가기가 아니라 설치한 데스크톱 앱에 붙여 넣으세요. AI는 먼저 실제 작업 도구를 확인해야 합니다. 안내서를 읽지 못하면 같은 데스크톱 앱 안에서 원문 주소나 다운로드한 전체 저장소·가이드로 다시 읽습니다. 권한 오류가 났는데도 빠진 내용을 추측해 진행하면 안 됩니다. 가이드 파일을 첨부해도 없던 실행 기능이 생기지는 않습니다. 앱과 가이드가 준비되면 연구 내용을 한 가지씩 이야기하세요. “미리보기”까지는 외부 서비스 계정이 필요 없습니다. 실제 공개를 선택한 때 Vercel 로그인과 필요한 연결을 승인합니다. 이미 승인된 공식 연결은 우선 활용하며 Onboard your agent는 선택 사항입니다.\u003c/p>\u003cp>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/GUIDE-ACCESS(kor).md\" target=\"_blank\" rel=\"noopener\">가이드 읽기 문제 해결 안내\u003c/a>\u003c/p>","prompt":""},{"id":"controls","title":"질문 형식 골라보기","lead":"설명만 읽기보다 예시를 눌러 보세요. 원하는 모습의 질문을 AI에게 요청할 수 있습니다.","body":"\u003cp>아래는 참여자에게 질문을 보여주는 여러 방법입니다. 익숙한 문항을 찾아 직접 눌러보고, 옆의 요청 예시를 복사해 AI에게 전달하세요. 코드 이름을 외울 필요는 없습니다. 특별한 모양이 필요하면 먼저 원하는 동작을 설명하고 추가 작업이 얼마나 필요한지 확인합니다.\u003c/p>\u003cnav class=\"control-index\" aria-label=\"컨트롤 찾기\">\u003ca href=\"#control-short_text\" data-control-jump=\"control-short_text\">짧은 답변\u003c/a>\u003ca href=\"#control-long_text\" data-control-jump=\"control-long_text\">긴 답변\u003c/a>\u003ca href=\"#control-number\" data-control-jump=\"control-number\">숫자\u003c/a>\u003ca href=\"#control-single\" data-control-jump=\"control-single\">단일 선택\u003c/a>\u003ca href=\"#control-multiple\" data-control-jump=\"control-multiple\">복수 선택\u003c/a>\u003ca href=\"#control-buttons\" data-control-jump=\"control-buttons\">단일 선택 버튼\u003c/a>\u003ca href=\"#control-multi_buttons\" data-control-jump=\"control-multi_buttons\">복수 선택 버튼\u003c/a>\u003ca href=\"#control-image\" data-control-jump=\"control-image\">단일 이미지 선택\u003c/a>\u003ca href=\"#control-multi_image\" data-control-jump=\"control-multi_image\">복수 이미지 선택\u003c/a>\u003ca href=\"#control-menu\" data-control-jump=\"control-menu\">드롭다운\u003c/a>\u003ca href=\"#control-labeled_slider\" data-control-jump=\"control-labeled_slider\">범주형 슬라이더\u003c/a>\u003ca href=\"#control-numeric_slider\" data-control-jump=\"control-numeric_slider\">숫자 슬라이더\u003c/a>\u003ca href=\"#control-range_slider\" data-control-jump=\"control-range_slider\">구간 슬라이더\u003c/a>\u003ca href=\"#control-one_date\" data-control-jump=\"control-one_date\">날짜\u003c/a>\u003ca href=\"#control-date_range\" data-control-jump=\"control-date_range\">기간\u003c/a>\u003ca href=\"#control-one_matrix\" data-control-jump=\"control-one_matrix\">단일 선택 행렬\u003c/a>\u003ca href=\"#control-multi_matrix\" data-control-jump=\"control-multi_matrix\">복수 선택 행렬\u003c/a>\u003ca href=\"#control-audio_example\" data-control-jump=\"control-audio_example\">음성 자극\u003c/a>\u003ca href=\"#control-video_example\" data-control-jump=\"control-video_example\">영상 자극\u003c/a>\u003ca href=\"#control-rank_example\" data-control-jump=\"control-rank_example\">순위 매기기\u003c/a>\u003ca href=\"#control-sbs_example\" data-control-jump=\"control-sbs_example\">나란히 평가\u003c/a>\u003ca href=\"#control-nps_example\" data-control-jump=\"control-nps_example\">추천 의향\u003c/a>\u003ca href=\"#control-timing\" data-control-jump=\"control-timing\">페이지 체류 시간\u003c/a>\u003ca href=\"#control-sum_example\" data-control-jump=\"control-sum_example\">고정 합계 배분\u003c/a>\u003ca href=\"#control-group_rank_example\" data-control-jump=\"control-group_rank_example\">분류 후 순위\u003c/a>\u003ca href=\"#control-drill_example\" data-control-jump=\"control-drill_example\">단계별 선택\u003c/a>\u003ca href=\"#control-custom_example\" data-control-jump=\"control-custom_example\">사용자 정의\u003c/a>\u003c/nav>\u003cdiv class=\"control-list\">\u003csection class=\"control-item\" id=\"control-short_text\">\u003cp class=\"eyebrow\">기본 문항\u003c/p>\u003ch2>01 · 짧은 답변\u003c/h2>\u003cp>한 줄 답변·이름표·코드에 사용합니다.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>AI에게 전달할 문항 이름\u003c/summary>\u003ccode>text\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"short_text\">\u003c/div>\u003cdiv data-control-prompt=\"short_text\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-long_text\">\u003cp class=\"eyebrow\">기본 문항\u003c/p>\u003ch2>02 · 긴 답변\u003c/h2>\u003cp>의견이나 이유처럼 여러 줄이 필요한 답변입니다.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>AI에게 전달할 문항 이름\u003c/summary>\u003ccode>textarea\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"long_text\">\u003c/div>\u003cdiv data-control-prompt=\"long_text\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-number\">\u003cp class=\"eyebrow\">기본 문항\u003c/p>\u003ch2>03 · 숫자\u003c/h2>\u003cp>나이·수량·금액을 입력합니다. 단위와 허용 범위를 정하세요.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>AI에게 전달할 문항 이름\u003c/summary>\u003ccode>numeric\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"number\">\u003c/div>\u003cdiv data-control-prompt=\"number\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-single\">\u003cp class=\"eyebrow\">기본 문항\u003c/p>\u003ch2>04 · 단일 선택\u003c/h2>\u003cp>하나만 고르거나 해당하는 항목을 모두 고릅니다. 선택 규칙을 명시하세요.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>AI에게 전달할 문항 이름\u003c/summary>\u003ccode>mc\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"single\">\u003c/div>\u003cdiv data-control-prompt=\"single\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-multiple\">\u003cp class=\"eyebrow\">기본 문항\u003c/p>\u003ch2>05 · 복수 선택\u003c/h2>\u003cp>하나만 고르거나 해당하는 항목을 모두 고릅니다. 선택 규칙을 명시하세요.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>AI에게 전달할 문항 이름\u003c/summary>\u003ccode>mc_multiple\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"multiple\">\u003c/div>\u003cdiv data-control-prompt=\"multiple\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-buttons\">\u003cp class=\"eyebrow\">기본 문항\u003c/p>\u003ch2>06 · 단일 선택 버튼\u003c/h2>\u003cp>단일·복수 선택을 큰 버튼으로 표시합니다. 짧은 보기 목록에 적합합니다.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>AI에게 전달할 문항 이름\u003c/summary>\u003ccode>mc_buttons\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"buttons\">\u003c/div>\u003cdiv data-control-prompt=\"buttons\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-multi_buttons\">\u003cp class=\"eyebrow\">기본 문항\u003c/p>\u003ch2>07 · 복수 선택 버튼\u003c/h2>\u003cp>단일·복수 선택을 큰 버튼으로 표시합니다. 짧은 보기 목록에 적합합니다.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>AI에게 전달할 문항 이름\u003c/summary>\u003ccode>mc_multiple_buttons\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"multi_buttons\">\u003c/div>\u003cdiv data-control-prompt=\"multi_buttons\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-image\">\u003cp class=\"eyebrow\">기본 문항\u003c/p>\u003ch2>08 · 단일 이미지 선택\u003c/h2>\u003cp>이미지 카드 하나 또는 여러 개를 고릅니다. 이미지와 의미 있는 설명을 함께 준비하세요.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>AI에게 전달할 문항 이름\u003c/summary>\u003ccode>mc_image\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"image\">\u003c/div>\u003cdiv data-control-prompt=\"image\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-multi_image\">\u003cp class=\"eyebrow\">기본 문항\u003c/p>\u003ch2>09 · 복수 이미지 선택\u003c/h2>\u003cp>이미지 카드 하나 또는 여러 개를 고릅니다. 이미지와 의미 있는 설명을 함께 준비하세요.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>AI에게 전달할 문항 이름\u003c/summary>\u003ccode>mc_multiple_image\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"multi_image\">\u003c/div>\u003cdiv data-control-prompt=\"multi_image\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-menu\">\u003cp class=\"eyebrow\">기본 문항\u003c/p>\u003ch2>10 · 드롭다운\u003c/h2>\u003cp>긴 범주 목록에서 고릅니다. 처음 보이는 빈 안내 문구는 답변이 아닙니다.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>AI에게 전달할 문항 이름\u003c/summary>\u003ccode>select\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"menu\">\u003c/div>\u003cdiv data-control-prompt=\"menu\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-labeled_slider\">\u003cp class=\"eyebrow\">기본 문항\u003c/p>\u003ch2>11 · 범주형 슬라이더\u003c/h2>\u003cp>낮음→높음처럼 순서가 있는 범주를 고릅니다. 선택한 범주의 값이 저장됩니다.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>AI에게 전달할 문항 이름\u003c/summary>\u003ccode>slider\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"labeled_slider\">\u003c/div>\u003cdiv data-control-prompt=\"labeled_slider\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-numeric_slider\">\u003cp class=\"eyebrow\">기본 문항\u003c/p>\u003ch2>12 · 숫자 슬라이더\u003c/h2>\u003cp>숫자 하나 또는 두 손잡이로 하한·상한 구간을 고릅니다. 양 끝값과 단위를 정하세요.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>AI에게 전달할 문항 이름\u003c/summary>\u003ccode>slider_numeric\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"numeric_slider\">\u003c/div>\u003cdiv data-control-prompt=\"numeric_slider\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-range_slider\">\u003cp class=\"eyebrow\">기본 문항\u003c/p>\u003ch2>13 · 구간 슬라이더\u003c/h2>\u003cp>숫자 하나 또는 두 손잡이로 하한·상한 구간을 고릅니다. 양 끝값과 단위를 정하세요.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>AI에게 전달할 문항 이름\u003c/summary>\u003ccode>slider_numeric\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"range_slider\">\u003c/div>\u003cdiv data-control-prompt=\"range_slider\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-one_date\">\u003cp class=\"eyebrow\">기본 문항\u003c/p>\u003ch2>14 · 날짜\u003c/h2>\u003cp>날짜 하나 또는 시작일·종료일을 묻습니다.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>AI에게 전달할 문항 이름\u003c/summary>\u003ccode>date\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"one_date\">\u003c/div>\u003cdiv data-control-prompt=\"one_date\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-date_range\">\u003cp class=\"eyebrow\">기본 문항\u003c/p>\u003ch2>15 · 기간\u003c/h2>\u003cp>날짜 하나 또는 시작일·종료일을 묻습니다.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>AI에게 전달할 문항 이름\u003c/summary>\u003ccode>daterange\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"date_range\">\u003c/div>\u003cdiv data-control-prompt=\"date_range\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-one_matrix\">\u003cp class=\"eyebrow\">기본 문항\u003c/p>\u003ch2>16 · 단일 선택 행렬\u003c/h2>\u003cp>여러 진술에 같은 척도를 적용합니다. 단일형은 행마다 하나, 복수형은 행마다 여러 개를 선택합니다.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>AI에게 전달할 문항 이름\u003c/summary>\u003ccode>matrix\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"one_matrix\">\u003c/div>\u003cdiv data-control-prompt=\"one_matrix\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-multi_matrix\">\u003cp class=\"eyebrow\">기본 문항\u003c/p>\u003ch2>17 · 복수 선택 행렬\u003c/h2>\u003cp>여러 진술에 같은 척도를 적용합니다. 단일형은 행마다 하나, 복수형은 행마다 여러 개를 선택합니다.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>AI에게 전달할 문항 이름\u003c/summary>\u003ccode>matrix_multiple\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"multi_matrix\">\u003c/div>\u003cdiv data-control-prompt=\"multi_matrix\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-audio_example\">\u003cp class=\"eyebrow\">greedyQ 확장\u003c/p>\u003ch2>18 · 음성 자극\u003c/h2>\u003cp>일반 재생 버튼으로 연구 자극을 제시합니다. 연구가 허용하면 자막·대본을 제공합니다. 재생 화면 자체는 응답 변수를 만들지 않습니다.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>AI에게 전달할 문항 이름\u003c/summary>\u003ccode>audio\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"audio_example\">\u003c/div>\u003cdiv data-control-prompt=\"audio_example\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-video_example\">\u003cp class=\"eyebrow\">greedyQ 확장\u003c/p>\u003ch2>19 · 영상 자극\u003c/h2>\u003cp>일반 재생 버튼으로 연구 자극을 제시합니다. 연구가 허용하면 자막·대본을 제공합니다. 재생 화면 자체는 응답 변수를 만들지 않습니다.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>AI에게 전달할 문항 이름\u003c/summary>\u003ccode>video\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"video_example\">\u003c/div>\u003cdiv data-control-prompt=\"video_example\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-rank_example\">\u003cp class=\"eyebrow\">greedyQ 확장\u003c/p>\u003ch2>20 · 순위 매기기\u003c/h2>\u003cp>목록 전체의 선호 순위를 정합니다. 정밀한 드래그 없이 순위 선택으로 조작합니다.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>AI에게 전달할 문항 이름\u003c/summary>\u003ccode>rank_order\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"rank_example\">\u003c/div>\u003cdiv data-control-prompt=\"rank_example\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-sbs_example\">\u003cp class=\"eyebrow\">greedyQ 확장\u003c/p>\u003ch2>21 · 나란히 평가\u003c/h2>\u003cp>항목·척도를 공유하는 여러 평가를 함께 제시합니다. 휴대폰에서는 이름이 붙은 구역으로 나눕니다.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>AI에게 전달할 문항 이름\u003c/summary>\u003ccode>side_by_side\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"sbs_example\">\u003c/div>\u003cdiv data-control-prompt=\"sbs_example\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-nps_example\">\u003cp class=\"eyebrow\">greedyQ 확장\u003c/p>\u003ch2>22 · 추천 의향\u003c/h2>\u003cp>표준 0–10 추천 의향 척도입니다. 모든 숫자와 양 끝 설명이 보여야 합니다.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>AI에게 전달할 문항 이름\u003c/summary>\u003ccode>nps\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"nps_example\">\u003c/div>\u003cdiv data-control-prompt=\"nps_example\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-timing\">\u003cp class=\"eyebrow\">greedyQ 확장\u003c/p>\u003ch2>23 · 페이지 체류 시간\u003c/h2>\u003cp>화면에 질문을 띄우지 않고 페이지 체류 초를 기록합니다. 연구에서 사용할 목적을 확인하세요.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>AI에게 전달할 문항 이름\u003c/summary>\u003ccode>timing\u003c/code>\u003c/details>\u003cp class=\"note\">시간 기록은 숨겨진 기능으로 참여자가 직접 답하는 화면이 없습니다. 에이전트에게 기록된 시간과 활용 방식을 보여 달라고 요청하세요.\u003c/p>\u003cdiv data-control-prompt=\"timing\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-sum_example\">\u003cp class=\"eyebrow\">greedyQ 확장\u003c/p>\u003ch2>24 · 고정 합계 배분\u003c/h2>\u003cp>예산·시간·100점 등을 항목별로 배분합니다. 현재 합계를 표시하고 정한 총합을 확인합니다.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>AI에게 전달할 문항 이름\u003c/summary>\u003ccode>constant_sum\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"sum_example\">\u003c/div>\u003cdiv data-control-prompt=\"sum_example\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-group_rank_example\">\u003cp class=\"eyebrow\">greedyQ 확장\u003c/p>\u003ch2>25 · 분류 후 순위\u003c/h2>\u003cp>항목을 그룹으로 분류한 뒤 그룹 안에서 순위를 정합니다. 그룹·순위 입력란을 사용합니다.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>AI에게 전달할 문항 이름\u003c/summary>\u003ccode>pick_group_rank\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"group_rank_example\">\u003c/div>\u003cdiv data-control-prompt=\"group_rank_example\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-drill_example\">\u003cp class=\"eyebrow\">greedyQ 확장\u003c/p>\u003ch2>26 · 단계별 선택\u003c/h2>\u003cp>지역→국가→도시처럼 범위를 좁힙니다. 앞선 선택에 맞는 하위 보기만 표시합니다.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>AI에게 전달할 문항 이름\u003c/summary>\u003ccode>drill_down\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"drill_example\">\u003c/div>\u003cdiv data-control-prompt=\"drill_example\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-custom_example\">\u003cp class=\"eyebrow\">greedyQ 확장\u003c/p>\u003ch2>27 · 사용자 정의\u003c/h2>\u003cp>이 예시는 기존 선택형 문항을 바꾼 것입니다. 원하는 그림·선택 방식과 나중에 어떤 답이 자료에 남을지를 AI와 먼저 정한 뒤 만듭니다. 추가 시간과 AI 사용량이 필요할 수 있습니다.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>AI에게 전달할 문항 이름\u003c/summary>\u003ccode>custom\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"custom_example\">\u003c/div>\u003cdiv data-control-prompt=\"custom_example\">\u003c/div>\u003c/section>\u003c/div>","prompt":""},{"id":"flow","title":"질문 순서와 이동 정하기","lead":"어떤 사람이 어떤 질문을 보고, 어디에서 설문을 마치는지 함께 정합니다.","body":"\u003ch2>참여자가 지나갈 길을 설명하세요\u003c/h2>\u003cp>모든 사람이 같은 질문을 볼 필요는 없습니다. 예를 들어 “서비스를 사용해 본 사람만 만족도 질문으로 보내고, 사용한 적이 없으면 감사 인사와 함께 끝내줘”라고 말하세요. AI가 조건에 맞게 질문과 화면을 연결합니다.\u003c/p>\u003ch2>“구조 보기”로 전체 흐름을 살펴보세요\u003c/h2>\u003cp>“미리보기” 위쪽의 “구조 보기”(View structure)를 누르면 시작부터 끝까지 페이지와 문항을 펼쳐 볼 수 있습니다. T는 안내 문장, Q는 질문입니다. 내용을 한눈에 확인하는 목록이므로 여기서 누른다고 질문이나 응답이 바뀌지는 않습니다.\u003c/p>\u003ch2>앞으로 가기와 돌아가기\u003c/h2>\u003cp>“이전” 버튼을 없애거나, 보이지만 누를 수 없게 하거나, 평소처럼 사용할 수 있습니다. 동영상이나 글을 일정 시간 보여주어야 한다면 “12초가 지나야 다음 화면으로 갈 수 있게 해줘”라고 요청하세요. 어떤 방식이 연구에 맞는지 먼저 정합니다.\u003c/p>\u003ch2>직접 다른 답을 골라보세요\u003c/h2>\u003cp>동의하기와 거절하기, 참여 조건에 맞는 경우와 맞지 않는 경우를 각각 시험하세요. 문제가 있으면 “어느 질문에서 무엇을 골랐고, 다음에 어떤 화면이 나왔으면 좋겠는지”를 AI에게 설명하면 됩니다.\u003c/p>","prompt":"아래 greedyQ 시작 안내를 읽고 따라줘. 읽을 수 없으면 멈추고 알려줘:\n\u003chttps://greedyq.netlify.app/>\n\n컴퓨터·모바일에서 참여 조건과 동의 거절 경로를 보여줘. 승인한 필수 응답과 이동 규칙만 적용하고 연구 결정은 바꾸기 전에 물어봐."},{"id":"appearance","title":"화면과 버튼 바꾸기","lead":"색깔부터 안내 문장, 버튼 이름과 동작까지 연구에 맞게 요청할 수 있습니다.","body":"\u003ch2>원하는 모습을 말로 알려주세요\u003c/h2>\u003cp>“흰 배경에 글자는 진하게, 주요 버튼은 우리 대학의 파란색으로 해줘”처럼 설명하세요. AI에게 컴퓨터와 휴대전화에서 글자가 잘 읽히는지, 누르는 부분이 충분히 큰지도 확인해 달라고 요청할 수 있습니다.\u003c/p>\u003cdiv data-control-prompt=\"look-colors\">\u003c/div>\u003ch2>연구팀 이름과 안내 문장을 바꿀 수 있습니다\u003c/h2>\u003cp>설문 위에 보이는 기관명, 설문 제목, 문항과 선택지, 참여 안내, 버튼의 이름을 수정할 수 있습니다. “다음 대신 계속하기라고 써줘”, “이 문장은 더 부드럽게 바꿔줘”처럼 바꿀 화면과 문구를 알려주세요. 다른 연구 내용은 그대로 유지해 달라고 덧붙이면 좋습니다.\u003c/p>\u003cdiv data-control-prompt=\"look-words\">\u003c/div>\u003ch2>버튼은 보이는 것과 눌리는 것을 따로 정합니다\u003c/h2>\u003cul>\u003cli>“보이게 하기”: 버튼이 보이고 누를 수 있습니다.\u003c/li>\u003cli>“숨기기”: 그 화면에는 버튼이 없습니다.\u003c/li>\u003cli>“누를 수 없게 하기”: 버튼은 보이지만 작동하지 않습니다.\u003c/li>\u003c/ul>\u003cp>예를 들어 특정 자료를 읽은 뒤 이전 화면으로 돌아가지 못하게 할 수 있습니다. 정해진 시간을 기다린 뒤 “다음”을 누르게 할 수도 있습니다. 이때 기다린 사실만으로 자료를 읽었다고 판단해서는 안 됩니다.\u003c/p>\u003cdiv data-control-prompt=\"look-buttons\">\u003c/div>\u003ch2>잘못 입력했을 때도 확인하세요\u003c/h2>\u003cp>필수 질문을 비워 두거나 합계를 잘못 입력한 뒤 “다음”을 눌러보세요. 고쳐야 하는 첫 질문으로 이동하고, 각 질문 바로 위에 설명이 나타나야 합니다. 합계 100점을 나누는 문항은 현재 합계의 색깔로도 안내합니다. 수정한 뒤에는 시작·질문·오류·종료 화면을 다시 살펴보세요.\u003c/p>","prompt":""},{"id":"preview","title":"직접 응답해 보기","lead":"“미리보기”는 실제 참여자를 모집하기 전에 연구자가 설문을 연습해 보는 화면입니다.","body":"\u003ch2>참여자가 된 것처럼 끝까지 해보세요\u003c/h2>\u003cp>AI에게 “컴퓨터와 휴대전화 화면을 함께 보여줘”라고 요청하세요. 두 화면에서 독립적으로 답을 골라볼 수 있습니다. 이때 넣은 답은 연습용이며 실제 연구 응답으로 수집하지 않습니다. 다른 사람을 모집할 때 쓰는 주소와 구분해 두세요.\u003c/p>\u003col>\u003cli>처음부터 끝까지 응답하며 문구와 순서가 자연스러운지 봅니다.\u003c/li>\u003cli>필수 문항을 비워 두고 “다음”을 눌러 안내를 확인합니다.\u003c/li>\u003cli>“이전”으로 돌아가거나 새로고침해도 의도대로 이어지는지 봅니다.\u003c/li>\u003cli>“기타”를 골랐을 때 추가 입력란이 나오는지 등 여러 선택을 시험합니다.\u003c/li>\u003cli>실험이라면 모든 조건과 자극물, 동의 거부·철회 등 적용되는 종료 화면도 봅니다.\u003c/li>\u003c/ol>\u003ch2>휴대전화에서도 읽고 누르기 편한가요?\u003c/h2>\u003cp>작은 화면에서 글자와 사진이 잘 보이는지, 버튼을 누르기 쉬운지 확인하세요. 표 문항은 문장별로 나뉘어 보이므로 긴 표 전체를 좌우로 끌지 않고 답할 수 있어야 합니다. 음성·영상에는 연구에 필요한 설명과 자막·대본이 있는지도 봅니다.\u003c/p>\u003ch2>수정은 보이는 문제를 설명하면 됩니다\u003c/h2>\u003cp>“두 번째 질문의 글자가 너무 작아”, “아니요를 고르면 바로 끝났으면 좋겠어”처럼 알려주세요. AI에게 다른 연구 결정은 유지하면서 고친 화면을 다시 보여달라고 요청하세요. 자동 검사에 통과했다는 말만 듣고 넘어가지 말고 직접 확인한 버전을 승인합니다.\u003c/p>\u003ch2>파일로 받았다면 이렇게 여세요\u003c/h2>\u003cp>ZIP 파일은 여러 파일을 묶어 놓은 것입니다. 먼저 압축을 풀고, 나온 파일을 한 폴더에 그대로 둔 채 “preview.html”을 더블클릭하면 브라우저에서 미리보기를 볼 수 있습니다. ZIP 안에서 바로 열거나 다른 파일을 지우지 마세요. “studio.html”만 안내받았다면 AI에게 어떤 파일을 선택해야 하는지 차례로 설명해 달라고 하세요. 이 화면의 “Preview questionnaire”는 원본을 읽어 새 연습을 시작하는 버튼입니다.\u003c/p>\u003cp>슬라이더 문항은 손잡이를 움직여야 응답한 것으로 기록됩니다. 연구자가 초기값을 따로 정해 둔 경우에는 다를 수 있으니 원치 않는 초기값이 없는지도 확인하세요.\u003c/p>","prompt":"아래 greedyQ 시작 안내를 읽고 따라줘. 읽을 수 없으면 멈추고 알려줘:\n\u003chttps://greedyq.netlify.app/>\n\n[문항 이름 또는 정확한 문구]에서 [수정할 내용]만 바꿔줘. 다른 문항, 저장값, 분기와 무작위 배정은 유지해줘. 변경점을 짧게 설명하고 컴퓨터·휴대폰 미리보기에서 수정된 문항을 보여줘."},{"id":"random","title":"그룹 배정과 제시 순서","lead":"참여자를 어떤 그룹에 보낼지, 질문이나 자료를 어떤 순서로 보여줄지 AI와 정할 수 있습니다.","body":"\u003ch2>참여자를 무작위로 나누기\u003c/h2>\u003cp>“A와 B에 같은 확률로 나눠줘”라고 요청할 수 있습니다. 사람마다 동전을 던지듯 독립적으로 나누는 “단순 무작위 배정”에서는 최종 인원이 꼭 같지는 않습니다. 일정 인원씩 묶어 그 안에서 비율을 맞추는 “고정 블록 무작위 배정”도 있습니다. 예를 들어 4명 한 묶음에 A 2명, B 2명을 넣고 순서를 섞을 수 있습니다.\u003c/p>\u003cp>어느 방식이 적합한지는 연구자가 정합니다. 마지막 묶음이 덜 차거나 중간에 그만둔 사람이 있으면 분석 인원은 다를 수 있습니다. 묶음 크기를 알고 있으면 다음 배정을 예상하기 쉬워질 수 있다는 점도 AI와 논의하세요.\u003c/p>\u003ch2>질문이나 선택지를 섞기\u003c/h2>\u003cp>“만족도 질문 세 개의 순서를 사람마다 섞어줘”, “선택지는 섞되 ‘기타’는 마지막에 둬”처럼 말하세요. 서로 영향을 주지 않는 일부 페이지의 순서를 섞을 수도 있습니다. 동의 화면이나 특정 조건에 따라 이동하는 페이지에는 제한이 있으므로 AI가 먼저 가능한 범위를 설명해야 합니다.\u003c/p>\u003ch2>더 다양한 설계도 함께 만들 수 있습니다\u003c/h2>\u003cp>예를 들어 “4개 그룹에 무작위 배정하고, 각 그룹에서는 내가 준비한 글을 참여 순서대로 하나씩 보여줘”라고 요청할 수 있습니다. 이때 그룹은 무작위로 나누고, 그룹 안의 글은 정한 목록 순서로 보여주는 서로 다른 절차입니다.\u003c/p>\u003cp>기본 기능만으로 되는지, 추가 구현이 필요한지는 AI가 먼저 설명합니다. 목록이 끝나거나 누군가 중간에 그만두면 어떻게 할지 함께 정하세요. 새로고침해도 같은 자료가 나오고, 여러 사람이 동시에 들어와도 의도대로 배정되는지 시험한 뒤 승인합니다. 모든 방식이 처음부터 준비되어 있는 것은 아니며 추가 작업과 시간이 필요할 수 있습니다.\u003c/p>\u003ch2>어떤 자료를 보았는지 기록하기\u003c/h2>\u003cp>AI에게 그룹과 제시 순서를 결과 자료에도 남겨 달라고 요청하세요. 나중에 분석할 때 도움이 됩니다. 다만 자료가 화면에 나왔다는 기록만으로 참여자가 읽거나 이해했다고 판단할 수는 없습니다.\u003c/p>","prompt":"아래 greedyQ 시작 안내를 읽고 따라줘. 읽을 수 없으면 멈추고 알려줘:\n\u003chttps://greedyq.netlify.app/>\n\nA와 B의 단순 무작위·고정 블록 배정 차이를 설명하고 비율과 배정 시점을 승인받아줘. 별도로 첫 네 선택지만 섞고 기타는 마지막에 고정해줘. 두 조건과 새로고침·재개를 보여줘.\n\n참가자를 같은 확률로 4개 그룹에 무작위 배정하고, 그룹 안에서는 내가 준비한 텍스트를 참여 순서대로 보여줘. 기본 기능과 필요한 확장을 구분하고, 순서의 기준·목록 소진·중단·분석 기록을 먼저 나와 정해줘. 구현 후 동시 참여·새로고침·시험/실제 분리까지 검증해줘."},{"id":"deploy","title":"설문 공개하고 응답 받기","lead":"연구자는 필요한 로그인과 승인에 참여하고, AI의 도움으로 실제 설문과 결과 화면을 준비합니다.","body":"\u003ch2>온라인으로 공개할 준비가 되었나요?\u003c/h2>\u003cp>먼저 “미리보기”에서 직접 응답해 보고 문항, 참여 동의, 개인정보 안내와 연구 계획을 확인하세요. 준비가 되면 AI에게 “이 설문으로 실제 응답을 받을 수 있게 해줘”라고 요청합니다. 사용할 계정, 자료를 보관할 지역, 비용이 있다면 그 금액도 먼저 확인하세요.\u003c/p>\u003ch2>연결 작업은 AI가 돕습니다\u003c/h2>\u003cp>일반적인 과정에서는 연구자가 Vercel에 로그인하고, 화면에 나오는 필요한 연결과 권한을 승인합니다. Vercel은 설문과 결과 화면을 인터넷에서 열 수 있도록 해주는 서비스입니다. Supabase는 참여자의 응답을 보관하는 서비스이며, 연결된 AI가 설정을 도와야 하므로 연구자가 데이터베이스 화면을 직접 다룰 필요는 없습니다.\u003c/p>\u003cp>이미 승인된 공식 Vercel 연결이 있으면 AI가 계정과 연구팀을 확인한 뒤 우선 사용합니다. 그렇지 않으면 기존의 지원되는 방식으로 진행합니다. 로그인 후에도 해당 연구팀 접근 승인을 한 번 더 요청받을 수 있습니다. 이 경우 AI가 주는 승인 링크에서 팀 이름과 권한을 확인하세요. 비밀번호나 비공개 인증 정보를 대화에 보내지 마세요.\u003c/p>\u003ch2>받게 되는 두 가지 링크\u003c/h2>\u003cp>\u003cstrong>“설문 링크”\u003c/strong>는 참여자에게 보내는 주소입니다. 참여자는 이 주소를 눌러 안내를 읽고 설문에 응답합니다. 이메일이나 연구 안내문에 실어 배포할 때 이 링크를 사용합니다.\u003c/p>\u003cp>\u003cstrong>“결과 보기 링크”\u003c/strong>는 연구자가 모인 응답을 확인하고 내려받는 주소입니다. 연구 자료를 다른 사람에게 공개하는 화면이 아니므로, 본인이나 허가받은 연구팀의 계정으로 로그인해야 볼 수 있도록 준비합니다. 이 링크는 참여자에게 보내지 않고 연구팀 안에서 보관하세요. AI가 허가받지 않은 사람이 결과를 볼 수 없는지도 확인해야 합니다.\u003c/p>\u003cp>앞서 사용한 \u003cstrong>“미리보기”\u003c/strong>는 연구자가 연습하는 화면입니다. 실제 응답을 받기 시작할 때는 미리보기 주소 대신 AI가 최종적으로 안내한 “설문 링크”를 사용하세요. 어떤 주소인지 헷갈리면 AI에게 용도별로 다시 이름을 붙여 달라고 요청하세요.\u003c/p>\u003ch2>다른 사람에게 보내기 전에 한 번 확인하세요\u003c/h2>\u003cp>AI에게 시험용 응답을 넣고 “결과 보기 링크”에서 확인해 달라고 요청하세요. 질문에 넣은 답이 실제로 보관되고, 본인이 결과를 열 수 있는지까지 확인한 다음에 참여자 모집을 승인합니다. 링크가 열리기만 하는 것과 응답이 잘 모이는 것은 다릅니다.\u003c/p>\u003ch2>참여자는 어떻게 모집하나요?\u003c/h2>\u003cp>이메일이나 커뮤니티를 통해 직접 모집한다면 준비한 “설문 링크”를 해당 사람들에게 전달합니다. Prolific으로 모집하려면 이어서 \u003cbutton data-page=\"guide\" data-topic=\"prolific\">Prolific 연결하기\u003c/button>를 확인하세요. Prolific용 설문은 플랫폼에서 참여자의 정보를 받아 시작하므로, 주소만 따로 열었을 때 시작되지 않을 수도 있습니다.\u003c/p>\u003ch2>선택 사항: “Onboard your agent”\u003c/h2>\u003cp>AI와 Vercel을 미리 연결해 두는 준비 기능입니다. 반복 사용을 위해 원할 때 선택할 수 있지만 greedyQ의 필수 단계는 아닙니다. 일반적으로 연구자가 도구를 설치하거나 앱을 재시작하는 일부터 시작할 필요는 없습니다. 이 준비를 마쳐도 설문 공개와 응답 저장은 따로 확인해야 합니다.\u003c/p>\u003ch2>현재 AI가 연결 작업을 할 수 없다면\u003c/h2>\u003cp>대화만 가능하고 계정을 조작할 수 없는 AI도 있습니다. 이때는 완성한 연구 폴더를 내려받아 보관하고, 연결 작업이 가능한 환경에서 이어가도록 안내받으세요. AI가 실제로 하지 않은 일을 완료했다고 말해서는 안 됩니다.\u003c/p>","prompt":"아래 greedyQ 시작 안내를 읽고 따라줘. 읽을 수 없으면 멈추고 알려줘:\n\u003chttps://greedyq.netlify.app/>\n\n이 설문을 실제 참여자에게 보낼 준비를 도와줘. 기존 방식으로 진행하고, 이미 승인된 공식 Vercel 연결이 있으면 먼저 사용해줘. “Onboard your agent”를 필수로 요구하지 마. 내 로그인이나 팀 승인이 필요한 순간에만 쉬운 말로 안내해줘. 시험용 응답이 저장되고 허가받은 연구자만 결과를 볼 수 있는지 확인한 뒤, “설문 링크”와 “결과 보기 링크”를 구분해서 알려줘. 실제 모집을 시작하기 전에는 내 승인을 받아줘."},{"id":"prolific","title":"Prolific으로 참여자 모집하기","lead":"설문은 greedyQ로 만들고, 참여자 모집과 보상은 Prolific에서 진행할 수 있습니다. 먼저 초안에서 연습한 뒤 실제 모집을 결정하세요.","body":"\u003ch2>시작하기 전에\u003c/h2>\u003cp>Prolific은 비용을 내고 연구 참여자를 모집하는 서비스입니다. \u003cbutton data-page=\"guide\" data-topic=\"deploy\">설문 공개하고 응답 받기\u003c/button>를 먼저 끝내고, AI에게 받은 “설문 링크”와 본인의 “결과 보기 링크”를 준비하세요. 이메일 등으로 직접 모집한다면 Prolific을 사용할 필요는 없습니다.\u003c/p>\u003ch2>1. Prolific에서 연구 초안을 만드세요\u003c/h2>\u003cp>연구자 계정으로 로그인해 새 연구를 만들고 제목, 설명, 참여 조건, 예상 시간과 보상을 정합니다. 무엇을 써야 할지 AI와 상의할 수 있습니다. 실제 모집은 아직 하지 말고 초안으로 저장하세요. 초안 페이지의 주소를 AI에게 주면 어느 연구인지 확인하는 데 도움이 됩니다. 비밀번호나 비공개 인증 정보는 주지 마세요.\u003c/p>\u003ch2>2. AI가 준비한 설문 주소를 넣으세요\u003c/h2>\u003cp>연구 설정의 설문 주소 입력란에 AI가 안내한 전체 주소를 붙여 넣으세요. Prolific에서 온 참여자를 구분하기 위해 주소 끝에 추가 정보가 붙을 수 있습니다. 직접 만들거나 일부를 지우지 말고 그대로 사용하세요. 설정 화면에서 어떤 항목을 눌러야 할지 모르면 화면에 보이는 이름을 AI에게 알려주세요.\u003c/p>\u003cdetails>\u003csummary>설정 이름을 확인해야 할 때\u003c/summary>\u003cp>“Data collection”의 “URL parameters”로 참여자 ID를 기록하며 PROLIFIC_PID, STUDY_ID, SESSION_ID를 각각 한 번 전달해야 합니다. AI가 이 설정과 설문 주소를 함께 확인합니다. 이 값은 완료를 증명하는 비밀번호나 서명이 아닙니다.\u003c/p>\u003c/details>\u003ch2>3. 끝나는 상황을 나누어 준비합니다\u003c/h2>\u003cp>끝까지 답한 경우, 동의하지 않은 경우, 참여하다 철회한 경우는 다릅니다. Prolific의 “Completion paths”에서 각각의 처리를 정하고, 화면에 나온 반환 주소나 코드를 AI에게 그대로 전달하세요. AI나 연구자가 임의로 코드를 만들면 안 됩니다.\u003c/p>\u003cp>동의 거부에는 “No consent”의 “Request a return”을, 철회에는 목적이 분명한 별도 경로와 검토한 처리를 사용합니다. 참여 조건에 맞지 않아 일찍 끝나는 사람도 있다면 “Screened out”과 보상 규칙을 먼저 확인하세요. 이미 Prolific에서 정한 사전 조건을 확인하는 것과 설문 안에서 새롭게 선별하는 것은 다릅니다. 필요한 보상과 종료 처리는 연구자가 결정합니다. 설문이 돌아갈 주소를 열었다고 플랫폼에서 반환 처리가 끝났다는 뜻은 아닙니다.\u003c/p>\u003ch2>4. 초안의 “Preview”로 연습하세요\u003c/h2>\u003cp>여기서 “Preview”는 Prolific이 제공하는 연구 초안 시험 기능입니다. 단순히 문항을 보던 greedyQ의 “미리보기”와 달리, Prolific에서 설문으로 들어갔다가 돌아오는 과정까지 확인합니다. AI에게 시험 모드로 준비해 달라고 요청하세요.\u003c/p>\u003col>\u003cli>“결과 보기 링크”에서 “Repeat Prolific preview”를 찾습니다.\u003c/li>\u003cli>AI가 안내한 설문 주소를 입력하고 “Create repeat-test link”를 누릅니다.\u003c/li>\u003cli>만들어진 개인 시험용 주소를 Prolific 초안의 설문 주소에 넣습니다.\u003c/li>\u003cli>Prolific의 “Preview”를 열어 정상 완료, 동의 거부, 참여 철회를 하나씩 해봅니다.\u003c/li>\u003cli>다른 상황을 다시 시험하려면 설문에서 “Start a new test”를 누릅니다. 새로고침만 하면 하던 시험을 이어갑니다.\u003c/li>\u003c/ol>\u003cp>이 주소는 24시간 동안만 사용할 수 있고 실제 모집용이 아닙니다. 이전 시험 기록은 남겨 둔 채 다시 시작할 수 있습니다. 다시 시험하려고 참여자 번호를 꾸미거나 예전 응답을 삭제할 필요는 없습니다.\u003c/p>\u003cdetails>\u003csummary>AI가 확인할 연결 정보\u003c/summary>\u003cp>gq_preview는 비공개 시험 권한입니다. Test에서만 허용하고 Production·만료·다른 연구의 권한은 거절해야 합니다. 이 임시 주소를 공개하거나 실제 참여자에게 보내지 않습니다.\u003c/p>\u003c/details>\u003ch2>5. 답이 저장됐는지 결과에서 확인하세요\u003c/h2>\u003cp>\u003cbutton data-page=\"guide\" data-topic=\"results\">모인 응답 확인하고 내려받기\u003c/button>에서 “시험 응답”과 “Prolific”을 선택하세요. 넣었던 답과 종료 상태가 맞는지, CSV에도 필요한 정보가 있는지 봅니다. 철회한 시험의 답은 이후 결과와 다운로드에서 없어야 합니다. 반환·중복 방지에 필요한 최소 식별 정보는 참여자에게 안내한 범위에서 남을 수 있고, 이미 내려받은 사본은 따로 관리해야 합니다.\u003c/p>\u003ch2>6. 소규모 유료 시험 후 본격 모집을 결정하세요\u003c/h2>\u003cp>예상 시간, 인원, 보상과 화면에 표시되는 총액을 먼저 확인합니다. 실제 참여자에게는 연결 시험용 선택 화면이 아니라 연구 안내와 정상적인 설문 과제를 보여주어야 합니다. 일부러 동의를 거부하거나 철회하는 역할을 시키지 마세요.\u003c/p>\u003cp>준비가 되면 AI가 검토한 실제 설문 주소로 초안의 개인 시험용 주소를 바꾸고, 참가자가 보는 안내와 보관 기간을 확인한 뒤 게시를 승인합니다. 한 명의 시험은 연결 확인에는 도움이 되지만 연구의 타당성까지 입증하지는 않습니다. 자료가 모이면 Prolific 제출 기록과 저장된 응답을 맞춰 보고 정상 완료를 승인합니다. 파일에 답이 있다는 것만으로 지급까지 된 것은 아닙니다.\u003c/p>\u003ch2>Prolific이 검토 때문에 잠시 멈추면\u003c/h2>\u003cp>“별도 조치가 필요 없다”는 안내라면 설정과 예산을 유지하고 검토 결과를 기다리세요. 시험이 잠시 멈춘 것만으로 설문이 고장났다고 볼 수는 없습니다. 같은 연구를 다시 만들거나 반복해서 게시·충전하지 말고, 받은 안내를 AI와 함께 확인하세요.\u003c/p>\u003ch2>현재까지 확인한 범위\u003c/h2>\u003cp>2026-10-26, greedyQ의 첫 1명 유료 Prolific 연결 시험을 마쳤습니다. 저장된 답변을 Prolific 제출 기록과 내려받은 CSV에 대조했고, 이후 연구자가 참여자 승인과 보상 지급을 완료했다고 확인했습니다. 승인·지급은 연구자의 직접 확인이며 AI가 별도 거래 영수증을 조회한 것은 아닙니다.\u003c/p>\u003cp>초안의 “Preview”에서는 정상 완료·동의 거부·철회·새 시험 시작도 따로 확인했습니다. 기본적인 연결과 사용 흐름을 시험한 것이며 모든 연구 설계나 계정의 작동을 보증하는 것은 아닙니다.\u003c/p>\u003ch2>어떤 확인이 더 남아 있나요?\u003c/h2>\u003cul>\u003cli>완료 시각을 기록하는 개선은 자동 시험과 연결된 가상 응답으로 확인했습니다. 개선 후 첫 실제 유료 응답은 아직 없으며 다음 연구의 첫 응답에서 확인할 수 있습니다. 예전 자료의 빈 시각은 그대로 보존했습니다.\u003c/li>\u003cli>설문 도중 참여 조건을 확인해 일부 사람을 일찍 종료한다면, 해당 연구의 Prolific 반환 처리와 보상을 따로 확인하세요.\u003c/li>\u003cli>새 계정·연구·큰 표본은 그에 맞는 확인이 필요합니다. 기본 연결에는 서명 링크 검증이나 모집·지급 자동화가 포함되지 않습니다.\u003c/li>\u003cli>이번 시험의 보관 자료와 비공개 다운로드 사본은 담당자가 2026-11-25까지 삭제해야 합니다. 자동 정리가 끝난 상태는 아닙니다.\u003c/li>\u003c/ul>\u003cp>기본 연결을 다시 확인한다는 이유만으로 추가 유료 참여자를 모집할 필요는 없습니다.\u003c/p>\u003cp>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/PROLIFIC-SETUP(kor).md\" target=\"_blank\" rel=\"noopener\">더 자세한 설정 설명\u003c/a>\u003c/p>\u003cp>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/docs/prolific-paid-test-completion-2026-10-26(kor).md\" target=\"_blank\" rel=\"noopener\">검증 기록과 남은 확인 범위\u003c/a>\u003c/p>","prompt":"아래 greedyQ 시작 안내를 읽고 따라줘. 읽을 수 없으면 멈추고 알려줘:\n\u003chttps://greedyq.netlify.app/>\n\n검토한 greedyQ 연구를 Prolific에 연결해줘. 미게시 초안을 준비하고 참여 조건·보상 결정을 확인한 뒤, 받은 완료 경로를 Test 모드와 비공개 반복 시험 링크로 검사해줘. 저장 ID·철회 답변 삭제·보호된 CSV를 확인해. 계정 단계는 쉬운 말로 하나씩 설명하고 내가 해당 단계를 명시적으로 선택하기 전에는 게시·모집·승인·지급하지 마. Prolific 내부 검토로 중지되면 설정을 보존하고 대기 상태를 정확히 알려줘."},{"id":"results","title":"모인 응답 확인하고 내려받기","lead":"“결과 보기 링크”에서 시험 답변과 실제 연구 답변을 구분하고 분석할 자료를 받습니다.","body":"\u003ch2>“결과 보기 링크”를 여세요\u003c/h2>\u003cp>AI에게 받은 결과용 주소를 열고, 요청되면 허가받은 Vercel 계정으로 로그인하세요. 여기서 몇 명이 응답했는지, 어떤 답을 골랐는지, 어느 질문에서 멈췄는지를 살펴볼 수 있습니다. 화면에 표시된 연구 이름이 맞는지도 먼저 확인하세요.\u003c/p>\u003ch2>연습 답변과 실제 연구 답변을 나누어 봅니다\u003c/h2>\u003cp>\u003cstrong>“실제 응답”\u003c/strong>(Real responses)은 실제 연구를 위해 받은 답변입니다. \u003cstrong>“시험 응답”\u003c/strong>(Test responses)은 연결을 확인하려고 넣은 연습 답변입니다. 처음 시험한 뒤 “실제 응답”이 비어 있다고 저장에 실패한 것은 아닙니다. “시험 응답”을 선택하고 “새로 고침”(Refresh)을 눌러보세요.\u003c/p>\u003cp>직접 접속한 시험이면 출처를 “Direct”로, Prolific에서 시험했다면 “Prolific”으로 고릅니다. 이것은 답변이 들어온 경로를 고르는 기능입니다. Prolific을 거쳤더라도 시험용으로 받은 답은 여전히 “시험 응답”입니다. 목록이 계속 비면 AI에게 어느 시험 링크를 썼는지와 저장 결과를 확인해 달라고 하세요.\u003c/p>\u003ch2>처음에는 한 답변을 비교해 보세요\u003c/h2>\u003cp>시험용 설문에서 고른 답 하나를 기억해 두고 결과 화면에도 그대로 보이는지 확인하세요. 이후 참여자 수, 질문별 요약, 중간에 멈춘 위치를 차례로 살펴보면 됩니다. 이 화면은 수집 상황을 확인하는 곳이며, 필요한 통계 분석은 내려받은 자료로 따로 진행합니다.\u003c/p>\u003ch2>엑셀이나 통계 프로그램으로 가져가기\u003c/h2>\u003cp>\u003cstrong>“CSV 다운로드”\u003c/strong>(Download CSV)를 누르면 지금 화면에서 선택한 응답을 표 파일로 받습니다. 예를 들어 “시험 응답”과 “Prolific”을 선택했다면 그 자료만 받습니다. 어떤 열이 어떤 질문인지 모를 때는 “변수 설명”(Variable guide)을 열거나 AI에게 설명을 요청하세요.\u003c/p>\u003cp>아무도 답하지 않은 질문도 열은 남고 값은 빈칸일 수 있습니다. 표 문항은 문장별로 여러 열로 나뉠 수 있습니다. 자료를 새로 불러오는 중에는 다운로드가 잠시 안 될 수 있으니 완료 후 다시 눌러주세요.\u003c/p>\u003ch2>참여 철회와 개인정보\u003c/h2>\u003cp>새로 접수되어 정상 처리된 철회는 해당 참여자의 답변을 현재 저장소와 이후 다운로드에서 지웁니다. 이미 내려받은 파일까지 자동으로 지워지는 것은 아니므로 보관 사본도 연구 계획에 맞게 처리하세요. Prolific으로 돌아가거나 중복 참여를 막는 데 필요한 최소한의 식별 정보는 안내한 범위에서 남을 수 있습니다. 식별 정보가 포함된 결과 파일은 연구팀 안에서 안전하게 보관하세요.\u003c/p>\u003ch2>Prolific의 완료·지급은 별도로 확인합니다\u003c/h2>\u003cp>설문에 답이 저장된 것과 Prolific에 정상 제출된 것은 별개입니다. 실제 유료 참여가 끝나면 AI와 함께 플랫폼의 제출 기록과 응답을 맞춰 본 뒤 올바르게 완료한 참여를 승인하세요. 아직 Prolific을 설정하지 않았다면 \u003cbutton data-page=\"guide\" data-topic=\"prolific\">Prolific 연결하기\u003c/button>부터 보세요.\u003c/p>\u003cdetails>\u003csummary>예전 CSV의 완료 시각이 비어 있다면\u003c/summary>\u003cp>일부 이전 완료 기록에는 별도의 종료 시각이 없습니다. 수정 후에는 처음 종료된 시각을 기록하며 과거 답변이나 빈칸은 바꾸지 않습니다. 시각을 추측해 채우지 말고 AI에게 해당 기록을 확인해 달라고 하세요.\u003c/p>\u003c/details>","prompt":"아래 greedyQ 시작 안내를 읽고 따라줘. 읽을 수 없으면 멈추고 알려줘:\n\u003chttps://greedyq.netlify.app/>\n\n내 “결과 보기 링크”에서 시험 응답부터 함께 확인해줘. 직접 시험한 답과 Prolific에서 시험한 답을 따로 보여주고, 내가 넣은 답이 맞게 저장됐는지 설명해줘. 내려받는 CSV에 어떤 응답이 포함되는지와 각 열의 뜻도 쉬운 말로 알려줘. 실제 유료 제출이나 지급은 따로 확인해야 한다는 점을 구분해줘."},{"id":"prereg","title":"사전등록 초안 받기","lead":"응답을 모으기 전에 연구 계획을 정리해 등록하고 싶다면, AI에게 검토할 초안을 요청하세요.","body":"\u003ch2>연구에서 무엇을 미리 정할지 확인합니다\u003c/h2>\u003cp>어떤 가설을 검토할지, 몇 명의 응답을 모을지, 언제 수집을 끝낼지, 어떤 답을 제외하고 어떻게 분석할지 함께 정리합니다. 아직 정하지 못한 부분은 “확인 필요”로 남겨 달라고 하세요. AI가 빈칸을 임의로 채우면 안 됩니다.\u003c/p>\u003ch2>읽고 고칠 수 있는 문서로 받습니다\u003c/h2>\u003cp>greedyQ는 OSF 사전등록 양식의 항목별 초안과 관련 파일을 준비합니다. 기본 초안은 영어·한국어로 제공되며 다른 언어가 필요하면 요청하고 번역도 검토하세요. 단순히 설문을 미리 보는 단계라면 먼저 초안을 만들 필요는 없습니다.\u003c/p>\u003ch2>실제 등록은 연구자가 따로 합니다\u003c/h2>\u003cp>문서를 받았다고 OSF에 등록된 것은 아닙니다. 내용을 확인한 뒤 원하면 본인의 OSF 계정에서 직접 등록하세요. greedyQ가 OSF에 로그인하거나 제출해 주는 과정은 포함되지 않습니다. 설문이나 분석 계획을 바꾸면 사전등록 초안도 다시 맞춰 달라고 요청하세요.\u003c/p>","prompt":"아래 greedyQ 시작 안내를 읽고 따라줘. 읽을 수 없으면 멈추고 알려줘:\n\u003chttps://greedyq.netlify.app/>\n\n확정된 결정만으로 OSF 사전등록 초안을 만들어줘. 빠진 결정은 한 번에 하나씩 물어봐. OSF 로그인이나 제출은 하지 마."},{"id":"archive","title":"연구를 마치고 자료 보관하기","lead":"응답 수집이 끝나면 먼저 자료를 안전하게 받은 뒤, 더 쓰지 않는 서비스를 정리합니다.","body":"\u003ch2>“보관”을 AI에게 요청하세요\u003c/h2>\u003cp>“이 연구의 수집을 마치고 자료를 보관하고 싶어”라고 말하세요. AI는 어떤 연구를 끝낼지, 아직 응답 중인 사람이 있는지, 다른 연구와 서비스를 함께 쓰는지 확인해야 합니다. 확인 후 수집 종료를 승인합니다.\u003c/p>\u003ch2>먼저 내려받을 자료\u003c/h2>\u003cul>\u003cli>“실제 응답 CSV”: 실제 수집한 응답을 표로 받은 파일입니다.\u003c/li>\u003cli>“시험 응답 CSV”: 연결 확인을 위해 넣은 연습 응답입니다.\u003c/li>\u003cli>“보관 ZIP”: 연구 기록과 응답을 보관하기 위해 묶은 파일입니다.\u003c/li>\u003c/ul>\u003cp>CSV는 엑셀이나 통계 프로그램에서 열 수 있습니다. 결과 화면에서 고른 일부 응답만 내려받는 것과 전체 보관 자료를 받는 것은 다르므로 “전체 보관 자료”를 요청하세요. 중간에 멈춘 응답도 포함할 수 있습니다. 표 모양이 다르면 AI에게 어떤 파일을 분석에 쓰면 되는지 설명해 달라고 하세요.\u003c/p>\u003ch2>다운로드한 뒤 직접 확인하세요\u003c/h2>\u003cp>파일이 열리는지, 예상한 응답 수가 맞는지 확인하고 안전한 곳에 복사본을 하나 더 두세요. 원래 설문 폴더와 사진·음성·영상 자료도 따로 보관합니다. Prolific 식별 정보 등이 들어갈 수 있으므로 공개 홈페이지나 공개 저장소에 올리지 마세요.\u003c/p>\u003ch2>저장 확인 후 서비스를 멈춥니다\u003c/h2>\u003cp>“자료를 내려받아 안전하게 저장했어”라고 확인한 다음에만 해당 연구 전용 서비스를 멈추도록 승인하세요. 다른 연구가 함께 쓰는 서비스는 멈추면 안 됩니다. 서비스 중지는 자료의 영구 보관을 보장하는 기능이 아니므로 보관 책임과 서비스 정책도 확인합니다.\u003c/p>\u003ch2>연구 종료 후에도 연락 방법은 남겨 두세요\u003c/h2>\u003cp>설문을 닫으면 더 이상 답을 받지 않습니다. 서비스를 완전히 멈추면 설문 대신 제공업체의 이용 불가 화면이 나올 수도 있습니다. 이후 참여 철회 요청을 받을 연락처를 유지하고, 필요한 경우 이미 내려받은 자료에도 처리 내용을 반영하세요.\u003c/p>","prompt":"아래 greedyQ 시작 안내를 읽고 따라줘. 읽을 수 없으면 멈추고 알려줘:\n\u003chttps://greedyq.netlify.app/>\n\n수집을 마치고 이 연구를 보관하도록 도와줘. 응답 중인 참여자와 공유 서비스를 먼저 확인해줘. 자료를 내려받고 내가 안전하게 저장했다고 확인할 때까지 기다려줘. 프로젝트는 삭제하지 마."},{"id":"upgrade","title":"하던 연구 이어가기·새 연구 만들기","lead":"저장해 둔 설문을 계속 만들거나, 일부를 고치거나, 원본을 두고 새 연구로 복사할 수 있습니다.","body":"\u003ch2>어떤 작업인지 먼저 알려주세요\u003c/h2>\u003cul>\u003cli>“이어가기”: 지난번에 하던 연구를 계속합니다.\u003c/li>\u003cli>“수정하기”: 같은 연구에서 필요한 부분만 바꿉니다.\u003c/li>\u003cli>“새 연구로 복사하기”: 원본을 보존하고 별도 연구를 만듭니다. greedyQ에서는 이를 “포크”라고도 부릅니다.\u003c/li>\u003c/ul>\u003cp>AI에게 저장한 연구 폴더를 제공하고 원하는 방식을 말하세요. 새 연구에는 원래 참여자의 응답이 자동으로 넘어가지 않도록 해야 합니다.\u003c/p>\u003ch2>그사이 greedyQ가 업데이트됐다면\u003c/h2>\u003cp>AI가 저장한 연구와 새 버전의 차이를 설명하도록 요청하세요. 원하면 별도 사본에서 업그레이드하고 컴퓨터·휴대전화 미리보기를 다시 확인합니다. 원본을 덮어쓰거나 연구 결정을 조용히 바꾸면 안 됩니다. 이미 실제 응답을 받는 연구는 먼저 변경 계획을 별도로 세워야 합니다.\u003c/p>\u003ch2>멈춘 설문을 다시 열 때\u003c/h2>\u003cp>서비스를 다시 켜는 일과 참여자를 다시 받는 일은 별개입니다. “같은 연구를 다시 열고 싶어”라고 요청하면 AI가 저장과 결과 화면을 확인한 뒤, 수집을 다시 시작해도 되는지 물어봐야 합니다. 보관용 ZIP은 분석 자료이며 온라인 설문을 자동으로 복구하는 파일은 아닙니다.\u003c/p>","prompt":"아래 greedyQ 시작 안내를 읽고 따라줘. 읽을 수 없으면 멈추고 알려줘:\n\u003chttps://greedyq.netlify.app/>\n\n저장한 연구를 재개하자. 현재 greedyQ 버전과 차이를 설명해줘. 승인 후 별도 사본을 업그레이드하고 두 미리보기를 보여줘. 연구 결정과 원본 파일은 보존해줘."}],"aboutGroups":[["프로젝트",["identity","principles","contact"]],["호환성",["agents","support","export"]],["참고 자료",["citation","license","updates"]]],"about":[{"id":"identity","title":"greedyQ란?","lead":"범용 AI가 일관된 연구 절차를 따르도록 돕습니다.","body":"\u003cp>greedyQ는 AI와 대화하면서 온라인 설문과 실험을 만드는 방법입니다. 연구자는 무엇을 알고 싶은지 설명하고 문항과 화면을 검토합니다. AI는 greedyQ의 안내에 따라 필요한 질문을 하고 연구 자료와 작동하는 설문을 준비합니다.\u003c/p>\u003ch2>무엇을 함께 할 수 있나요?\u003c/h2>\u003cp>문항 작성뿐 아니라 참여 안내와 동의, 실험 그룹 배정, 분석 계획, 사전등록 초안, 응답 수집과 보관까지 이어갈 수 있습니다. 중요한 연구 결정과 데이터 관리 책임은 연구자에게 있습니다.\u003c/p>\u003ch2>사용하는 AI에 따라 가능한 작업이 다릅니다\u003c/h2>\u003cp>대화만 할 수 있는 AI는 문서와 파일을 준비합니다. 파일과 계정 작업이 가능한 AI는 승인받은 범위에서 온라인 연결과 시험도 도울 수 있습니다. 실제로 할 수 없는 작업은 가능한 것처럼 말해서는 안 됩니다.\u003c/p>\u003cdetails>\u003csummary>설계 방식 더 알아보기\u003c/summary>\u003cp>greedyQ는 “specification-driven, AI-native application”을 지향합니다. 사람이 읽을 수 있는 규약을 AI가 따라 애플리케이션을 구성하며, 규약 묶음을 “agent-executable application specification”이라고 부릅니다. greedyQ 자체가 독립 에이전트인 것은 아닙니다. 사용하는 AI와 규약이 결합해 연구를 돕는 역할을 합니다.\u003c/p>\u003c/details>"},{"id":"principles","title":"연구자의 결정권","lead":"중요한 결정을 명시하고 연구를 재현 가능하게 유지합니다.","body":"\u003cul>\u003cli>중요한 연구 결정은 바꾸기 전에 묻습니다.\u003c/li>\u003cli>모르는 답은 만들지 않고 미정으로 기록합니다.\u003c/li>\u003cli>기술 보고서보다 실제 참여자 화면을 검토합니다.\u003c/li>\u003cli>연구 파일과 정확한 소프트웨어 버전을 보관합니다.\u003c/li>\u003cli>미리보기·계정 연결·모집 승인을 구분합니다.\u003c/li>\u003cli>응답 데이터는 연구자가 관리합니다.\u003c/li>\u003c/ul>\u003cp>기본 경로는 Vercel·Supabase를 사용하는 브라우저 설문입니다. 고급 작업에는 원본 직접 편집과 native Surveydown 내보내기를 사용할 수 있습니다.\u003c/p>"},{"id":"contact","title":"연락처","lead":"버그 제보, 문의, 제안을 환영합니다.","body":"\u003cp>버그를 발견했거나 문의 또는 제안이 있다면 주저하지 말고 다음 주소로 이메일을 보내주세요: \u003ca href=\"mailto:greedyq.contact@gmail.com\">greedyq.contact@gmail.com\u003c/a>.\u003c/p>"},{"id":"agents","title":"이용 가능한 AI 에이전트","lead":"설문을 만들 때는 지원되는 데스크톱 앱을 사용하세요. AI 모델 이름뿐 아니라 어떤 앱과 기능을 쓰는지도 중요합니다.","body":"\u003ch2>현재 이용할 수 있는 앱\u003c/h2>\u003cp>현재 greedyQ는 필요한 에이전트 기능이 있는 \u003cstrong>ChatGPT·Claude 데스크톱 앱\u003c/strong>에서 설문 제작을 지원합니다. 컴퓨터에 앱을 다운로드해 설치하고 여세요. AI 웹사이트, 브라우저에서 설치한 웹사이트 바로가기, 파일 작업 도구가 없는 일반 채팅은 지원되는 설문 제작 환경이 아닙니다.\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>앱\u003c/th>\u003cth>사용할 기능\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>ChatGPT 데스크톱\u003c/td>\u003ctd>제공되는 경우 Work 또는 Codex를 사용합니다. 연구 폴더에 접근해 파일을 만들고 미리보기를 실행할 수 있어야 합니다.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Claude Desktop\u003c/td>\u003ctd>Cowork·Code 등 적절한 에이전트 기능을 사용합니다. 연구 폴더에 접근하고 파일·작업 도구가 실제로 동작해야 합니다.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>앱을 설치하거나 유료 모델을 구독하는 것만으로 모든 기능이 준비되지는 않습니다. AI는 연구 질문을 시작하기 전에 greedyQ 가이드와 필요한 파일을 모두 읽고, 실제 파일을 만들고, 작동하는 미리보기를 열 수 있는지 확인해야 합니다. 외부 계정 권한은 배포를 선택한 때 따로 확인합니다.\u003c/p>\u003cp>\u003ca href=\"https://learn.chatgpt.com/docs/app\" target=\"_blank\" rel=\"noopener\">ChatGPT 데스크톱 설치 안내\u003c/a> · \u003ca href=\"https://claude.com/download\" target=\"_blank\" rel=\"noopener\">Claude Desktop 다운로드\u003c/a>\u003c/p>\u003ch2>향후 지원 검토: Gemini\u003c/h2>\u003cp>\u003cstrong>Gemini는 데스크톱 앱을 포함해 현재 지원하지 않습니다.\u003c/strong> 향후 지원 여부를 가장 먼저 검토할 대상으로 두었습니다. 가이드와 고정 파일 읽기, 설문 생성·시험, 승인 후 배포, 결과 확인, 아카이빙까지 전체 과정을 검증한 뒤 지원 여부를 정합니다. 지원 시점은 정해지지 않았습니다. 제보된 접근 실패를 확인되지 않은 Google 전체의 GitHub 차단 정책 때문이라고 단정하지 않습니다.\u003c/p>\u003ch2>그 밖의 검토 후보\u003c/h2>\u003cp>Meta AI, Grok, DeepSeek도 추후 검토할 수 있습니다. 이들은 \u003cstrong>추가 검토 후보\u003c/strong>이며 현재 지원하거나 출시를 약속한 대상은 아닙니다. 모델 이름이나 개발 국가만으로 greedyQ에 필요한 파일·실행·계정 연결 도구가 있다고 볼 수 없습니다. 실제 앱과 에이전트 환경별로 같은 사용 과정 시험을 통과해야 지원 목록에 추가합니다.\u003c/p>\u003ch2>참여자는 계속 웹브라우저로 응답합니다\u003c/h2>\u003cp>이 조건은 연구자가 설문을 만드는 AI에 관한 것입니다. 참여자는 컴퓨터나 휴대폰의 일반 웹브라우저에서 응답할 수 있습니다. 연구자도 홈페이지 읽기, 미리보기 검토, 결과 확인, 서비스 로그인 승인은 웹브라우저에서 할 수 있습니다.\u003c/p>","prompt":""},{"id":"support","title":"지원 범위","lead":"호환성은 기능별로 판단합니다. 전체 동등성을 보장하지 않습니다.","body":"\u003ch2>대부분의 질문은 예시에서 골라 시작합니다\u003c/h2>\u003cp>짧은 답, 긴 의견, 하나 또는 여러 개 선택, 사진 선택, 점수·슬라이더·표 질문을 만들 수 있습니다. 음성·영상, 순위, 100점 배분 같은 예시도 있습니다. 원하는 문항을 \u003cbutton data-page=\"guide\" data-topic=\"controls\">질문 형식 골라보기\u003c/button>에서 먼저 체험해 보세요.\u003c/p>\u003ch2>보이는 화면을 기준으로 확인하세요\u003c/h2>\u003cp>일부 글자 꾸밈이나 화면 설정은 원하는 대로 적용되지 않을 수 있습니다. AI는 실제 지원 여부를 설명하고 미리보기로 확인해야 합니다. 참여자의 IP 주소나 브라우저 정보를 자동으로 모으는 기능은 현재 제공하지 않습니다. 필요한 정보는 연구 계획에 맞게 따로 논의하세요.\u003c/p>\u003ch2>질문 이동과 배정에도 적용 범위가 있습니다\u003c/h2>\u003cp>답에 따라 다른 문항을 보여주거나 일부 질문의 순서를 바꿀 수 있습니다. 더 복잡한 배정과 화면이 필요하면 기본 기능으로 가능한지부터 확인하고 추가 작업을 협의하세요. 임의의 프로그램을 설문 안에 넣어 바로 실행하는 방식은 아닙니다.\u003c/p>\u003ch2>직접 확인한 내용과 아직 확인하지 못한 내용을 구분합니다\u003c/h2>\u003cp>예제에서 작동한 기능도 본인의 실제 설문·계정에서 다시 시험해야 합니다. Prolific의 첫 유료 시험은 검토 결과를 기다리고 있어 실제 유료 제출과 지급의 최종 확인은 남아 있습니다. “Onboard your agent” 연결 시험은 팀 조회까지 확인했으며, 그 경로로 새 설문을 공개하는 전체 과정까지 검증한 것은 아닙니다.\u003c/p>"},{"id":"export","title":"Native Surveydown 내보내기","lead":"다른 실행 환경을 선택하기 전에 차이를 검토하세요.","body":"\u003ch2>R을 사용해 더 자유롭게 바꾸고 싶다면\u003c/h2>\u003cp>기본 greedyQ 설문은 AI가 준비한 브라우저 화면으로 사용하면 됩니다. R·Shiny·Quarto 경험이 있고 더 자유로운 변경이 필요하다면, AI에게 “surveydown에서 이어서 작업할 수 있는 파일도 만들어줘”라고 요청할 수 있습니다.\u003c/p>\u003ch2>옮긴 뒤 달라지는 점을 먼저 확인하세요\u003c/h2>\u003cp>greedyQ에서 보던 모든 동작이 그대로 옮겨지는 것은 아닙니다. 예를 들어 문항·페이지 순서 섞기, 고정 블록 배정, 다시 접속했을 때 같은 배정을 유지하는 동작에는 차이가 있습니다. AI가 그대로 쓰는 기능, 변환해서 다시 시험할 기능, 지원하지 않는 기능을 나누어 설명해야 합니다.\u003c/p>\u003cp>파일을 만들었다는 말만으로 같은 설문이 검증된 것은 아닙니다. 실제 surveydown 환경에서 참여자처럼 시험한 뒤 사용하세요. 기본 사용에 이 과정을 거칠 필요는 없습니다.\u003c/p>"},{"id":"citation","title":"연구 소프트웨어 인용","lead":"greedyQ만 실행했어도 두 프로젝트를 함께 인용합니다.","body":"\u003cp>논문이나 학위논문에서 greedyQ를 사용했다면 greedyQ와 surveydown을 함께 인용해 주세요. AI에게 “이 설문을 만든 버전에 맞는 참고문헌과 연구 방법 문장을 준비해줘”라고 요청할 수 있습니다. 실제로 실행하지 않은 소프트웨어를 실행했다고 쓰면 안 됩니다.\u003c/p>\u003ch2>참고문헌\u003c/h2>\u003cp>greedyQ project. (2026). \u003cem>greedyQ: A specification-driven, AI-native application for online academic research\u003c/em> (Version &lt;release identifier&gt;) [Computer software]. GitHub.\u003c/p>\u003cp>Hu, P., Bunea, B., &amp; Helveston, J. (2025). surveydown: An open-source, markdown-based platform for programmable and reproducible surveys. \u003cem>PLOS ONE, 20\u003c/em>(8), e0331002. DOI: 10.1371/journal.pone.0331002.\u003c/p>\u003ch2>방법 절 문구 예시\u003c/h2>\u003cdiv data-snippet=\"methods\">\u003c/div>\u003ch2>BibTeX\u003c/h2>\u003cdiv data-snippet=\"bib\">\u003c/div>"},{"id":"license","title":"라이선스와 출처","lead":"MIT 라이선스의 독립 오픈소스 프로젝트입니다.","body":"\u003cp>greedyQ는 문서화된 Surveydown 방식의 일부 작성 규칙을 독립적으로 구현합니다. Surveydown 소스 코드를 포함하거나 재배포하지 않습니다.\u003c/p>\u003cp>Surveydown은 앞선 MIT 라이선스 오픈소스 연구입니다. Copyright © 2025 John Paul Helveston, Pingfan Hu, Bogdan Bunea.\u003c/p>\u003cp>greedyQ는 Surveydown 또는 그 관리자의 제휴·보증·후원·관리를 받지 않습니다. Surveydown 언급은 호환성·출처·내보내기 대상을 설명합니다.\u003c/p>\u003ch2>구분할 사항\u003c/h2>\u003cp>학술 사용 시 두 프로젝트를 인용하라는 요청은 소프트웨어 라이선스 준수와 별개입니다. 소프트웨어 라이선스가 연구 데이터나 사전등록 문서의 라이선스를 정하지는 않습니다.\u003c/p>"},{"id":"updates","title":"버전과 업데이트","lead":"내 연구에 실제로 사용된 버전을 확인하세요.","body":"\u003cp>현재 안내와 예제의 버전은 \u003cstrong>0.2_2026-10-26_ed1dc2b\u003c/strong>이며, 마지막 반영일은 2026-10-26입니다. 버전 번호는 어떤 시점의 greedyQ로 설문을 만들었는지 구분하는 표시입니다. 외울 필요는 없고, AI가 연구 파일에 기록해 두어야 합니다. 새 기능을 쓰고 싶다면 저장한 연구를 보여주고 업데이트할 부분을 먼저 설명해 달라고 요청하세요.\u003c/p>\u003cul class=\"history\">\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-10-26_ed1dc2b(kor).md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-10-26_ed1dc2b\u003c/code>\u003c/a>\u003cbr>짧은 공개 입구 START-HERE와 전체 초기화 규약 INITIALIZE를 분리했습니다. 같은 Markdown에서 정적 HTML을 생성하고 Netlify 게시를 준비했습니다. 실제 주소·AI 읽기는 별도 확인이 필요하며 기존 연구의 잠근 버전을 유지합니다.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-10-26_fa94594(kor).md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-10-26_fa94594\u003c/code>\u003c/a>\u003cbr>v0.2 문서를 마감 정리했습니다. 첫 앱 확인·중단 지침과 이용 가능한 AI 에이전트 호환성 페이지를 포함합니다. 현재 필요한 기능이 있는 ChatGPT·Claude 데스크톱을 지원하고 Gemini는 향후 검토, Meta AI·Grok·DeepSeek는 추가 후보입니다. 옛 Chat 모드·유료 시험 상태·제품 단계·SQL 수 설명을 언어별로 맞췄습니다.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-10-26_ecadf63(kor).md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-10-26_ecadf63\u003c/code>\u003c/a>\u003cbr>영어·한국어·중국어 시작하기 설명 바로 아래에 지원 안내를 추가했습니다. 필요한 기능이 있는 ChatGPT·Claude 데스크톱 앱을 사용하고 Gemini는 현재 지원하지 않습니다. 확인되지 않은 Google의 GitHub 차단 정책을 단정하지 않으며 홈페이지 이동·복사 검사 4개를 통과했습니다.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-10-26_e10197b(kor).md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-10-26_e10197b\u003c/code>\u003c/a>\u003cbr>Prolific 기본 1명 유료 연결 시험을 마쳤으며 연구자가 참여 승인과 보상 지급을 명시적으로 확인했습니다.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-10-26_df6d737(kor).md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-10-26_df6d737\u003c/code>\u003c/a>\u003cbr>전체 초기화 절차를 INITIALIZE.md로 옮겼습니다. START-HERE.md는 짧은 공개 입구이며 같은 영어·한국어·중국어 Markdown에서 HTML을 생성합니다. 기존 링크와 저장된 연구의 잠금 버전 재개를 유지합니다.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-10-26_beac897(kor).md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-10-26_beac897\u003c/code>\u003c/a>\u003cbr>영어·한국어·중국어 소개 &gt; 호환성에 이용 가능한 AI 에이전트 페이지를 추가했습니다. 필요한 기능이 있는 ChatGPT·Claude 데스크톱을 지원하며 Gemini는 향후 지원 검토, Meta AI·Grok·DeepSeek는 추가 검토 후보로만 표시합니다.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-10-26_b3edd07(kor).md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-10-26_b3edd07\u003c/code>\u003c/a>\u003cbr>v0.2 지원 범위를 마감하고 오래된 검증·무작위화 안내를 정정했으며 기존 종료 화면을 네 언어에서 재시험했습니다.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-10-26_ac2c85a(kor).md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-10-26_ac2c85a\u003c/code>\u003c/a>\u003cbr>추가 마이그레이션 009로 CBC 서버 동의·블록/순서 유지·노출/선택 저장·철회·보호된 결과·실제/시험 CSV·보관을 구현했습니다. 실제 로컬 PostgreSQL과 컴퓨터·모바일의 가상 응답자로 검증했습니다.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-10-26_a4ad99e(kor).md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-10-26_a4ad99e\u003c/code>\u003c/a>\u003cbr>v0.3 미리보기용 CBC CSV·Excel 가져오기, Python·브라우저 동일 결과, 설계 개수 검사와 단일 컴퓨터·모바일 미리보기를 구현했습니다. 실제 CBC 수집은 아직 지원하지 않습니다.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-10-26_4e977e4(kor).md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-10-26_4e977e4\u003c/code>\u003c/a>\u003cbr>설문이 처음 종료된 서버 시각을 기록하고 재저장에도 유지합니다. 과거 시각과 답변은 그대로 보존합니다.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-10-26_2b581a3(kor).md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-10-26_2b581a3\u003c/code>\u003c/a>\u003cbr>파일·미리보기 도구가 있는 ChatGPT 데스크톱 Work/Codex 또는 Claude Desktop을 공식 제작 경로로 정했습니다. Gemini(데스크톱 포함)와 AI 웹 앱은 공식 지원하지 않으며 영어·한국어·중국어 가이드, 홈페이지 프롬프트와 시작 전 기능 확인을 동기화했습니다.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-10-25_f2afa11(kor).md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-10-25_f2afa11\u003c/code>\u003c/a>\u003cbr>기존 Vercel/Supabase 여정을 유지하고 승인된 공식 연결을 우선 활용하며 Onboard your agent를 선택 사항으로 안내합니다.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-10-25_7beafe4(kor).md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-10-25_7beafe4\u003c/code>\u003c/a>\u003cbr>임시 로컬 DB와 가상 응답으로 초보 연구자의 홈페이지 → 설문 작성 → 미리보기 → 결과 → 아카이빙 여정을 검증했습니다.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-10-25_15d4d3e(kor).md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-10-25_15d4d3e\u003c/code>\u003c/a>\u003cbr>필수 슬라이더의 자동 응답과 조건부 후속 문항을 바로잡고 로컬 검토와 배포에 같은 브라우저 화면을 사용합니다.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-10-25_0af2387(kor).md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-10-25_0af2387\u003c/code>\u003c/a>\u003cbr>기본 Prolific ID 기록·분리된 반복 Preview·원자적 철회 답변 삭제·보호된 결과/CSV·내부 검토 상태 처리를 정리했습니다.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-09-10_c4a8405(kor).md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-09-10_c4a8405\u003c/code>\u003c/a>\u003cbr>실제 browser에서 반응형 화면, interaction, 재접속, dashboard, CSV end-to-end test를 추가했습니다.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-09-09_fcb3c86(kor).md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-09-09_fcb3c86\u003c/code>\u003c/a>\u003cbr>greedyQ 전용 control을 Surveydown `sd_question_custom()`과 생성된 Shiny binding으로 내보내고 검토 상태를 명시합니다.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-09-09_ee423e6(kor).md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-09-09_ee423e6\u003c/code>\u003c/a>\u003cbr>생성되는 `survey.qmd`에 추적 가능한 greedyQ release identifier를 추가하고 Python과 JavaScript에서 결정론적으로 검증하도록 했습니다.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-09-09_e770a9c(kor).md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-09-09_e770a9c\u003c/code>\u003c/a>\u003cbr>프로젝트 전체에 적용되는 학술 인용 정책을 추가했습니다.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-09-09_9d9ffe9(kor).md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-09-09_9d9ffe9\u003c/code>\u003c/a>\u003cbr>Rank order, side-by-side, NPS, timing, constant sum, pick/group/rank, drill-down을 greedyQ extension으로 추가했습니다.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-09-09_825f6fb(kor).md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-09-09_825f6fb\u003c/code>\u003c/a>\u003cbr>Vercel 기반 연구자 결과 대시보드와 서버 전용 결과 API를 추가했습니다.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-09-09_5ce7a3a(kor).md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-09-09_5ce7a3a\u003c/code>\u003c/a>\u003cbr>휴대폰에서도 desktop preview가 고정된 desktop canvas 너비를 유지하도록 수정했습니다.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-09-09_40c5053(kor).md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-09-09_40c5053\u003c/code>\u003c/a>\u003cbr>미완료 응답에서도 CSV에 모든 설문 변수가 유지되도록 수정했습니다.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-09-09_3aefdd0(kor).md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-09-09_3aefdd0\u003c/code>\u003c/a>\u003cbr>가상 test session만 사용하는 browser-native Supabase connection tester를 추가했습니다.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-09-09_2f20a8c(kor).md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-09-09_2f20a8c\u003c/code>\u003c/a>\u003cbr>Self-describe textbox를 포함한 조건부 후속 문항이 선택 즉시 나타나도록 복구했습니다.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-09-09_236d2a3(kor).md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-09-09_236d2a3\u003c/code>\u003c/a>\u003cbr>모바일에서 NPS 응답 박스 11개가 기본적으로 한 줄에 맞도록 수정했습니다.\u003c/li>\u003c/ul>\u003cp>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/README(kor).md\" target=\"_blank\" rel=\"noopener\">전체 업데이트 이력\u003c/a> · \u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/PROLIFIC-SETUP(kor).md\" target=\"_blank\" rel=\"noopener\">Prolific 연결·검증 한계\u003c/a>\u003c/p>"}],"methods":"본 설문은 greedyQ(버전 \u003c사용 릴리스>)를 사용하여 제작·배포했다. greedyQ의 설문 명세는 Surveydown(Hu, Bunea, & Helveston, 2025)의 survey-as-code 접근과 survey.qmd 작성 규칙을 바탕으로 한다.","examples":"\u003cp>가상 문항을 직접 눌러보고 내 연구에 맞는 문항을 AI에게 요청하세요.\u003c/p>\u003cp>\u003ca href=\"https://zomtoli7.github.io/greedyQ/examples/control-gallery/preview.html\" target=\"_blank\">\u003cstrong>공개 문항 갤러리 새 탭에서 열기 ↗\u003c/strong>\u003c/a>\u003c/p>\u003cp>갤러리는 가상 참여자만 사용하며 외부 서비스에 응답을 쓰지 않습니다. 실제 참여자나 연구 데이터를 입력하지 마세요. 공개 갤러리 연결을 확인했지만 주소는 특정 릴리스에 고정되어 있지 않습니다. 첨부 작업본의 새 기능과 차이가 있을 수 있습니다.\u003c/p>","clipUI":{"play":"재생","pause":"일시정지","replay":"다시 재생","step":"다음 장면","caption":"실제 갤러리 조작 화면 · 영문 데모 · 단계별 재생","alt":"greedyQ 갤러리에서 실제로 조작한 컨트롤 화면","jump":"컨트롤 찾기","standard":"기본 문항","extensions":"greedyQ 확장","hidden":"시간 기록은 숨겨진 기능으로 참여자가 직접 답하는 화면이 없습니다. 에이전트에게 기록된 시간과 활용 방식을 보여 달라고 요청하세요.","test":"컴퓨터·휴대폰 미리보기와 저장값을 설명하고, 연구 결정을 바꾸기 전에는 내게 확인해줘."},"controlPrompts":{"short_text":"아래 greedyQ 시작 안내를 읽고 따라줘. 읽을 수 없으면 멈추고 알려줘:\n\u003chttps:
