document.addEventListener('click',e=>{let c=e.target.closest('.copy');if(c){copy(c);return;}let b=e.target.closest('[data-page]');if(b){e.preventDefault();route(b.dataset.page,b.dataset.topic);return;}if(e.target.closest('[data-skip]')){e.preventDefault();$('#main').focus();}});window.addEventListener('hashchange',()=>{readHash();render();window.scrollTo(0,0);});render();})({"en":{"nav":["Home","Start","Guide","Examples","About"],"copy":"Copy","copied":"Copied","selectCopy":"Select text to copy","promptLabel":"Ask your AI","contents":"Contents","next":"Next","previous":"Previous","menu":"Menu","language":"Language","draft":"v0.2 · 0.2_2026-10-26_ed1dc2b · 2026-10-26","home":{"eyebrow":"Online research, through conversation","title":"Be greedy with your time.","sub":"Just ask your AI to make your questionnaire.","text":"Describe your study. Review a working survey. Keep control of the research.","start":"Start a survey","example":"Explore examples","steps":[["Describe","Tell your AI what you want to learn and who should take part."],["Review","Try the questionnaire on desktop and mobile."],["Approve","Approve the study and connections before collecting responses."]],"note":"First install and open ChatGPT desktop or Claude Desktop on your computer. greedyQ uses agent features that work directly with files and execute tasks. Therefore, greedyQ does not officially support AI web apps. Gemini is also currently unsupported, including its desktop app."},"start":{"title":"Start with your research question.","lead":"First install and open ChatGPT desktop or Claude Desktop on your computer, then ask your AI as follows.","prompt":"Read and follow the greedyQ start page. If you cannot read it, stop and tell me:\n\u003chttps://greedyq.netlify.app/>\n\nCreate a new study. Ask one question at a time and guide me to an interactive desktop-and-mobile preview.\n\nI want to learn: [research question]\nParticipants: [who should take part]\n\nFirst ask whether I want to write the questions myself or review an AI draft. Do not connect accounts or deploy yet.","after":"Use this prompt in the installed desktop app, not an AI website or a website shortcut. The AI must first check its actual tools. If it cannot read the guide, it should try the plain-text source or read a complete downloaded repository/guide inside the desktop app. It must not invent missing instructions or proceed after a reported permission failure. A downloaded guide does not add missing tools. Once the desktop app and guide are ready, discuss your research one question at a time. Browser previews need no service account. Approve Vercel sign-in and required connections only when you choose deployment; existing authorized official connections are reused first and Onboard your agent remains optional.","returnTitle":"Returning to a study?","returnText":"Provide your study folder. Resume the existing version, request a specific change, or fork an independent copy. Upgrade only after reviewing the differences.","action":"Build your first questionnaire","supportNote":"Note: greedyQ currently supports authoring only in ChatGPT and Claude desktop apps with the required agent tools. Gemini is not supported because guide access and the complete execution workflow have not been verified."},"guideGroups":[["Create",["first","controls","flow","appearance","preview"]],["Experiments",["random"]],["Collect",["deploy","prolific","results","prereg"]],["Return",["archive","upgrade"]]],"guide":[{"id":"first","title":"Make your first questionnaire","lead":"Start with what you want to learn and whose opinions you want. Your AI asks one question at a time.","body":"\u003ch2>Supported authoring environment\u003c/h2>\u003cp>First install and open ChatGPT desktop or Claude Desktop. Gemini is not officially supported, including its desktop app. Enable its file-and-task/agent features. AI web apps are officially unsupported by greedyQ.\u003c/p>\u003cp>greedyQ requires an installed desktop AI app for creating or modifying studies. AI web apps are officially unsupported. Download ChatGPT desktop or Claude Desktop from the official provider. Gemini is not officially supported, including its desktop app. Use an agent-enabled mode that can read the complete guide, create real files and run the canonical preview; installing an app or paying for a model alone does not establish these capabilities. Ordinary desktop chat without these tools is not a supported authoring route. Participant surveys, computer/mobile previews and the researcher results page still run in a web browser.\u003c/p>\u003cp>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/SUPPORTED-ENVIRONMENTS.md\">Supported authoring environment\u003c/a>\u003c/p>\u003ch2>Begin with the research idea\u003c/h2>\u003cp>You can say, “I want to know how satisfied people are after using our service.” You do not need a finished protocol or question list. The AI asks about your purpose, participants and the university, company or research-team name to show at the top.\u003c/p>\u003ch2>Choose who writes the first questions\u003c/h2>\u003cp>To write them yourself, say, “Create only a welcome and ending page, then ask me for my first question.” Give one question or several in order. For help with a draft, say, “Prepare questions that fit my purpose.” Review every suggestion; the research decisions remain yours.\u003c/p>\u003cdiv data-control-prompt=\"first-draft\">\u003c/div>\u003cdiv data-control-prompt=\"first-manual\">\u003c/div>\u003ch2>It is fine not to know yet\u003c/h2>\u003cp>Say “not decided” rather than guessing. The AI should keep that decision open. Detailed ethics and consent work can wait until you have seen a questionnaire draft, but must be settled before real participants begin.\u003c/p>\u003ch2>Describe it in words, then try the screen\u003c/h2>\u003cp>Ask for a five-point satisfaction scale, several choices, or a question shown only after a particular answer. Once the flow is coherent, try the “Preview” yourself instead of reviewing a report alone.\u003c/p>\u003cdiv data-control-prompt=\"first-research\">\u003c/div>\u003ch2>If the AI cannot open the guide\u003c/h2>\u003cp>Use this prompt in the installed desktop app, not an AI website or a website shortcut. The AI must first check its actual tools. If it cannot read the guide, it should try the plain-text source or read a complete downloaded repository/guide inside the desktop app. It must not invent missing instructions or proceed after a reported permission failure. A downloaded guide does not add missing tools. Once the desktop app and guide are ready, discuss your research one question at a time. Browser previews need no service account. Approve Vercel sign-in and required connections only when you choose deployment; existing authorized official connections are reused first and Onboard your agent remains optional.\u003c/p>\u003cp>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/GUIDE-ACCESS.md\" target=\"_blank\" rel=\"noopener\">Step-by-step guide access help\u003c/a>\u003c/p>","prompt":""},{"id":"controls","title":"Explore question formats","lead":"Try the examples and ask your AI for the format that fits your research.","body":"\u003cp>These are different ways to ask participants a question. Try an example and copy its request to your AI. You do not need to memorize code names. For a special design, agree how it should look and work, and what extra effort is needed, before implementation.\u003c/p>\u003cnav class=\"control-index\" aria-label=\"Find a control\">\u003ca href=\"#control-short_text\" data-control-jump=\"control-short_text\">Short answer\u003c/a>\u003ca href=\"#control-long_text\" data-control-jump=\"control-long_text\">Long answer\u003c/a>\u003ca href=\"#control-number\" data-control-jump=\"control-number\">Number\u003c/a>\u003ca href=\"#control-single\" data-control-jump=\"control-single\">Single choice\u003c/a>\u003ca href=\"#control-multiple\" data-control-jump=\"control-multiple\">Multiple choice\u003c/a>\u003ca href=\"#control-buttons\" data-control-jump=\"control-buttons\">Single-choice buttons\u003c/a>\u003ca href=\"#control-multi_buttons\" data-control-jump=\"control-multi_buttons\">Multiple-choice buttons\u003c/a>\u003ca href=\"#control-image\" data-control-jump=\"control-image\">Single image choice\u003c/a>\u003ca href=\"#control-multi_image\" data-control-jump=\"control-multi_image\">Multiple image choices\u003c/a>\u003ca href=\"#control-menu\" data-control-jump=\"control-menu\">Dropdown\u003c/a>\u003ca href=\"#control-labeled_slider\" data-control-jump=\"control-labeled_slider\">Labeled slider\u003c/a>\u003ca href=\"#control-numeric_slider\" data-control-jump=\"control-numeric_slider\">Numeric slider\u003c/a>\u003ca href=\"#control-range_slider\" data-control-jump=\"control-range_slider\">Range slider\u003c/a>\u003ca href=\"#control-one_date\" data-control-jump=\"control-one_date\">Date\u003c/a>\u003ca href=\"#control-date_range\" data-control-jump=\"control-date_range\">Date range\u003c/a>\u003ca href=\"#control-one_matrix\" data-control-jump=\"control-one_matrix\">Single-choice matrix\u003c/a>\u003ca href=\"#control-multi_matrix\" data-control-jump=\"control-multi_matrix\">Multiple-choice matrix\u003c/a>\u003ca href=\"#control-audio_example\" data-control-jump=\"control-audio_example\">Audio stimulus\u003c/a>\u003ca href=\"#control-video_example\" data-control-jump=\"control-video_example\">Video stimulus\u003c/a>\u003ca href=\"#control-rank_example\" data-control-jump=\"control-rank_example\">Rank order\u003c/a>\u003ca href=\"#control-sbs_example\" data-control-jump=\"control-sbs_example\">Side-by-side ratings\u003c/a>\u003ca href=\"#control-nps_example\" data-control-jump=\"control-nps_example\">Recommendation likelihood\u003c/a>\u003ca href=\"#control-timing\" data-control-jump=\"control-timing\">Page timing\u003c/a>\u003ca href=\"#control-sum_example\" data-control-jump=\"control-sum_example\">Fixed-total allocation\u003c/a>\u003ca href=\"#control-group_rank_example\" data-control-jump=\"control-group_rank_example\">Group and rank\u003c/a>\u003ca href=\"#control-drill_example\" data-control-jump=\"control-drill_example\">Hierarchical choice\u003c/a>\u003ca href=\"#control-custom_example\" data-control-jump=\"control-custom_example\">Custom control\u003c/a>\u003c/nav>\u003cdiv class=\"control-list\">\u003csection class=\"control-item\" id=\"control-short_text\">\u003cp class=\"eyebrow\">Standard questions\u003c/p>\u003ch2>01 · Short answer\u003c/h2>\u003cp>One-line answers, labels or codes.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>Question name for the AI\u003c/summary>\u003ccode>text\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"short_text\">\u003c/div>\u003cdiv data-control-prompt=\"short_text\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-long_text\">\u003cp class=\"eyebrow\">Standard questions\u003c/p>\u003ch2>02 · Long answer\u003c/h2>\u003cp>Comments and explanations that need several lines.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>Question name for the AI\u003c/summary>\u003ccode>textarea\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"long_text\">\u003c/div>\u003cdiv data-control-prompt=\"long_text\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-number\">\u003cp class=\"eyebrow\">Standard questions\u003c/p>\u003ch2>03 · Number\u003c/h2>\u003cp>Age, quantity or amount; specify units and valid limits.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>Question name for the AI\u003c/summary>\u003ccode>numeric\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"number\">\u003c/div>\u003cdiv data-control-prompt=\"number\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-single\">\u003cp class=\"eyebrow\">Standard questions\u003c/p>\u003ch2>04 · Single choice\u003c/h2>\u003cp>Choose one category, or select all that apply. State which rule applies.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>Question name for the AI\u003c/summary>\u003ccode>mc\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"single\">\u003c/div>\u003cdiv data-control-prompt=\"single\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-multiple\">\u003cp class=\"eyebrow\">Standard questions\u003c/p>\u003ch2>05 · Multiple choice\u003c/h2>\u003cp>Choose one category, or select all that apply. State which rule applies.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>Question name for the AI\u003c/summary>\u003ccode>mc_multiple\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"multiple\">\u003c/div>\u003cdiv data-control-prompt=\"multiple\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-buttons\">\u003cp class=\"eyebrow\">Standard questions\u003c/p>\u003ch2>06 · Single-choice buttons\u003c/h2>\u003cp>The same single/multiple selection rules, displayed as prominent buttons for short lists.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>Question name for the AI\u003c/summary>\u003ccode>mc_buttons\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"buttons\">\u003c/div>\u003cdiv data-control-prompt=\"buttons\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-multi_buttons\">\u003cp class=\"eyebrow\">Standard questions\u003c/p>\u003ch2>07 · Multiple-choice buttons\u003c/h2>\u003cp>The same single/multiple selection rules, displayed as prominent buttons for short lists.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>Question name for the AI\u003c/summary>\u003ccode>mc_multiple_buttons\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"multi_buttons\">\u003c/div>\u003cdiv data-control-prompt=\"multi_buttons\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-image\">\u003cp class=\"eyebrow\">Standard questions\u003c/p>\u003ch2>08 · Single image choice\u003c/h2>\u003cp>Choose one or several image cards. Supply meaningful labels as well as images.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>Question name for the AI\u003c/summary>\u003ccode>mc_image\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"image\">\u003c/div>\u003cdiv data-control-prompt=\"image\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-multi_image\">\u003cp class=\"eyebrow\">Standard questions\u003c/p>\u003ch2>09 · Multiple image choices\u003c/h2>\u003cp>Choose one or several image cards. Supply meaningful labels as well as images.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>Question name for the AI\u003c/summary>\u003ccode>mc_multiple_image\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"multi_image\">\u003c/div>\u003cdiv data-control-prompt=\"multi_image\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-menu\">\u003cp class=\"eyebrow\">Standard questions\u003c/p>\u003ch2>10 · Dropdown\u003c/h2>\u003cp>Choose from a long category list. The initial empty prompt is not an answer.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>Question name for the AI\u003c/summary>\u003ccode>select\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"menu\">\u003c/div>\u003cdiv data-control-prompt=\"menu\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-labeled_slider\">\u003cp class=\"eyebrow\">Standard questions\u003c/p>\u003ch2>11 · Labeled slider\u003c/h2>\u003cp>Move across ordered labels, such as low to high. Stores the selected category value.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>Question name for the AI\u003c/summary>\u003ccode>slider\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"labeled_slider\">\u003c/div>\u003cdiv data-control-prompt=\"labeled_slider\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-numeric_slider\">\u003cp class=\"eyebrow\">Standard questions\u003c/p>\u003ch2>12 · Numeric slider\u003c/h2>\u003cp>Select one number or a lower–upper interval with two handles. Define endpoints and units.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>Question name for the AI\u003c/summary>\u003ccode>slider_numeric\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"numeric_slider\">\u003c/div>\u003cdiv data-control-prompt=\"numeric_slider\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-range_slider\">\u003cp class=\"eyebrow\">Standard questions\u003c/p>\u003ch2>13 · Range slider\u003c/h2>\u003cp>Select one number or a lower–upper interval with two handles. Define endpoints and units.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>Question name for the AI\u003c/summary>\u003ccode>slider_numeric\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"range_slider\">\u003c/div>\u003cdiv data-control-prompt=\"range_slider\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-one_date\">\u003cp class=\"eyebrow\">Standard questions\u003c/p>\u003ch2>14 · Date\u003c/h2>\u003cp>Ask for one calendar date or a start and end date.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>Question name for the AI\u003c/summary>\u003ccode>date\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"one_date\">\u003c/div>\u003cdiv data-control-prompt=\"one_date\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-date_range\">\u003cp class=\"eyebrow\">Standard questions\u003c/p>\u003ch2>15 · Date range\u003c/h2>\u003cp>Ask for one calendar date or a start and end date.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>Question name for the AI\u003c/summary>\u003ccode>daterange\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"date_range\">\u003c/div>\u003cdiv data-control-prompt=\"date_range\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-one_matrix\">\u003cp class=\"eyebrow\">Standard questions\u003c/p>\u003ch2>16 · Single-choice matrix\u003c/h2>\u003cp>Repeat one scale across several statements. Single-choice requires one answer per row; multiple-choice allows several.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>Question name for the AI\u003c/summary>\u003ccode>matrix\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"one_matrix\">\u003c/div>\u003cdiv data-control-prompt=\"one_matrix\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-multi_matrix\">\u003cp class=\"eyebrow\">Standard questions\u003c/p>\u003ch2>17 · Multiple-choice matrix\u003c/h2>\u003cp>Repeat one scale across several statements. Single-choice requires one answer per row; multiple-choice allows several.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>Question name for the AI\u003c/summary>\u003ccode>matrix_multiple\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"multi_matrix\">\u003c/div>\u003cdiv data-control-prompt=\"multi_matrix\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-audio_example\">\u003cp class=\"eyebrow\">greedyQ extensions\u003c/p>\u003ch2>18 · Audio stimulus\u003c/h2>\u003cp>Present media with normal playback controls. Add captions or transcripts when the research permits. Displaying media does not create an answer variable.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>Question name for the AI\u003c/summary>\u003ccode>audio\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"audio_example\">\u003c/div>\u003cdiv data-control-prompt=\"audio_example\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-video_example\">\u003cp class=\"eyebrow\">greedyQ extensions\u003c/p>\u003ch2>19 · Video stimulus\u003c/h2>\u003cp>Present media with normal playback controls. Add captions or transcripts when the research permits. Displaying media does not create an answer variable.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>Question name for the AI\u003c/summary>\u003ccode>video\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"video_example\">\u003c/div>\u003cdiv data-control-prompt=\"video_example\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-rank_example\">\u003cp class=\"eyebrow\">greedyQ extensions\u003c/p>\u003ch2>20 · Rank order\u003c/h2>\u003cp>Put the full list in preference order using explicit rank selectors, without precision dragging.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>Question name for the AI\u003c/summary>\u003ccode>rank_order\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"rank_example\">\u003c/div>\u003cdiv data-control-prompt=\"rank_example\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-sbs_example\">\u003cp class=\"eyebrow\">greedyQ extensions\u003c/p>\u003ch2>21 · Side-by-side ratings\u003c/h2>\u003cp>Compare several ratings sharing items and scales. On a phone, show clearly labeled sections.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>Question name for the AI\u003c/summary>\u003ccode>side_by_side\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"sbs_example\">\u003c/div>\u003cdiv data-control-prompt=\"sbs_example\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-nps_example\">\u003cp class=\"eyebrow\">greedyQ extensions\u003c/p>\u003ch2>22 · Recommendation likelihood\u003c/h2>\u003cp>Use the standard 0–10 likelihood scale, keeping all numbers and both endpoint labels visible.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>Question name for the AI\u003c/summary>\u003ccode>nps\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"nps_example\">\u003c/div>\u003cdiv data-control-prompt=\"nps_example\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-timing\">\u003cp class=\"eyebrow\">greedyQ extensions\u003c/p>\u003ch2>23 · Page timing\u003c/h2>\u003cp>Records hidden seconds-on-page metadata; it is not a visible question. Confirm its role in the study.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>Question name for the AI\u003c/summary>\u003ccode>timing\u003c/code>\u003c/details>\u003cp class=\"note\">Timing is hidden. Participants do not answer a visible control. Ask your agent to show the recorded timing value and explain how it is used.\u003c/p>\u003cdiv data-control-prompt=\"timing\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-sum_example\">\u003cp class=\"eyebrow\">greedyQ extensions\u003c/p>\u003ch2>24 · Fixed-total allocation\u003c/h2>\u003cp>Distribute a budget, time or 100 points across items. Show the running total and validate the agreed total.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>Question name for the AI\u003c/summary>\u003ccode>constant_sum\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"sum_example\">\u003c/div>\u003cdiv data-control-prompt=\"sum_example\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-group_rank_example\">\u003cp class=\"eyebrow\">greedyQ extensions\u003c/p>\u003ch2>25 · Group and rank\u003c/h2>\u003cp>Assign items to groups, then rank within each group using explicit fields.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>Question name for the AI\u003c/summary>\u003ccode>pick_group_rank\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"group_rank_example\">\u003c/div>\u003cdiv data-control-prompt=\"group_rank_example\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-drill_example\">\u003cp class=\"eyebrow\">greedyQ extensions\u003c/p>\u003ch2>26 · Hierarchical choice\u003c/h2>\u003cp>Narrow a path such as region → country → city. Each level shows only compatible choices.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>Question name for the AI\u003c/summary>\u003ccode>drill_down\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"drill_example\">\u003c/div>\u003cdiv data-control-prompt=\"drill_example\">\u003c/div>\u003c/section>\u003csection class=\"control-item\" id=\"control-custom_example\">\u003cp class=\"eyebrow\">greedyQ extensions\u003c/p>\u003ch2>27 · Custom control\u003c/h2>\u003cp>This example adapts an existing choice question. Agree images, selection behavior and the answers to retain before building. A custom design can need extra time and AI usage.\u003c/p>\u003cdetails class=\"control-code\">\u003csummary>Question name for the AI\u003c/summary>\u003ccode>custom\u003c/code>\u003c/details>\u003cdiv class=\"recording\" data-recording=\"custom_example\">\u003c/div>\u003cdiv data-control-prompt=\"custom_example\">\u003c/div>\u003c/section>\u003c/div>","prompt":""},{"id":"flow","title":"Plan the question flow","lead":"Decide who sees each question and how each person finishes the survey.","body":"\u003ch2>Describe the participant’s path\u003c/h2>\u003cp>Everyone need not see the same questions. Say, “Only people who have used the service should see satisfaction questions; thank everyone else and end.” The AI connects the screens accordingly.\u003c/p>\u003ch2>Use “View structure” to see the whole survey\u003c/h2>\u003cp>At the top of the preview, choose “View structure” and expand pages to inspect their questions. T means explanatory text; Q means a question. This outline does not change your questionnaire or save answers.\u003c/p>\u003ch2>Going forward and back\u003c/h2>\u003cp>You can hide “Previous”, leave it visible but unavailable, or allow normal use. If a stimulus needs a minimum exposure, request “Enable Continue after 12 seconds.” Choose the policy as part of your research design.\u003c/p>\u003ch2>Try different answers\u003c/h2>\u003cp>Try accepting and declining consent, meeting and missing eligibility, and every applicable ending. If something is wrong, tell the AI which answer you chose and which screen you expected next.\u003c/p>","prompt":"Read and follow the greedyQ start page. If you cannot read it, stop and tell me:\n\u003chttps://greedyq.netlify.app/>\n\nShow eligibility and consent-refusal routes on desktop and mobile. Apply only the required answers and navigation rules I approved. Ask before changing a research decision."},{"id":"appearance","title":"Change the screen and buttons","lead":"Ask for colors, wording, button names and behavior that fit your research.","body":"\u003ch2>Describe the look you want\u003c/h2>\u003cp>For example: “Use a white background, dark text and our university’s blue for the main button.” Ask the AI to check readability and comfortable tapping on both computer and phone.\u003c/p>\u003cdiv data-control-prompt=\"look-colors\">\u003c/div>\u003ch2>Change the words participants see\u003c/h2>\u003cp>You can change the team name, title, instructions, questions, choices and button names. Say which screen to change, and ask to keep the other research decisions unchanged.\u003c/p>\u003cdiv data-control-prompt=\"look-words\">\u003c/div>\u003ch2>A visible button need not be clickable\u003c/h2>\u003cul>\u003cli>“Show”: visible and usable.\u003c/li>\u003cli>“Hide”: absent from that page.\u003c/li>\u003cli>“Disable”: visible but cannot be clicked.\u003c/li>\u003c/ul>\u003cp>You might prevent going back after a stimulus or wait before allowing the next page. Waiting alone does not prove that someone read the material.\u003c/p>\u003cdiv data-control-prompt=\"look-buttons\">\u003c/div>\u003ch2>Check what happens with an incorrect answer\u003c/h2>\u003cp>Leave a required question blank or enter the wrong total. “Continue” should take you to the first question that needs attention, with an explanation above each affected question. A 100-point allocation also changes its total’s color while you answer. Review the opening, question, error and ending screens after changes.\u003c/p>","prompt":""},{"id":"preview","title":"Try the survey yourself","lead":"“Preview” lets you rehearse the participant experience before inviting anyone.","body":"\u003ch2>Answer from beginning to end\u003c/h2>\u003cp>Ask the AI to show computer and phone views together. You can answer each independently. These are practice answers, not real research responses. Keep this review screen separate from the link you later share.\u003c/p>\u003col>\u003cli>Try every page and check wording and order.\u003c/li>\u003cli>Leave required answers empty and inspect the explanation.\u003c/li>\u003cli>Go back or refresh and check that progress behaves as intended.\u003c/li>\u003cli>Try Other, free text and conditional questions.\u003c/li>\u003cli>For experiments, review every condition, stimulus and applicable refusal/withdrawal ending.\u003c/li>\u003c/ol>\u003ch2>Is it comfortable on a phone?\u003c/h2>\u003cp>Check text, images and tap areas. Matrix statements should appear separately, without dragging the whole page sideways. Check media captions and transcripts when the research permits them.\u003c/p>\u003ch2>Describe what you see\u003c/h2>\u003cp>Say “This question is too small” or “No should end the survey.” Ask the AI to preserve the other research decisions and show the corrected preview. Automated checks do not replace your own review.\u003c/p>\u003ch2>If you receive downloaded files\u003c/h2>\u003cp>A ZIP is a package of files. Extract it first, keep the files together, and double-click “preview.html” to open the browser preview. Do not open it inside the ZIP or remove companion files. If given “studio.html”, ask the AI which source files to select; its “Preview questionnaire” button starts a fresh practice preview. No service account is needed.\u003c/p>\u003cp>A slider normally counts as answered only after you move it. An explicitly agreed starting value can change this, so check that no unwanted default was added.\u003c/p>","prompt":"Read and follow the greedyQ start page. If you cannot read it, stop and tell me:\n\u003chttps://greedyq.netlify.app/>\n\nIn [question name or exact wording], change only [specific change]. Preserve all other questions, stored values, routing, and randomization. Briefly explain the change and show the revised question in the desktop and phone preview."},{"id":"random","title":"Assign groups and vary the order","lead":"Discuss which group people join and the order of questions or materials.","body":"\u003ch2>Assign participants at random\u003c/h2>\u003cp>“Assign equally likely to A or B” can mean an independent draw for each person, like a coin toss. This “simple random assignment” need not produce equal final groups. “Fixed-block assignment” instead arranges agreed numbers within small batches; for example, two A and two B assignments shuffled within each batch of four.\u003c/p>\u003cp>You choose the method. Dropout and an unfinished final batch can leave different analysis counts. A known batch size can also make later assignments predictable; discuss whether that matters.\u003c/p>\u003ch2>Shuffle questions or choices\u003c/h2>\u003cp>Ask to vary three questions while leaving the others fixed, or shuffle choices while keeping Other last. Some independent page groups can also be shuffled. Consent and pages with conditional navigation have restrictions the AI should explain first.\u003c/p>\u003ch2>Develop other procedures with your AI\u003c/h2>\u003cp>For example: “Randomly assign four groups, then show my prepared texts in participation order within each group.” The group draw is random; the text list is sequential. These are different parts of the design.\u003c/p>\u003cp>The AI first explains what exists and what needs extra implementation. Agree what happens when the list ends or someone stops. Test that refresh preserves the material and simultaneous arrivals receive the intended assignments. Other designs are not all built in, and can need more work and testing.\u003c/p>\u003ch2>Keep a record for analysis\u003c/h2>\u003cp>Ask the AI to retain group and presentation order in your data. A record that something was shown does not prove that it was read or understood.\u003c/p>","prompt":"Read and follow the greedyQ start page. If you cannot read it, stop and tell me:\n\u003chttps://greedyq.netlify.app/>\n\nExplain simple versus fixed-block assignment for A and B. Ask me to approve the ratio and assignment point. Separately shuffle the first four choices while keeping Other last. Show both conditions and check refresh/resume.\n\nRandomly assign participants to four equally likely groups. Within each group, show my prepared text list in participation order. Explain built-in support and any extension needed. Confirm order boundaries, list-end behavior, incomplete participation and analysis records before implementing, then test simultaneous arrivals, refresh and Test/Real separation."},{"id":"deploy","title":"Share your survey and collect answers","lead":"Approve the necessary sign-in and access; your AI helps prepare the online survey and results page.","body":"\u003ch2>Ready to share the survey?\u003c/h2>\u003cp>First try the “Preview” yourself and settle questions, consent, privacy and remaining research decisions. Then ask the AI to prepare for real responses. Confirm the account, data location and any costs before setup.\u003c/p>\u003ch2>Your AI helps with the connection\u003c/h2>\u003cp>Normally you sign in to Vercel and approve the access shown. Vercel makes the survey and results screens available online. Supabase stores responses; a connected AI should handle its setup, so you need not use a database editor.\u003c/p>\u003cp>The AI reuses an existing official Vercel connection first after checking your account and team. Otherwise it uses the established supported route. Team access may require an additional approval after login; check the team and permissions on the supplied link. Never send a password or private access token in chat.\u003c/p>\u003ch2>The two links you receive\u003c/h2>\u003cp>\u003cstrong>“Survey link”\u003c/strong> is the address you send to participants. They open it, read the information and answer. Use this address in invitations or study announcements.\u003c/p>\u003cp>\u003cstrong>“Results link”\u003c/strong> is for you to inspect and download collected answers. Research data should not become public merely because someone has the address, so the page is prepared to require an authorized research-team login. Keep this link within the team, rather than sending it to participants. Ask the AI to verify that people without permission cannot view the results.\u003c/p>\u003cp>\u003cstrong>“Preview”\u003c/strong> is the practice screen you used while reviewing. When recruitment begins, use the final “Survey link”, not the preview address. If unsure, ask the AI to label each address by its purpose.\u003c/p>\u003ch2>Check before sending invitations\u003c/h2>\u003cp>Ask the AI to submit a practice response and inspect it using the “Results link”. Confirm that answers are actually saved and you can open the results before approving recruitment. A page opening alone does not establish that responses are being collected.\u003c/p>\u003ch2>How will you recruit?\u003c/h2>\u003cp>For direct invitations by email or community, share the reviewed “Survey link”. To use Prolific, continue to \u003cbutton data-page=\"guide\" data-topic=\"prolific\">Connect to Prolific\u003c/button>. A Prolific survey receives launch details from that platform, so opening its bare address separately may not start it.\u003c/p>\u003ch2>Optional: “Onboard your agent”\u003c/h2>\u003cp>This prepares an AI environment to work with Vercel. It can be useful for repeat use, but is not required for greedyQ. You should not normally start by installing tools or restarting an app. Survey publishing and response storage still need their own checks.\u003c/p>\u003ch2>If your AI cannot operate accounts\u003c/h2>\u003cp>Some AI hosts can only chat. Save the complete study folder and ask how to continue in a supported environment. The AI must not claim a connection or deployment it did not perform.\u003c/p>","prompt":"Read and follow the greedyQ start page. If you cannot read it, stop and tell me:\n\u003chttps://greedyq.netlify.app/>\n\nUse the established greedyQ deployment journey. Reuse an already authorized official Vercel connection after verifying my account and team; otherwise use the supported existing route. Do not make Onboard your agent mandatory. If a team grant is missing, give me its approval link and retry after my approval. Verify saved Test responses and protected results before requesting collection approval."},{"id":"prolific","title":"Recruit participants with Prolific","lead":"Make the survey with greedyQ, then use Prolific to recruit and compensate participants. Rehearse with a draft first.","body":"\u003ch2>Before starting\u003c/h2>\u003cp>Prolific is a paid participant-recruitment service. Finish \u003cbutton data-page=\"guide\" data-topic=\"deploy\">Share your survey and collect answers\u003c/button> and keep the “Survey link” and your “Results link” ready. You do not need Prolific for direct invitations.\u003c/p>\u003ch2>1. Save a study draft\u003c/h2>\u003cp>Sign in to a researcher account, create a study and agree the title, description, eligibility, duration and reward with your AI. Save a draft before recruiting. Give the AI the draft page address so it can identify the study; never send passwords or private tokens.\u003c/p>\u003ch2>2. Use the complete survey address from your AI\u003c/h2>\u003cp>Paste the supplied address into the study’s survey-URL field. Extra information may follow the address so the survey can recognize a Prolific arrival. Do not invent or trim it. If unsure which setting to choose, tell the AI the label you see.\u003c/p>\u003cdetails>\u003csummary>When you need the setting names\u003c/summary>\u003cp>Use “Data collection” and “URL parameters” to pass PROLIFIC_PID, STUDY_ID and SESSION_ID exactly once each. The AI checks these with the address. These IDs are not cryptographic proof of identity or completion.\u003c/p>\u003c/details>\u003ch2>3. Prepare each ending separately\u003c/h2>\u003cp>Finishing, declining consent and withdrawing are different situations. Use “Completion paths” to agree their handling, then give the exact displayed return URLs/codes to the AI. Do not invent a code.\u003c/p>\u003cp>For refusal use “No consent” with “Request a return”; for withdrawal use a clearly named separate path with reviewed handling. If people can be screened out, review “Screened out” and compensation first. Checking an existing Prolific prescreener differs from introducing custom screening. The researcher decides rewards and ending actions. Opening a return address does not itself prove that the platform has returned the submission.\u003c/p>\u003ch2>4. Rehearse with the draft’s “Preview”\u003c/h2>\u003cp>This is Prolific’s own draft test, which checks entering and returning, rather than only the account-free greedyQ “Preview” for wording. Ask the AI to keep the connected test in Test mode.\u003c/p>\u003col>\u003cli>Open “Repeat Prolific preview” in your “Results link”.\u003c/li>\u003cli>Enter the survey address supplied by the AI and choose “Create repeat-test link”.\u003c/li>\u003cli>Put that private address in the Prolific draft.\u003c/li>\u003cli>Use Prolific “Preview” to try completion, refusal and withdrawal one at a time.\u003c/li>\u003cli>Choose “Start a new test” to try again. A refresh resumes the same attempt.\u003c/li>\u003c/ol>\u003cp>The private link lasts 24 hours and is not for real recruitment. Old attempts remain; you need not fabricate participant IDs or delete answers to repeat a test.\u003c/p>\u003cdetails>\u003csummary>Connection details for the AI\u003c/summary>\u003cp>gq_preview is private Test access, not a mode switch. Production, expired and wrong-study grants must be rejected. Do not publish this temporary address or send it to real participants.\u003c/p>\u003c/details>\u003ch2>5. Check the saved answers\u003c/h2>\u003cp>In \u003cbutton data-page=\"guide\" data-topic=\"results\">Review and download answers\u003c/button>, select Test responses and Prolific. Compare answers, endings and CSV records. A newly processed withdrawal must remove its answers from later results and downloads. Disclosed minimal administrative IDs may remain for return/duplicate handling; manage previous downloads separately.\u003c/p>\u003ch2>6. Decide on a small paid trial\u003c/h2>\u003cp>Confirm duration, count, reward and the displayed total. Real participants need a real information/consent page and task, not a test ending selector or an instruction to pretend to refuse/withdraw.\u003c/p>\u003cp>Replace the private test address with the reviewed real survey address, check participant information and retention, then approve publication. One participant can check a connection, not establish research validity. Match genuine platform submissions with saved responses before approving valid work. Stored answers alone do not prove payment.\u003c/p>\u003ch2>If Prolific pauses for review\u003c/h2>\u003cp>If the notice says no action is needed, preserve settings and budget and wait. A pause alone does not mean the survey is broken. Do not create duplicates or repeatedly publish/top up; review the actual notice with your AI.\u003c/p>\u003ch2>What has been checked?\u003c/h2>\u003cp>On 2026-10-26, greedyQ completed a one-person paid Prolific connection trial. The saved answers were matched to the participant submission and downloaded CSV. The researcher then confirmed approving the submission and paying the reward. Approval and payment are researcher-confirmed; the AI did not inspect a separate transaction receipt.\u003c/p>\u003cp>Real draft Preview checks separately covered completion, refusal, withdrawal and starting another test. This checks the basic connection journey, not the validity of every research design or every account.\u003c/p>\u003ch2>What still needs a separate check?\u003c/h2>\u003cul>\u003cli>The improved completion-time recording has passed automatic and connected test responses; its first new paid response has not yet been checked. It can be checked with the next study’s first response. Earlier empty timestamps were preserved.\u003c/li>\u003cli>If people can be screened out inside your survey, check the actual Prolific return and reward for that study.\u003c/li>\u003cli>A new account, study or larger sample needs its own relevant checks. The standard connection does not include signed-link verification or automatic recruitment/payment.\u003c/li>\u003cli>The operator still needs to delete this trial’s retained data and private downloaded copies by 2026-11-25. No automatic cleanup is claimed.\u003c/li>\u003c/ul>\u003cp>You do not need to pay for another participant merely to repeat the basic connection check.\u003c/p>\u003cp>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/PROLIFIC-SETUP.md\" target=\"_blank\" rel=\"noopener\">More detailed setup guidance\u003c/a>\u003c/p>\u003cp>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/docs/prolific-paid-test-completion-2026-10-26.md\" target=\"_blank\" rel=\"noopener\">Evidence and remaining limits\u003c/a>\u003c/p>","prompt":"Read and follow the greedyQ start page. If you cannot read it, stop and tell me:\n\u003chttps://greedyq.netlify.app/>\n\nConnect my reviewed greedyQ study to Prolific. Prepare an unpublished draft, confirm eligibility and reward decisions, and test the supplied completion paths in Test mode using a private repeat-preview link. Verify saved IDs, withdrawal erasure and the protected CSV. Explain each account step in plain language. Do not publish, recruit, approve or pay until I explicitly choose that step. If Prolific pauses for review, preserve the settings and report the pending status accurately."},{"id":"results","title":"Review and download answers","lead":"Use your “Results link” to separate practice from real answers and download your data.","body":"\u003ch2>Open your “Results link”\u003c/h2>\u003cp>Open the address from your AI and sign in with your authorized Vercel account when asked. Check the study name. You can see how many people answered, what they chose and where they stopped.\u003c/p>\u003ch2>Practice and research answers are separate\u003c/h2>\u003cp>\u003cstrong>“Real responses”\u003c/strong> are answers collected for the study. \u003cstrong>“Test responses”\u003c/strong> are practice answers used to check it. An empty Real view after practice is expected: choose Test responses and then “Refresh”.\u003c/p>\u003cp>Choose “Direct” for a direct test or “Prolific” for a platform test. This selects how people arrived; a Prolific test is still a test. If the list stays empty, ask the AI to check which test link was used and whether the answers saved.\u003c/p>\u003ch2>Compare one familiar answer first\u003c/h2>\u003cp>Remember an answer you gave in a practice survey and find it in the results. Then inspect counts, summaries and stopping points. This page helps you oversee collection; statistical analysis is done separately with downloaded data.\u003c/p>\u003ch2>Download for a spreadsheet or statistics tool\u003c/h2>\u003cp>\u003cstrong>“Download CSV”\u003c/strong> saves the answers currently selected on screen. If you selected Test and Prolific, only that set is downloaded. “Variable guide” explains the columns, or ask your AI to explain them in ordinary language.\u003c/p>\u003cp>Unanswered questions can still have columns with blank cells. Matrix statements may become several columns. Download may be unavailable while the page is refreshing; wait for completion and try again.\u003c/p>\u003ch2>Withdrawal and privacy\u003c/h2>\u003cp>A newly processed withdrawal removes that participant’s answers from the active store and subsequent exports. Files you already downloaded are not remotely deleted, so handle copies under your data plan. Disclosed minimal administrative identifiers may remain for returning to Prolific and preventing duplicates. Keep identifiable exports private.\u003c/p>\u003ch2>Check Prolific submission and payment separately\u003c/h2>\u003cp>Stored answers do not prove that Prolific accepted a submission. Match genuine paid submissions to saved responses before approving valid work. If Prolific is not set up, see \u003cbutton data-page=\"guide\" data-topic=\"prolific\">Connect to Prolific\u003c/button>.\u003c/p>\u003cdetails>\u003csummary>If an older CSV has an empty completion time\u003c/summary>\u003cp>Some earlier completed records have no separate end time. The correction records future first end times without changing old answers or filling old blanks with an estimated time. Ask the AI to check the record rather than guessing the time.\u003c/p>\u003c/details>","prompt":"Read and follow the greedyQ start page. If you cannot read it, stop and tell me:\n\u003chttps://greedyq.netlify.app/>\n\nShow my Test/Direct and Test/Prolific responses separately, refresh the results, and explain the filtered CSV. Confirm that a withdrawn test has no answers and that another response is unchanged. For a paid submission, compare the actual Prolific identifiers and completion before asking me to approve payment."},{"id":"prereg","title":"Get a preregistration draft","lead":"Ask the AI to prepare a plan you can review before collecting responses.","body":"\u003ch2>Decide what you will commit to\u003c/h2>\u003cp>Review the hypotheses, sample size, stopping rule, outcomes, exclusions and analysis. Mark undecided items “to confirm”; the AI must not invent missing decisions.\u003c/p>\u003ch2>Receive a document you can read and edit\u003c/h2>\u003cp>greedyQ prepares a field-by-field draft based on the OSF form, with supporting files. Default draft copies are English/Korean; request and review another translation if needed. You do not need a preregistration draft just to try a preview.\u003c/p>\u003ch2>Register it separately if you choose\u003c/h2>\u003cp>Receiving a draft does not register your study. Review it and use your own OSF account for any actual registration. greedyQ does not log in or submit it for you. If questions or analysis change, ask for an updated draft.\u003c/p>","prompt":"Read and follow the greedyQ start page. If you cannot read it, stop and tell me:\n\u003chttps://greedyq.netlify.app/>\n\nPrepare an OSF preregistration draft using confirmed decisions only. Ask about missing decisions one at a time. Do not log in to OSF or submit anything."},{"id":"archive","title":"Finish the study and keep your data","lead":"Download and check your data before pausing services you no longer need.","body":"\u003ch2>Ask to finish and archive\u003c/h2>\u003cp>Say, “Help me finish collection and keep this study’s data.” The AI should confirm the study, people still answering and any services shared with other studies before you approve closure.\u003c/p>\u003ch2>Files to receive first\u003c/h2>\u003cul>\u003cli>“Real-response CSV”: a table of research responses.\u003c/li>\u003cli>“Test-response CSV”: practice responses used to check the connection.\u003c/li>\u003cli>“Archive ZIP”: a package for keeping the study records and responses.\u003c/li>\u003c/ul>\u003cp>A CSV opens in common spreadsheet/statistics tools. The current results download may contain only the responses you selected, so request the complete archive separately. It can include incomplete responses. If table formats differ, ask which file to use for your analysis.\u003c/p>\u003ch2>Check your download\u003c/h2>\u003cp>Open the files, check expected counts, and save a secure second copy. Keep the original study folder and media too. Exports may include Prolific identifiers; do not upload them to a public page or repository.\u003c/p>\u003ch2>Pause only after confirming safe storage\u003c/h2>\u003cp>Tell the AI when the files are safely saved, then approve pausing dedicated services. Services used by other studies must stay running. Pausing is not a permanent data-storage guarantee; review retention responsibilities and provider policies.\u003c/p>\u003ch2>Keep a contact route\u003c/h2>\u003cp>A closed study stops accepting answers. A paused host might show the provider’s unavailable page. Keep a research-team contact for later withdrawal requests and handle downloaded copies under your data plan.\u003c/p>","prompt":"Read and follow the greedyQ start page. If you cannot read it, stop and tell me:\n\u003chttps://greedyq.netlify.app/>\n\nHelp me finish collection and archive this study. Check active participants and shared services first. Download the data and wait until I confirm safe storage. Do not delete projects."},{"id":"upgrade","title":"Continue, change or copy a study","lead":"Resume saved work, change an agreed part, or preserve the original and make a new study.","body":"\u003ch2>Tell the AI which task you mean\u003c/h2>\u003cul>\u003cli>“Resume”: continue the study you were making.\u003c/li>\u003cli>“Modify”: change an agreed part of the same study.\u003c/li>\u003cli>“Copy as a new study”: preserve the original and make an independent study; greedyQ also calls this a “fork”.\u003c/li>\u003c/ul>\u003cp>Provide your saved folder. Old participants’ responses must not automatically become data for a new study.\u003c/p>\u003ch2>If greedyQ has changed since then\u003c/h2>\u003cp>Ask for the differences. If you approve, upgrade a separate copy and review computer/phone previews again. Do not overwrite the original or quietly change research decisions. An actively collecting study needs its own reviewed change plan.\u003c/p>\u003ch2>Reopen a paused study\u003c/h2>\u003cp>Turning services on and accepting participants again are separate decisions. Ask to reopen the same study; the AI should check storage and results, then request collection approval. An archive ZIP is for keeping/analyzing data, not automatic restoration of the online service.\u003c/p>","prompt":"Read and follow the greedyQ start page. If you cannot read it, stop and tell me:\n\u003chttps://greedyq.netlify.app/>\n\nResume this saved study. Explain differences from the current greedyQ version. After my approval, upgrade a separate copy and show both previews. Preserve research decisions and the original files."}],"aboutGroups":[["Project",["identity","principles","contact"]],["Compatibility",["agents","support","export"]],["Reference",["citation","license","updates"]]],"about":[{"id":"identity","title":"What is greedyQ?","lead":"A consistent research workflow for a capable AI.","body":"\u003cp>greedyQ helps you make online surveys and experiments by talking with AI. Explain the research, review the questions and screens, and let the AI prepare the study materials and working survey under the greedyQ instructions.\u003c/p>\u003ch2>What does it cover?\u003c/h2>\u003cp>Questions, participant information and consent, group assignment, analysis plans, preregistration drafts, collection and archiving. Research decisions and responsibility for data remain with you.\u003c/p>\u003ch2>Your AI’s capabilities matter\u003c/h2>\u003cp>A chat-only host can prepare documents and files. A host with file/account tools can also help connect and test approved services. It must explain when it cannot perform a step.\u003c/p>\u003cdetails>\u003csummary>More about the architecture\u003c/summary>\u003cp>greedyQ is a “specification-driven, AI-native application”. Its “agent-executable application specification” tells a general-purpose AI how to instantiate and operate the research workflow. greedyQ itself is not an independent agent; the host AI and specification combine to provide the research-assistant role.\u003c/p>\u003c/details>"},{"id":"principles","title":"Researcher control","lead":"Keep decisions explicit and studies reproducible.","body":"\u003cul>\u003cli>Ask before changing meaningful research decisions.\u003c/li>\u003cli>Record unresolved questions instead of inventing answers.\u003c/li>\u003cli>Review the actual participant experience, not only a technical report.\u003c/li>\u003cli>Keep study files and the exact software version.\u003c/li>\u003cli>Separate preview, account connection and recruitment approvals.\u003c/li>\u003cli>Keep respondent data under researcher control.\u003c/li>\u003c/ul>\u003cp>The primary path uses a browser survey with Vercel and Supabase. Direct source editing and native Surveydown export remain options for advanced work.\u003c/p>"},{"id":"contact","title":"Contact","lead":"We welcome bug reports, questions and suggestions.","body":"\u003cp>If you have a bug report, question or suggestion, don’t hesitate to email us at \u003ca href=\"mailto:greedyq.contact@gmail.com\">greedyq.contact@gmail.com\u003c/a>.\u003c/p>"},{"id":"agents","title":"Available AI agents","lead":"Make your survey with a supported desktop app. Choose the app as well as the model.","body":"\u003ch2>Supported now\u003c/h2>\u003cp>greedyQ currently supports study creation in \u003cstrong>ChatGPT and Claude desktop apps\u003c/strong> with the necessary agent tools. Download and open the app on your computer. An AI website, a website shortcut installed from a browser, or ordinary chat without file tools is not a supported authoring environment.\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>App\u003c/th>\u003cth>What to use\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>ChatGPT desktop\u003c/td>\u003ctd>Use Work or Codex when available, with access to the study folder and tools to create files and run the preview.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Claude Desktop\u003c/td>\u003ctd>Use an appropriate agent mode such as Cowork or Code, with access to the study folder and working file/task tools.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>Installing an app or subscribing to a paid model does not by itself enable all required features. Before asking research questions, the AI should check that it can read the complete greedyQ guide, create real files and open a working preview. Account permissions are checked separately when you choose deployment.\u003c/p>\u003cp>\u003ca href=\"https://learn.chatgpt.com/docs/app\" target=\"_blank\" rel=\"noopener\">ChatGPT desktop installation\u003c/a> · \u003ca href=\"https://claude.com/download\" target=\"_blank\" rel=\"noopener\">Claude Desktop download\u003c/a>\u003c/p>\u003ch2>Planned support review: Gemini\u003c/h2>\u003cp>\u003cstrong>Gemini is not currently supported, including its desktop app.\u003c/strong> It is first in the future support-review list. Support will be considered after verifying the whole journey: reading the guide and fixed files, creating and testing the survey, deploying with approval, viewing results and archiving. There is no promised availability date. We do not attribute the reported access failures to an unverified provider-wide GitHub blocking policy.\u003c/p>\u003ch2>Other possible candidates\u003c/h2>\u003cp>Meta AI, Grok and DeepSeek may be considered later. These are evaluation candidates, not supported products or committed releases. A model name or country of origin does not establish the file, execution or account tools needed by greedyQ. Each actual app and agent environment must pass the same journey tests before it can join the supported list.\u003c/p>\u003ch2>Participants can still use a browser\u003c/h2>\u003cp>This rule concerns the AI you use to make the study. Participants can answer on a computer or phone in a normal browser. You can also use a browser to read this website, review a preview, see results and approve service sign-ins.\u003c/p>","prompt":""},{"id":"support","title":"Supported scope","lead":"Compatibility is feature-specific, not a promise of complete equivalence.","body":"\u003ch2>Start with a familiar question example\u003c/h2>\u003cp>Use short/long text, one or several choices, images, numbers, sliders and tables. Media, rankings and 100-point allocation examples are available too. Try \u003cbutton data-page=\"guide\" data-topic=\"controls\">Explore question formats\u003c/button> first.\u003c/p>\u003ch2>Judge the screen you actually see\u003c/h2>\u003cp>Some text/appearance settings may not apply as requested. The AI should explain support and demonstrate it. Automatic participant IP/browser-information collection is not provided; discuss any needed information under your research plan.\u003c/p>\u003ch2>Routing and assignment have limits\u003c/h2>\u003cp>You can show questions based on earlier answers and vary selected orders. For a more complex design, first discuss existing support and any extra implementation. Arbitrary programs are not executed from survey definitions.\u003c/p>\u003ch2>Separate evidence from work still to check\u003c/h2>\u003cp>Test your own study and account even when an example works. The first Prolific paid trial awaits review, so final paid-submission/payment verification is pending. “Onboard your agent” was verified through team reads, not a complete new-study deployment through that route.\u003c/p>"},{"id":"export","title":"Native Surveydown export","lead":"Review the differences before choosing another runtime.","body":"\u003ch2>Continue in R if you need more freedom\u003c/h2>\u003cp>Ordinary greedyQ use stays with the browser survey. Researchers with R/Shiny/Quarto experience can ask for files to continue in native surveydown for advanced customization.\u003c/p>\u003ch2>Check what changes after export\u003c/h2>\u003cp>Not every behavior transfers unchanged. Question/page shuffling, fixed-block assignment and assignment persistence across resume have differences. The AI must explain what carries over, what needs native testing and what is unsupported.\u003c/p>\u003cp>Generated files alone do not establish equivalence. Try the exported survey in its native environment before using it. This is not a required step for ordinary greedyQ use.\u003c/p>"},{"id":"citation","title":"Citing your study software","lead":"Cite both projects, including studies run only with greedyQ.","body":"\u003cp>If you use greedyQ in a paper or thesis, cite both greedyQ and surveydown. Ask the AI to prepare references and methods wording for the version used. Do not claim to have run software you did not run.\u003c/p>\u003ch2>References\u003c/h2>\u003cp>greedyQ project. (2026). \u003cem>greedyQ: A specification-driven, AI-native application for online academic research\u003c/em> (Version &lt;release identifier&gt;) [Computer software]. GitHub.\u003c/p>\u003cp>Hu, P., Bunea, B., &amp; Helveston, J. (2025). surveydown: An open-source, markdown-based platform for programmable and reproducible surveys. \u003cem>PLOS ONE, 20\u003c/em>(8), e0331002. DOI: 10.1371/journal.pone.0331002.\u003c/p>\u003ch2>Suggested methods wording\u003c/h2>\u003cdiv data-snippet=\"methods\">\u003c/div>\u003ch2>BibTeX\u003c/h2>\u003cdiv data-snippet=\"bib\">\u003c/div>"},{"id":"license","title":"License and attribution","lead":"An independent open-source project under the MIT License.","body":"\u003cp>greedyQ independently implements a documented subset of Surveydown-style authoring conventions. It does not incorporate or redistribute Surveydown source code.\u003c/p>\u003cp>Surveydown is prior MIT-licensed work. Copyright © 2025 John Paul Helveston, Pingfan Hu and Bogdan Bunea.\u003c/p>\u003cp>greedyQ is not affiliated with, endorsed by, sponsored by or maintained by Surveydown or its maintainers. References describe compatibility, provenance or an export target.\u003c/p>\u003ch2>Keep the distinctions clear\u003c/h2>\u003cp>The request to cite both projects for academic use is separate from software-license compliance. The software license does not determine the license of your research data or preregistration.\u003c/p>"},{"id":"updates","title":"Version and updates","lead":"Know which version your study actually uses.","body":"\u003cp>These guides and examples use \u003cstrong>0.2_2026-10-26_ed1dc2b\u003c/strong>, updated 2026-10-26. The version identifies which greedyQ release made a study. You need not memorize it; the AI records it in the study files. To use new features, provide your saved study and ask what an update would change before approving it.\u003c/p>\u003cul class=\"history\">\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-10-26_ed1dc2b.md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-10-26_ed1dc2b\u003c/code>\u003c/a>\u003cbr>Separate the short public START-HERE entry from the complete INITIALIZE workflow. Generate static HTML from the same Markdown and prepare Netlify hosting; the real public URL and AI readability still need verification. Saved studies retain their locked versions.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-10-26_fa94594.md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-10-26_fa94594\u003c/code>\u003c/a>\u003cbr>Finalize v0.2 documentation with the desktop-host first-action gate and the available AI agents compatibility page. Current support is capable ChatGPT/Claude desktop apps; Gemini is for future review and Meta AI, Grok, DeepSeek are evaluation candidates only. Reconcile obsolete Chat-mode, paid-pilot, product-stage and migration descriptions across languages.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-10-26_ecadf63.md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-10-26_ecadf63\u003c/code>\u003c/a>\u003cbr>Add a clearly visible support note immediately below the Start introduction in English, Korean and Chinese: use capable ChatGPT or Claude desktop apps; Gemini is currently unsupported. Describe unverified guide/execution support without inventing a Google GitHub-blocking policy. Website navigation and copy checks passed (4 tests).\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-10-26_e10197b.md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-10-26_e10197b\u003c/code>\u003c/a>\u003cbr>Complete the basic one-person Prolific paid connection test; approval and reward payment are explicitly researcher-confirmed.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-10-26_df6d737.md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-10-26_df6d737\u003c/code>\u003c/a>\u003cbr>Move the complete initialization workflow to INITIALIZE.md. Keep START-HERE.md as the short public front door and render its English/Korean/Chinese HTML directly from the same Markdown source; preserve existing links and pinned-study resume behavior.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-10-26_beac897.md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-10-26_beac897\u003c/code>\u003c/a>\u003cbr>Add About &gt; Compatibility &gt; Available AI agents in English, Korean and Chinese. Support capable ChatGPT/Claude desktop apps; list Gemini for future support review and Meta AI, Grok and DeepSeek as evaluation candidates only.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-10-26_b3edd07.md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-10-26_b3edd07\u003c/code>\u003c/a>\u003cbr>Close the supported v0.2 scope, correct stale verification/randomization guidance, and recheck the existing closed-study screen in four languages.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-10-26_ac2c85a.md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-10-26_ac2c85a\u003c/code>\u003c/a>\u003cbr>Implemented dedicated CBC server consent, block/order persistence, exposure/choice storage, withdrawal, protected results, real/test CSV and archives through additive migration 009; verified with synthetic participants in real local PostgreSQL and desktop/mobile browsers.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-10-26_a4ad99e.md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-10-26_a4ad99e\u003c/code>\u003c/a>\u003cbr>Implemented CBC CSV/Excel import, Python/browser parity, descriptive design checks and a standalone computer/mobile preview for the v0.3 preview line; live CBC collection remains disabled.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-10-26_4e977e4.md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-10-26_4e977e4\u003c/code>\u003c/a>\u003cbr>Record the first server-side survey end time and preserve it across retries; leave historical timestamps and answers unchanged.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-10-26_2b581a3.md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-10-26_2b581a3\u003c/code>\u003c/a>\u003cbr>Require ChatGPT desktop Work/Codex or Claude Desktop with working file and preview tools; Gemini (including desktop) and AI web apps are officially unsupported. Synchronize English, Korean and Chinese guides, website prompts, and the required host-readiness gate.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-10-25_f2afa11.md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-10-25_f2afa11\u003c/code>\u003c/a>\u003cbr>Keep the established Vercel/Supabase journey, prefer existing authorized official connections, and make Onboard your agent optional.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-10-25_7beafe4.md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-10-25_7beafe4\u003c/code>\u003c/a>\u003cbr>Verify the first-researcher website → questionnaire → browser → results → archive journey with a disposable local database and synthetic responses.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-10-25_15d4d3e.md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-10-25_15d4d3e\u003c/code>\u003c/a>\u003cbr>Fix untouched required sliders and conditional follow-up expressions; use the same browser screen for local checks and deployment.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-10-25_0af2387.md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-10-25_0af2387\u003c/code>\u003c/a>\u003cbr>Complete standard Prolific ID capture, isolated repeat Preview, atomic withdrawal erasure, protected results/CSV and routine-review evidence handling.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-09-10_c4a8405.md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-09-10_c4a8405\u003c/code>\u003c/a>\u003cbr>Add real-browser responsive, interaction, resume, dashboard, and CSV end-to-end testing.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-09-09_fcb3c86.md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-09-09_fcb3c86\u003c/code>\u003c/a>\u003cbr>Export greedyQ-only controls through Surveydown `sd_question_custom()` with generated Shiny bindings and explicit review status.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-09-09_ee423e6.md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-09-09_ee423e6\u003c/code>\u003c/a>\u003cbr>Added a traceable greedyQ release identifier to generated `survey.qmd` files and deterministic validation in Python and JavaScript.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-09-09_e770a9c.md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-09-09_e770a9c\u003c/code>\u003c/a>\u003cbr>Added a project-wide scholarly citation policy.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-09-09_9d9ffe9.md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-09-09_9d9ffe9\u003c/code>\u003c/a>\u003cbr>Added rank order, side-by-side, NPS, timing, constant sum, pick/group/rank, and drill-down controls as greedyQ extensions.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-09-09_825f6fb.md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-09-09_825f6fb\u003c/code>\u003c/a>\u003cbr>Added the Vercel-hosted researcher results dashboard and server-only results API.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-09-09_5ce7a3a.md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-09-09_5ce7a3a\u003c/code>\u003c/a>\u003cbr>Kept the desktop preview at a fixed desktop canvas width on phones.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-09-09_40c5053.md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-09-09_40c5053\u003c/code>\u003c/a>\u003cbr>Made CSV exports retain every questionnaire variable even when a response is incomplete.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-09-09_3aefdd0.md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-09-09_3aefdd0\u003c/code>\u003c/a>\u003cbr>Added a browser-native Supabase connection tester using synthetic test sessions only.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-09-09_2f20a8c.md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-09-09_2f20a8c\u003c/code>\u003c/a>\u003cbr>Restored immediate conditional follow-up fields, including self-describe text boxes.\u003c/li>\u003cli>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/0.2/0.2_2026-09-09_236d2a3.md\" target=\"_blank\" rel=\"noopener\">\u003ccode>0.2_2026-09-09_236d2a3\u003c/code>\u003c/a>\u003cbr>Fit all eleven NPS response boxes into one mobile row by default.\u003c/li>\u003c/ul>\u003cp>\u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/updates/README.md\" target=\"_blank\" rel=\"noopener\">Full update history\u003c/a> · \u003ca href=\"https://github.com/zomtoli7/greedyQ/blob/main/PROLIFIC-SETUP.md\" target=\"_blank\" rel=\"noopener\">Prolific setup and verification limits\u003c/a>\u003c/p>"}],"methods":"The questionnaire was created and deployed using greedyQ (version \u003crelease identifier>), whose survey specification builds on the survey-as-code approach and survey.qmd authoring conventions established by surveydown (Hu, Bunea, & Helveston, 2025).","examples":"\u003cp>Try imaginary questions, then ask your AI for controls that suit your research.\u003c/p>\u003cp>\u003ca href=\"https://zomtoli7.github.io/greedyQ/examples/control-gallery/preview.html\" target=\"_blank\">\u003cstrong>Open the public question gallery in a new tab ↗\u003c/strong>\u003c/a>\u003c/p>\u003cp>The gallery uses virtual participants and makes no external response writes. Do not enter real participant or research data. The public link works, but it is not pinned to a specific release. It may differ from new features in the handoff working copy.\u003c/p>","clipUI":{"play":"Play","pause":"Pause","replay":"Replay","step":"Next frame","caption":"Recorded in the live gallery · English demo · step-by-step playback","alt":"Actual control interaction recorded in the greedyQ gallery","jump":"Find a control","standard":"Standard questions","extensions":"greedyQ extensions","hidden":"Timing is hidden. Participants do not answer a visible control. Ask your agent to show the recorded timing value and explain how it is used.","test":"Show the desktop and phone preview, explain the saved values, and ask me before changing research decisions."},"controlPrompts":{"short_text":"Read and follow the greedyQ start page. If you cannot read it, stop and tell me:\n\u003chttps://greedyq.netlify.app/>\n\nAsk for a short project nickname in a single-line text box.\n\nShow the desktop and phone preview, explain the saved values, and ask me before changing research decisions.","long_text":"Read and follow the greedyQ start page. If you cannot read it, stop and tell me:\n\u003chttps://greedyq.netlify.app/>\n\nAsk what should improve, using a multiline answer box.\n\nShow the desktop and phone preview, explain the saved values, and ask me before changing research decisions.","number":"Read and follow the greedyQ start page. If you cannot read it, stop and tell me:\n\u003chttps://greedyq.netlify.app/>\n\nAsk weekly hours of service use as a number from 0 to 168, in hours.\n\nShow the desktop and phone preview, explain the saved values, and ask me before changing research decisions.","single":"Read and follow the greedyQ start page. If you cannot read it, stop and tell me:\n\u003chttps://greedyq.netlify.app/>\n\nAsk the main device used: computer, phone, or tablet. Allow exactly one choice.\n\nShow the desktop and phone preview, explain the saved values, and ask me before changing research decisions.","multiple":"Read and follow the greedyQ start page. If you cannot read it, stop and tell me:\n\u003chttps://greedyq.netlify.app/>\n\nAsk which devices were used this month. Allow every applicable choice: computer, phone, tablet.\n\nShow the desktop and phone preview, explain the saved values, and ask me before changing research decisions.","buttons":"Read and follow the greedyQ start page. If you cannot read it, stop and tell me:\n\u003chttps://greedyq.netlify.app/>\n\nShow Yes and No as prominent buttons for whether the participant has tried the service. Allow one answer.\n\nShow the desktop and phone preview, explain the saved values, and ask me before changing research decisions.","multi_buttons":"Read and follow the greedyQ start page. If you cannot read it, stop and tell me:\n\u003chttps://greedyq.netlify.app/>\n\nShow the features Search, Save, and Share as selectable buttons. Allow several selections.\n\nShow the desktop and phone preview, explain the saved values, and ask me before changing research decisions.","image":"Read and follow the greedyQ start page. If you cannot read it, stop and tell me:\n\u003chttps://greedyq.netlify.app/>\n\nShow our two approved package images with descriptive labels. Ask participants to choose one package.\n\nShow the desktop and phone preview, explain the saved values, and ask me before changing research decisions.","multi_image":"Read and follow the greedyQ start page. If you cannot read it, stop and tell me:\n\u003chttps://greedyq.netlify.app/>\n\nShow the approved product images with labels and let participants select all products they recognize.\n\nShow the desktop and phone preview, explain the saved values, and ask me before changing research decisions.","menu":"Read and follow the greedyQ start page. If you cannot read it, stop and tell me:\n\u003chttps://greedyq.netlify.app/>\n\nAsk for one field of study from my category list using a dropdown. Begin with an empty Choose one prompt.\n\nShow the desktop and phone preview, explain the saved values, and ask me before changing research decisions.","labeled_slider":"Read and follow the greedyQ start page. If you cannot read it, stop and tell me:\n\u003chttps://greedyq.netlify.app/>\n\nAsk perceived difficulty on an ordered slider: Very easy, Easy, Neutral, Difficult, Very difficult. Preserve category codes.\n\nShow the desktop and phone preview, explain the saved values, and ask me before changing research decisions.","numeric_slider":"Read and follow the greedyQ start page. If you cannot read it, stop and tell me:\n\u003chttps://greedyq.netlify.app/>\n\nAsk confidence from 0 to 10 with a numeric slider. Keep the current value and endpoints visible.\n\nShow the desktop and phone preview, explain the saved values, and ask me before changing research decisions.","range_slider":"Read and follow the greedyQ start page. If you cannot read it, stop and tell me:\n\u003chttps://greedyq.netlify.app/>\n\nAsk an acceptable monthly price interval from 0 to 100 using two handles. Show both selected limits and the currency.\n\nShow the desktop and phone preview, explain the saved values, and ask me before changing research decisions.","one_date":"Read and follow the greedyQ start page. If you cannot read it, stop and tell me:\n\u003chttps://greedyq.netlify.app/>\n\nAsk the date of the participant’s most recent service use with a calendar date field.\n\nShow the desktop and phone preview, explain the saved values, and ask me before changing research decisions.","date_range":"Read and follow the greedyQ start page. If you cannot read it, stop and tell me:\n\u003chttps://greedyq.netlify.app/>\n\nAsk the start and end dates of service use. Explain how reversed dates are handled before implementing the rule.\n\nShow the desktop and phone preview, explain the saved values, and ask me before changing research decisions.","one_matrix":"Read and follow the greedyQ start page. If you cannot read it, stop and tell me:\n\u003chttps://greedyq.netlify.app/>\n\nRate ease of use, speed, and clarity from Very poor to Excellent. Require one answer per row. Use row cards on phones.\n\nShow the desktop and phone preview, explain the saved values, and ask me before changing research decisions.","multi_matrix":"Read and follow the greedyQ start page. If you cannot read it, stop and tell me:\n\u003chttps://greedyq.netlify.app/>\n\nFor each product category, ask where it was purchased: store, website, app. Allow several selections in each row.\n\nShow the desktop and phone preview, explain the saved values, and ask me before changing research decisions.","audio_example":"Read and follow the greedyQ
